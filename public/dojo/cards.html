` остаётся.", "hint": "0 — falsy, но не null.", "added": "2026-10-27"}, {"id": "term-syntax-05", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «Template literals, ?. и ??» полностью, как на собеседовании (4 шага).", "a": "1. Что: шаблонные строки — строки в обратных кавычках с подстановкой `${}`; `?.` — опциональная цепочка; `??` — оператор нулевого слияния.\n2. Как работает: `?.` возвращает `undefined`, если слева `null` или `undefined`, вместо ошибки; `??` подставляет значение справа только для `null` и `undefined`.\n3. Пример: `user?.address?.city ?? 'не указан'`.\n4. Подвох: `||` заменяет все falsy (`0`, `''`), а `??` — только `null` и `undefined`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-test_e2e-01", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Как устроен тест на Playwright?", "code": "test('вход', async ({ page }) => {\n  await page.goto('/login');\n  await page.getByLabel('Email').fill('a@b.ru');\n  await page.getByRole('button', { name: 'Войти' }).click();\n  await expect(page).toHaveURL('/profile');\n});", "a": "Тест получает объект `page` — вкладку настоящего браузера. Переходим по адресу, находим элементы локаторами, действуем и проверяем результат через `expect`.", "hint": "page, локаторы, expect.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_e2e-02", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Что такое автоожидание в Playwright?", "a": "Перед действием Playwright сам ждёт, пока элемент появится, станет видимым и доступным. Не нужны ручные `sleep`, тесты стабильнее.", "hint": "Сам ждёт элемент.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_e2e-03", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Расскажи про тему «E2E на Playwright» полностью, как на собеседовании (4 шага).", "a": "1. Что: Playwright запускает настоящий браузер (Chromium, Firefox, WebKit) и проходит сценарий пользователя.\n2. Устройство теста: `test('логин', async ({ page }) => { await page.goto('/'); await page.getByLabel('Email').fill(...); await page.getByRole('button', { name: 'Войти' }).click(); await expect(page).toHaveURL('/profile'); })`.\n3. Плюсы: автоожидание элементов, локаторы по роли и тексту, трейсы и скриншоты при падении, параллельный запуск.\n4. Что покрывать: критичные сценарии — вход, регистрация, оплата, основная форма.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_jest-01", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Чем Vitest отличается от Jest?", "a": "API почти одинаковый. Vitest работает поверх Vite: использует ту же конфигурацию и трансформации, быстрее запускается и нативно понимает ESM и TypeScript.", "hint": "Тот же API, на Vite.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_jest-02", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Как устроен тест?", "code": "describe('formatPrice', () => {\n  test('добавляет валюту', () => {\n    const result = formatPrice(1500);      // act\n    expect(result).toBe('1 500 ₽');         // assert\n  });\n});", "a": "`describe` группирует тесты, `test` — один случай, `expect` с матчером — проверка. Внутри — подготовить, выполнить, проверить (Arrange, Act, Assert).", "hint": "describe, test, expect.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_jest-03", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Чем `toBe` отличается от `toEqual`?", "code": "expect({ a: 1 }).toBe({ a: 1 });    // ✗\nexpect({ a: 1 }).toEqual({ a: 1 });  // ✓", "a": "`toBe` сравнивает строго (`Object.is`), разные объекты не равны. `toEqual` сравнивает содержимое рекурсивно.", "hint": "Ссылка / содержимое.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_jest-04", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Расскажи про тему «Jest, Vitest и устройство теста» полностью, как на собеседовании (4 шага).", "a": "1. Что: Jest и Vitest — тест-раннеры с почти одинаковым API; Vitest работает на Vite — быстрее и без отдельной настройки сборки в Vite-проекте.\n2. Устройство теста: `describe` — группа, `test`/`it` — один случай, `expect(...).toBe/ toEqual/ toHaveBeenCalled` — проверки.\n3. Схема AAA: Arrange (подготовить) → Act (выполнить) → Assert (проверить).\n4. Подвох: `toBe` сравнивает по ссылке (`Object.is`), для объектов и массивов — `toEqual`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_mock-01", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Что такое мок?", "code": "const onSave = vi.fn();\nrender(<Form onSave={onSave} />);\nawait user.click(screen.getByRole('button', { name: 'Сохранить' }));\nexpect(onSave).toHaveBeenCalledWith({ name: '' });", "a": "Заглушка вместо настоящей зависимости. Можно задать её результат и проверить, как и с чем её вызвали.", "hint": "Подмена зависимости.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_mock-02", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Что стоит мокать, а что нет?", "a": "Мокать внешнее и нестабильное: сеть, таймеры, даты, случайные числа, браузерные API. Не мокать то, что проверяешь, и не мокать всё подряд — иначе тест проверяет моки, а не код.", "hint": "Внешнее, не своё.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_mock-03", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Что такое MSW?", "a": "Mock Service Worker — библиотека, которая перехватывает сетевые запросы и отдаёт заданные ответы. Компонент делает настоящий fetch, а тест не зависит от сервера.", "hint": "Мок сети.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_mock-04", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Расскажи про тему «Моки» полностью, как на собеседовании (4 шага).", "a": "1. Что: мок — подмена реальной зависимости управляемой заглушкой.\n2. Зачем: тест не зависит от сети, времени, случайности; можно задать ответ и проверить вызов.\n3. Как: `vi.fn()` / `jest.fn()` — функция-шпион; `vi.mock('./api')` — подмена модуля; MSW — перехват сетевых запросов на уровне fetch.\n4. Что мокать: внешнее — API, таймеры, даты, `localStorage`; не мокать то, что тестируешь, иначе тест ничего не проверяет.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_rtl-01", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Как RTL предлагает тестировать компоненты?", "a": "Как пользователь: найти элемент по роли, тексту или подписи, сделать действие, проверить результат на экране. Не проверять внутреннее состояние и детали реализации.", "hint": "Как пользователь.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_rtl-02", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Чем отличаются getBy, queryBy и findBy?", "code": "screen.getByText('Привет');          // нет — ошибка\nscreen.queryByText('Ошибка');        // нет — null\nawait screen.findByText('Загружено'); // ждёт", "a": "`getBy` бросает ошибку, если элемента нет. `queryBy` возвращает `null` — для проверки отсутствия. `findBy` возвращает промис и ждёт появления элемента.", "hint": "Ошибка / null / ждать.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_rtl-03", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Почему предпочитают `getByRole`?", "code": "screen.getByRole('button', { name: 'Отправить' });", "a": "Так ищут элементы пользователи и скринридеры. Заодно тест проверяет доступность: если кнопку нельзя найти по роли, с ней проблемы и у скринридера.", "hint": "Как скринридер.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_rtl-04", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Расскажи про тему «React Testing Library» полностью, как на собеседовании (4 шага).", "a": "1. Что: RTL тестирует компоненты как пользователь: ищет элементы по роли, тексту, подписи, а не по классам и внутреннему состоянию.\n2. Как работает: `render(<Comp />)` → `screen.getByRole('button', { name: 'Войти' })` → `userEvent.click` → `expect(...).toBeInTheDocument()`.\n3. Запросы: getBy — элемент есть, иначе ошибка; queryBy — вернёт null, для проверки отсутствия; findBy — ждёт появления (асинхронно).\n4. Принцип: «чем больше тест похож на реальное использование, тем больше уверенности»; приоритет поиска — getByRole.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_types-01", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Что такое unit-тест?", "code": "test('sum складывает', () => {\n  expect(sum(2, 3)).toBe(5);\n});", "a": "Тест одной функции или компонента в изоляции от остального. Быстрый, точно показывает, где ошибка.", "hint": "Один модуль изолированно.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_types-02", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Что такое e2e-тест?", "a": "Проверка целого сценария пользователя в настоящем браузере: от открытия страницы до результата. Самые близкие к реальности, но медленные и хрупкие.", "hint": "Весь сценарий в браузере.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_types-03", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Что такое пирамида тестирования?", "a": "Принцип пропорций: много быстрых unit-тестов внизу, меньше интеграционных в середине и немного медленных e2e сверху. Во фронтенде часто делают упор на интеграционные — «кубок тестирования».", "hint": "Много внизу, мало сверху.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_types-04", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Расскажи про тему «Виды тестов и пирамида» полностью, как на собеседовании (4 шага).", "a": "1. Unit — одна функция или компонент в изоляции; быстрые и дешёвые.\n2. Интеграционные — несколько частей вместе: компонент с формой, хуком и запросом (замоканным).\n3. E2E — весь сценарий в настоящем браузере: открыть сайт, войти, оформить заказ; медленные и дорогие.\n4. Пирамида: внизу много unit, в середине интеграционных, сверху мало e2e. Для фронтенда часто говорят про «кубок» (testing trophy) — упор на интеграционные.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_what-01", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Что тестировать в первую очередь?", "a": "Логику, от которой зависят деньги и данные (расчёты, валидация), ключевые формы и их состояния загрузки и ошибки, и пару критичных сценариев целиком в e2e.", "hint": "Логика, формы, критичные сценарии.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_what-02", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Что делать с тестом при исправлении бага?", "a": "Сначала написать тест, который воспроизводит баг и падает, потом исправить код. Так баг не вернётся незаметно.", "hint": "Сначала падающий тест.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_what-03", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Расскажи про тему «Что тестировать в первую очередь» полностью, как на собеседовании (4 шага).", "a": "1. Бизнес-логику: утилиты расчётов, форматирования, валидации — unit-тестами.\n2. Ключевые компоненты и формы: ввод, валидация, отправка, состояния загрузки и ошибки — через Testing Library.\n3. Критичные сценарии: вход, оформление заказа — e2e.\n4. Не тратить время: на стили, сторонние библиотеки и детали реализации; на баг — сначала тест, который его воспроизводит, потом исправление.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_why-01", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Зачем нужны автотесты?", "a": "Чтобы ловить ошибки до пользователя, спокойно менять и рефакторить код — тесты сразу покажут, что сломалось, — и чтобы описывать ожидаемое поведение кода.", "hint": "Ошибки, рефакторинг, документация.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_why-02", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Как ответить, если опыта с тестами мало?", "a": "Честно и конкретно: что именно писал (unit на Vitest, компоненты через Testing Library, e2e на Playwright в учебном проекте), что понимаю (пирамида, моки) и что готов углублять.", "hint": "Честно и конкретно.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-test_why-03", "deck": "Термины собеса · Тесты", "kind": "topic", "q": "Расскажи про тему «Зачем тесты» полностью, как на собеседовании (4 шага).", "a": "1. Что: тесты автоматически проверяют, что код работает как задумано.\n2. Зачем: ловить ошибки до пользователя, смело рефакторить, тесты служат документацией поведения.\n3. Как отвечать с небольшим опытом: «писал unit-тесты на Jest/Vitest для утилит и компонентов через Testing Library, пробовал e2e на Playwright» — конкретно, без преувеличений.\n4. Плюс: показать готовность — «понимаю пирамиду тестирования и что тестировать в первую очередь».", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-this-01", "deck": "Термины собеса", "kind": "topic", "q": "Что такое `this`?", "a": "`this` — контекст вызова: объект, с которым функция работает в момент вызова. У обычной функции он определяется не местом объявления, а тем, как функцию вызвали.", "hint": "Определяется при вызове, а не при объявлении.", "added": "2026-10-27"}, {"id": "term-this-02", "deck": "Термины собеса", "kind": "topic", "q": "Чему равен `this` и что выведет код?", "code": "const user = {\n  name: 'Саша',\n  greet() { console.log(this.name); },\n};\nuser.greet();", "a": "`this` — объект слева от точки, то есть `user`. Выведет `Саша`.", "hint": "Посмотри, что стоит слева от точки.", "added": "2026-10-27"}, {"id": "term-this-03", "deck": "Термины собеса", "kind": "topic", "q": "Почему здесь ошибка и как починить?", "code": "const user = { name: 'Саша', greet() { console.log(this.name); } };\nsetTimeout(user.greet, 0);", "a": "Метод передан как колбэк и вызывается без точки — контекст потерян, в strict mode `this` равен `undefined`. Чиним: `setTimeout(() => user.greet(), 0)` или `user.greet.bind(user)`.", "hint": "Как вызовется функция внутри setTimeout?", "added": "2026-10-27"}, {"id": "term-this-04", "deck": "Термины собеса", "kind": "topic", "q": "Какой `this` у стрелочной функции?", "code": "const user = {\n  name: 'Саша',\n  later() {\n    setTimeout(() => console.log(this.name), 0);\n  },\n};\nuser.later(); // 'Саша'", "a": "Своего `this` у стрелки нет: она берёт `this` из места, где создана, и способ вызова на него не влияет. `call`, `apply`, `bind` его тоже не меняют.", "hint": "Свой или внешний?", "added": "2026-10-27"}, {"id": "term-this-05", "deck": "Термины собеса", "kind": "topic", "q": "Чему равен `this` при вызове через `new`?", "code": "function User(name) {\n  this.name = name;\n}\nconst u = new User('Саша');", "a": "Новому пустому объекту, который создаёт `new`. Функция заполняет его через `this` и возвращает.", "hint": "Что создаёт new?", "added": "2026-10-27"}, {"id": "term-this-06", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «this» полностью, как на собеседовании (4 шага).", "a": "1. Что: `this` — это контекст вызова: объект, с которым функция работает в момент вызова.\n2. Как работает: у обычной функции `this` зависит от того, как её вызвали: через точку — объект слева, просто `fn()` — `undefined` в strict mode, через `new` — новый объект, через `call/apply/bind` — указанный объект.\n3. Пример: `user.greet()` — `this` равен `user`; `const f = user.greet; f()` — контекст потерян.\n4. Подвох: у стрелочной функции своего `this` нет — она берёт его из места создания; метод, переданный как колбэк, теряет `this`, чиним через `bind` или стрелку.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-transition-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Что делает `useTransition`?", "code": "const [isPending, startTransition] = useTransition();\nstartTransition(() => setTab('posts'));", "a": "Помечает обновление состояния как несрочное. React сначала обработает срочные обновления (ввод, клики), а этот рендер может прервать и перезапустить. `isPending` — флаг для индикатора.", "hint": "Несрочное обновление + isPending.", "added": "2026-10-27"}, {"id": "term-transition-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Что делает `useDeferredValue`?", "code": "const deferredQuery = useDeferredValue(query);\n<SearchResults query={deferredQuery} />", "a": "Возвращает «отстающую» копию значения. Сначала рендер идёт со старым значением, а с новым — в фоне. Используют, когда нет доступа к сеттеру, например значение пришло в props.", "hint": "Отстающая копия значения.", "added": "2026-10-27"}, {"id": "term-transition-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Чем `useDeferredValue` отличается от debounce?", "a": "Debounce ждёт фиксированное время. `useDeferredValue` не ждёт: React начинает фоновый рендер сразу и прерывает его, если пришло новое значение. На быстром устройстве задержки почти нет.", "hint": "Нет фиксированной задержки.", "added": "2026-10-27"}, {"id": "term-transition-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «useTransition и useDeferredValue» полностью, как на собеседовании (4 шага).", "a": "1. Что: оба хука помечают обновление как несрочное, чтобы тяжёлый рендер не блокировал ввод.\n2. useTransition: оборачиваем вызов сеттера в `startTransition`, получаем `isPending`; React может прервать этот рендер ради срочного.\n3. useDeferredValue: получаем отложенную копию значения — когда сеттер не наш (значение пришло из props).\n4. Пример: ввод в поиске обновляется сразу, а тяжёлый список результатов — с отставанием, интерфейс не тормозит.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-ts_as-01", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что делает `as`?", "code": "const input = document.getElementById('name') as HTMLInputElement;", "a": "Утверждение типа: говорим TS считать значение указанным типом. Ничего не проверяет ни при сборке, ни в рантайме — можно ошибиться и получить падение.", "hint": "Без проверки.", "added": "2026-10-27"}, {"id": "term-ts_as-02", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что делает `satisfies`?", "code": "type Colors = Record<string, string | number[]>;\nconst palette = {\n  red: [255, 0, 0],\n  green: '#0f0',\n} satisfies Colors;\npalette.green.toUpperCase(); // ок: тип string сохранён", "a": "Проверяет, что значение соответствует типу, но оставляет его собственный, более точный тип. В отличие от аннотации `: Colors`, не расширяет поля до общего типа.", "hint": "Проверка без расширения.", "added": "2026-10-27"}, {"id": "term-ts_as-03", "deck": "Термины собеса · TS", "kind": "topic", "q": "Когда `as`, а когда `satisfies`?", "a": "`satisfies` — когда хотим проверку соответствия типу и точный вывод. `as` — редко, когда мы знаем больше компилятора, например тип DOM-элемента. Для данных извне — type guard или Zod.", "hint": "Проверка vs утверждение.", "added": "2026-10-27"}, {"id": "term-ts_as-04", "deck": "Термины собеса · TS", "kind": "topic", "q": "Расскажи про тему «as, satisfies, type guard» полностью, как на собеседовании (4 шага).", "a": "1. Что: `as` — утверждение типа: «поверь мне, это `T»`, проверки нет; `satisfies` — проверяет, что значение подходит под тип, но сохраняет точный тип значения; type guard — проверка в рантайме + сужение.\n2. Как работает: `as` может скрыть ошибку; `satisfies` поймает лишние или недостающие поля и не расширит литералы.\n3. Пример: `const config = { port: 3000 } satisfies Config` — проверено, и `config.port` остаётся `number`, а не union.\n4. Правило: реже `as`, чаще `satisfies` и type guards; `as` — когда знаешь больше TS (например, элемент DOM).", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-ts_basic-01", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что такое union-тип?", "code": "let id: number | string;\nid = 5;\nid = 'abc';", "a": "Объединение: значение может быть одного из перечисленных типов. Использовать можно только то, что есть у всех вариантов, пока тип не сужен.", "hint": "A или B.", "added": "2026-10-27"}, {"id": "term-ts_basic-02", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что такое литеральный тип?", "code": "type Size = 's' | 'm' | 'l';\nlet size: Size = 'm';\nsize = 'xl'; // ошибка", "a": "Конкретное значение как тип. Объединение литералов ограничивает значение заданным списком.", "hint": "Значение = тип.", "added": "2026-10-27"}, {"id": "term-ts_basic-03", "deck": "Термины собеса · TS", "kind": "topic", "q": "Чем `any` отличается от `unknown`?", "code": "let a: any = getData();\na.foo.bar(); // TS молчит\nlet u: unknown = getData();\nu.foo;       // ошибка\nif (typeof u === 'string') u.toUpperCase(); // можно", "a": "`any` выключает проверку типов целиком. `unknown` — безопасный аналог: значение принять можно, а использовать — только после проверки типа.", "hint": "unknown требует проверки.", "added": "2026-10-27"}, {"id": "term-ts_basic-04", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что такое `never`?", "code": "function fail(msg: string): never {\n  throw new Error(msg);\n}", "a": "Тип значения, которого не может быть: функция никогда не возвращает управление, или в `switch` разобраны все варианты union и осталось «ничего».", "hint": "Значения не бывает.", "added": "2026-10-27"}, {"id": "term-ts_basic-05", "deck": "Термины собеса · TS", "kind": "topic", "q": "Расскажи про тему «union, literal, any, unknown, never» полностью, как на собеседовании (4 шага).", "a": "1. Что: union `A | B` — значение одного из типов; literal — конкретное значение как тип (`'success'`); `?` — необязательное поле.\n2. any и unknown: `any` отключает проверку; `unknown` — «что-то неизвестное», использовать можно только после сужения типа.\n3. never: тип значения, которого не бывает — функция всегда бросает ошибку, или все варианты union уже разобраны.\n4. Правило: вместо `any` — `unknown` + проверка; `never` используют для проверки исчерпанности в `switch`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-ts_enum-01", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что такое `enum`?", "code": "enum Status {\n  Idle = 'idle',\n  Loading = 'loading',\n}\nStatus.Loading; // 'loading'", "a": "Набор именованных констант. В отличие от типов, `enum` компилируется в настоящий JS-объект и существует в рантайме.", "hint": "Константы + объект в JS.", "added": "2026-10-27"}, {"id": "term-ts_enum-02", "deck": "Термины собеса · TS", "kind": "topic", "q": "Почему часто выбирают union вместо `enum`?", "code": "type Status = 'idle' | 'loading' | 'error';", "a": "Union литералов — только тип, в бандле ничего не появляется, значения — обычные строки. Проще читать и сериализовать.", "hint": "Ноль кода в рантайме.", "added": "2026-10-27"}, {"id": "term-ts_enum-03", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что делает `as const`?", "code": "const ROLES = ['admin', 'user'] as const;\n// readonly ['admin', 'user']\ntype Role = typeof ROLES[number]; // 'admin' | 'user'", "a": "Делает значение readonly и сохраняет точные литеральные типы вместо общих `string`/`number`. Позволяет получить тип из массива или объекта констант.", "hint": "readonly + литералы.", "added": "2026-10-27"}, {"id": "term-ts_enum-04", "deck": "Термины собеса · TS", "kind": "topic", "q": "Расскажи про тему «enum, union и as const» полностью, как на собеседовании (4 шага).", "a": "1. Что: `enum` — набор именованных констант, который существует и в рантайме; union литералов — только тип, в JS его нет.\n2. as const: делает значение глубоко readonly и сохраняет литеральные типы вместо `string`.\n3. Пример: `const ROLES = ['admin', 'user'] as const; type Role = typeof ROLES[number];` — и массив для рантайма, и тип.\n4. Что выбрать: сейчас чаще union литералов или объект с `as const` — проще, нет лишнего кода в бандле; `enum` встречается в старом коде.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-ts_generics-01", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что такое дженерик?", "code": "function first<T>(arr: T[]): T {\n  return arr[0];\n}\nconst n = first([1, 2]);     // number\nconst s = first(['a', 'b']); // string", "a": "Параметр типа: функция работает с любым типом и сохраняет связь между входом и выходом. Без дженерика пришлось бы писать `any` и терять тип.", "hint": "Тип как параметр.", "added": "2026-10-27"}, {"id": "term-ts_generics-02", "deck": "Термины собеса · TS", "kind": "topic", "q": "Нужно ли всегда указывать тип в угловых скобках?", "a": "Обычно нет: TS выводит его по аргументам. Указывают явно, когда вывести не из чего — например `useState<User | null>(null)`.", "hint": "TS выводит сам.", "added": "2026-10-27"}, {"id": "term-ts_generics-03", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что делает `extends` в дженерике?", "code": "function getId<T extends { id: number }>(item: T) {\n  return item.id;\n}", "a": "Ограничивает параметр типа: подойдёт любой тип, у которого есть поле `id: number`. Без ограничения обратиться к `item.id` нельзя.", "hint": "Ограничение типа.", "added": "2026-10-27"}, {"id": "term-ts_generics-04", "deck": "Термины собеса · TS", "kind": "topic", "q": "Расскажи про тему «Дженерики» полностью, как на собеседовании (4 шага).", "a": "1. Что: дженерик — тип-параметр, который позволяет писать функцию или тип для любых типов, не теряя связи между ними.\n2. Как работает: `function first<T>(arr: T[]): T` — что пришло в массиве, то и вернётся; TS выводит `T` сам по аргументам.\n3. Пример: `useState<User | null>(null)`, `Promise<User>`, `Array<string>` — всё это дженерики.\n4. Ограничение: `<T extends { id: number }>` — требуем, чтобы у типа было нужное поле.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-ts_interface-01", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что такое `interface`?", "code": "interface User {\n  id: number;\n  name: string;\n  email?: string;\n}", "a": "Описание формы объекта: какие поля и каких типов. Расширяется через `extends`, одноимённые интерфейсы сливаются.", "hint": "Форма объекта.", "added": "2026-10-27"}, {"id": "term-ts_interface-02", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что умеет `type`, чего не умеет `interface`?", "code": "type Status = 'idle' | 'loading' | 'error';\ntype Point = [number, number];", "a": "Описывать объединения (union), кортежи, примитивы, пересечения через `&`, mapped и conditional types. `interface` описывает только объекты.", "hint": "Union и вычисляемые типы.", "added": "2026-10-27"}, {"id": "term-ts_interface-03", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что такое слияние объявлений?", "code": "interface Window { myLib: string; }\n// добавили поле к глобальному Window", "a": "Два `interface` с одним именем объединяются в один. Так расширяют чужие типы, например `Window`. С `type` одинаковое имя — ошибка.", "hint": "Одноимённые интерфейсы сливаются.", "added": "2026-10-27"}, {"id": "term-ts_interface-04", "deck": "Термины собеса · TS", "kind": "topic", "q": "Как расширить тип в каждом случае?", "code": "interface Admin extends User { role: string; }\ntype Admin2 = User & { role: string };", "a": "У `interface` — через `extends`, у `type` — через пересечение `&`. Результат похож, но `extends` даёт понятнее ошибки при конфликте полей.", "hint": "extends или &.", "added": "2026-10-27"}, {"id": "term-ts_interface-05", "deck": "Термины собеса · TS", "kind": "topic", "q": "Расскажи про тему «interface и type» полностью, как на собеседовании (4 шага).", "a": "1. Что: `interface` и `type` — два способа описать форму объекта; для объектов почти взаимозаменяемы.\n2. interface: расширяется через `extends`, поддерживает слияние объявлений (два `interface User` объединятся).\n3. type: умеет больше — union (`'a' | 'b'`), пересечения (`&`), кортежи, mapped и conditional types.\n4. Правило: объекты и props — чаще `interface` (или как принято в проекте); объединения и вычисляемые типы — `type`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-ts_keyof-01", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что делает `keyof`?", "code": "type User = { id: number; name: string };\ntype Keys = keyof User; // 'id' | 'name'", "a": "Возвращает объединение ключей типа как строковых литералов.", "hint": "Union ключей.", "added": "2026-10-27"}, {"id": "term-ts_keyof-02", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что делает `typeof` в позиции типа?", "code": "const config = { port: 3000, host: 'localhost' };\ntype Config = typeof config; // { port: number; host: string }", "a": "Берёт тип существующей переменной. Удобно, когда значение уже есть, и не хочется описывать его тип вручную.", "hint": "Тип из значения.", "added": "2026-10-27"}, {"id": "term-ts_keyof-03", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что такое `T['key']`?", "code": "type User = { address: { city: string } };\ntype Address = User['address']; // { city: string }", "a": "Обращение к типу поля по ключу. Можно и через union: `User['id' | 'name']`.", "hint": "Тип поля.", "added": "2026-10-27"}, {"id": "term-ts_keyof-04", "deck": "Термины собеса · TS", "kind": "topic", "q": "Как типизировать функцию получения поля объекта?", "code": "function get<T, K extends keyof T>(obj: T, key: K): T[K] {\n  return obj[key];\n}", "a": "Дженерик `K extends keyof T` разрешает только существующие ключи, а `T[K]` даёт точный тип результата.", "hint": "K extends keyof T.", "added": "2026-10-27"}, {"id": "term-ts_keyof-05", "deck": "Термины собеса · TS", "kind": "topic", "q": "Расскажи про тему «keyof, typeof, индексный доступ» полностью, как на собеседовании (4 шага).", "a": "1. Что: `keyof T` — union ключей типа; `typeof x` в позиции типа — тип переменной; `T['field']` — тип поля по индексу.\n2. Как работает: это операторы уровня типов — вычисляют новый тип из существующего.\n3. Пример: `function get<T, K extends keyof T>(obj: T, key: K): T[K]` — нельзя передать несуществующий ключ, а результат имеет точный тип.\n4. Подвох: `typeof` в выражении JS даёт строку (`'object'`), а в позиции типа — полный TS-тип значения.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-ts_narrowing-01", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что такое сужение типа?", "code": "function show(id: number | string) {\n  if (typeof id === 'string') {\n    return id.toUpperCase(); // здесь string\n  }\n  return id.toFixed(2);      // здесь number\n}", "a": "TS анализирует проверки в коде и внутри ветки уточняет тип переменной. После `typeof id === 'string'` в этой ветке `id` — строка.", "hint": "Проверка уточняет тип.", "added": "2026-10-27"}, {"id": "term-ts_narrowing-02", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что такое размеченное объединение?", "code": "type State =\n  | { status: 'loading' }\n  | { status: 'ok'; data: string[] }\n  | { status: 'error'; message: string };\nif (state.status === 'ok') state.data;", "a": "Union объектов с общим полем-литералом. Проверка этого поля сужает тип до конкретного варианта, и становятся доступны его поля.", "hint": "Общее поле-метка.", "added": "2026-10-27"}, {"id": "term-ts_narrowing-03", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что такое пользовательский type guard?", "code": "function isUser(x: unknown): x is User {\n  return typeof x === 'object' && x !== null && 'id' in x;\n}", "a": "Функция, которая возвращает `x is T`. Если она вернула `true`, TS считает значение типом `T` в этой ветке.", "hint": "x is T.", "added": "2026-10-27"}, {"id": "term-ts_narrowing-04", "deck": "Термины собеса · TS", "kind": "topic", "q": "Как убедиться, что разобраны все варианты union?", "code": "switch (state.status) {\n  case 'loading': ...\n  case 'ok': ...\n  case 'error': ...\n  default: const _check: never = state;\n}", "a": "В `default` присвоить значение переменной типа `never`. Если добавят новый вариант и забудут его обработать, будет ошибка компиляции.", "hint": "never в default.", "added": "2026-10-27"}, {"id": "term-ts_narrowing-05", "deck": "Термины собеса · TS", "kind": "topic", "q": "Расскажи про тему «Сужение типов» полностью, как на собеседовании (4 шага).", "a": "1. Что: сужение типа (narrowing) — TS по проверкам в коде уточняет тип переменной внутри ветки.\n2. Способы: `typeof`, `instanceof`, `in`, сравнение с литералом, проверка на `null`; discriminated union — по общему полю `type`/`status`.\n3. Пример: `if (typeof id === 'string') id.toUpperCase()` — внутри `if` TS знает, что это строка.\n4. Type guard: своя функция с ответом `x is T` — когда встроенных проверок мало.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-ts_react-01", "deck": "Термины собеса · TS", "kind": "topic", "q": "Как типизировать props компонента?", "code": "interface ButtonProps {\n  label: string;\n  variant?: 'primary' | 'ghost';\n  onClick: () => void;\n}\nfunction Button({ label, variant = 'primary', onClick }: ButtonProps) { ... }", "a": "Описать интерфейс props и указать его как тип параметра. Необязательные — через `?`, значения по умолчанию — в деструктуризации.", "hint": "interface + тип параметра.", "added": "2026-10-27"}, {"id": "term-ts_react-02", "deck": "Термины собеса · TS", "kind": "topic", "q": "Какой тип у `children`?", "code": "interface CardProps {\n  title: string;\n  children: React.ReactNode;\n}", "a": "`React.ReactNode` — всё, что React умеет отрендерить: элементы, строки, числа, массивы, `null`.", "hint": "ReactNode.", "added": "2026-10-27"}, {"id": "term-ts_react-03", "deck": "Термины собеса · TS", "kind": "topic", "q": "Как типизировать обработчик события?", "code": "function handleChange(e: React.ChangeEvent<HTMLInputElement>) {\n  setValue(e.target.value);\n}", "a": "Через типы событий React с указанием элемента: `React.ChangeEvent<HTMLInputElement>`, `React.MouseEvent<HTMLButtonElement>`, `React.FormEvent<HTMLFormElement>`.", "hint": "React.XxxEvent<Элемент>.", "added": "2026-10-27"}, {"id": "term-ts_react-04", "deck": "Термины собеса · TS", "kind": "topic", "q": "Как типизировать `useState` и `useRef`?", "code": "const [user, setUser] = useState<User | null>(null);\nconst inputRef = useRef<HTMLInputElement>(null);", "a": "Когда начальное значение не говорит о типе (`null`, пустой массив), передаём тип в угловых скобках. Для DOM-ref — тип элемента и `null`.", "hint": "Дженерик в угловых скобках.", "added": "2026-10-27"}, {"id": "term-ts_react-05", "deck": "Термины собеса · TS", "kind": "topic", "q": "Как взять все props нативной кнопки?", "code": "type Props = React.ComponentProps<'button'> & { loading?: boolean };", "a": "`React.ComponentProps<'button'>` даёт все атрибуты `button`. Удобно для своих обёрток над нативными элементами.", "hint": "ComponentProps<'тег'>.", "added": "2026-10-27"}, {"id": "term-ts_react-06", "deck": "Термины собеса · TS", "kind": "topic", "q": "Расскажи про тему «Типизация React» полностью, как на собеседовании (4 шага).", "a": "1. Props: описываем `interface ButtonProps` и типизируем параметр: `function Button({ label, onClick }: ButtonProps)`.\n2. children: тип `React.ReactNode` — всё, что можно отрендерить.\n3. События и хуки: `React.ChangeEvent<HTMLInputElement>`, `React.MouseEvent<HTMLButtonElement>`; `useState<User | null>(null)`, `useRef<HTMLInputElement>(null)`.\n4. Подвох: `React.FC` сейчас используют редко; для пропсов нативного элемента — `React.ComponentProps<'button'>`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-ts_utility-01", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что делают `Partial` и `Required`?", "code": "type Draft = Partial<User>;  // все поля необязательные\ntype Full = Required<User>;  // все обязательные", "a": "`Partial` делает все поля необязательными — удобно для обновлений. `Required` — наоборот, все обязательными.", "hint": "Все ? или все обязательные.", "added": "2026-10-27"}, {"id": "term-ts_utility-02", "deck": "Термины собеса · TS", "kind": "topic", "q": "Чем `Pick` отличается от `Omit`?", "code": "type Preview = Pick<User, 'id' | 'name'>;\ntype NewUser = Omit<User, 'id'>;", "a": "`Pick` берёт только перечисленные поля, `Omit` — все, кроме перечисленных.", "hint": "Взять или убрать.", "added": "2026-10-27"}, {"id": "term-ts_utility-03", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что такое `Record`?", "code": "const roles: Record<'admin' | 'user', string[]> = {\n  admin: ['all'],\n  user: ['read'],\n};", "a": "Тип объекта с заданными ключами и одним типом значений. Удобен для словарей и таблиц соответствия.", "hint": "Ключи → значения.", "added": "2026-10-27"}, {"id": "term-ts_utility-04", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что делает `ReturnType`?", "code": "function makeStore() { return { user: null, items: [] }; }\ntype Store = ReturnType<typeof makeStore>;", "a": "Достаёт тип результата функции. Часто вместе с `typeof`: например `ReturnType<typeof store.getState>` в Redux.", "hint": "Тип результата функции.", "added": "2026-10-27"}, {"id": "term-ts_utility-05", "deck": "Термины собеса · TS", "kind": "topic", "q": "Расскажи про тему «Utility types» полностью, как на собеседовании (4 шага).", "a": "1. Что: utility types — встроенные типы-помощники, которые делают новый тип из существующего.\n2. Основные: `Partial<T>` — все поля необязательные; `Required<T>` — все обязательные; `Pick<T, K>` — только выбранные поля; `Omit<T, K>` — все кроме; `Record<K, V>` — объект с ключами `K` и значениями `V`; `ReturnType<F>` — тип результата функции.\n3. Пример: `updateUser(id, data: Partial<User>)` — передаём только изменённые поля.\n4. Зачем: не дублировать описание типов — меняем `User`, и все производные типы обновятся.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-ts_why-01", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что такое TypeScript?", "a": "Надстройка над JavaScript со статической типизацией. Код проверяется при разработке и компилируется в обычный JS — в браузере типов нет.", "hint": "JS + типы при сборке.", "added": "2026-10-27"}, {"id": "term-ts_why-02", "deck": "Термины собеса · TS", "kind": "topic", "q": "Существуют ли типы TS во время выполнения?", "code": "function f(x: number) {}\nf(JSON.parse('\"5\"')); // TS не спасёт", "a": "Нет. Типы стираются при компиляции. Данные с сервера или из `JSON.parse` TS не проверяет — для этого нужна проверка в рантайме, например библиотекой Zod.", "hint": "Стираются при компиляции.", "added": "2026-10-27"}, {"id": "term-ts_why-03", "deck": "Термины собеса · TS", "kind": "topic", "q": "Что даёт TypeScript в команде?", "a": "Ошибки ловятся до запуска, работает автодополнение, рефакторинг безопасен — переименовал поле и сразу видишь все места. Типы описывают API и служат документацией.", "hint": "Ошибки раньше, подсказки, рефакторинг.", "added": "2026-10-27"}, {"id": "term-ts_why-04", "deck": "Термины собеса · TS", "kind": "topic", "q": "Расскажи про тему «Зачем TypeScript» полностью, как на собеседовании (4 шага).", "a": "1. Что: TypeScript — надстройка над JavaScript со статической типизацией; компилируется в обычный JS.\n2. Как работает: типы проверяются во время разработки и сборки, а в рантайме их нет — браузер выполняет обычный JS.\n3. Пример: передал в функцию `string` вместо `number` — ошибка видна в редакторе, до запуска.\n4. Зачем: меньше ошибок, автодополнение и подсказки, безопасный рефакторинг, типы как документация API.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-useeffect-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Для чего нужен `useEffect`?", "a": "Для побочных эффектов, которые нельзя делать во время рендера: запросы к серверу, подписки, таймеры, ручная работа с DOM. Запускается после отрисовки.", "hint": "Побочные эффекты после отрисовки.", "added": "2026-10-27"}, {"id": "term-useeffect-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Когда срабатывает эффект в каждом случае?", "code": "useEffect(fn);          // ?\nuseEffect(fn, []);      // ?\nuseEffect(fn, [id]);    // ?", "a": "Без массива — после каждого рендера. С пустым — один раз после монтирования. С `[id]` — после монтирования и каждый раз, когда изменился `id`.", "hint": "Каждый / один раз / при изменении.", "added": "2026-10-27"}, {"id": "term-useeffect-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Когда вызывается функция очистки?", "code": "useEffect(() => {\n  const id = setInterval(tick, 1000);\n  return () => clearInterval(id);\n}, [delay]);", "a": "Перед каждым повторным запуском эффекта (когда изменились зависимости) и при размонтировании компонента. Нужна, чтобы не было утечек и двойных подписок.", "hint": "Перед повтором и при уходе.", "added": "2026-10-27"}, {"id": "term-useeffect-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Как избежать гонки запросов в `useEffect`?", "code": "useEffect(() => {\n  let ignore = false;\n  fetchUser(id).then((u) => { if (!ignore) setUser(u); });\n  return () => { ignore = true; };\n}, [id]);", "a": "В очистке пометить старый запрос как неактуальный (флаг или `AbortController`). Тогда ответ на старый `id`, пришедший позже, не перезапишет данные нового.", "hint": "Флаг или AbortController в очистке.", "added": "2026-10-27"}, {"id": "term-useeffect-05", "deck": "Термины собеса · React", "kind": "topic", "q": "Когда эффект не нужен?", "code": "// плохо\nuseEffect(() => setFull(first + ' ' + last), [first, last]);\n// хорошо\nconst full = first + ' ' + last;", "a": "Когда значение можно вычислить из props или state прямо при рендере. Эффект ради синхронизации состояния даёт лишний ре-рендер.", "hint": "Можно посчитать при рендере?", "added": "2026-10-27"}, {"id": "term-useeffect-06", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «useEffect» полностью, как на собеседовании (4 шага).", "a": "1. Что: `useEffect` — хук для побочных эффектов: запросы, подписки, таймеры, работа с DOM вне React.\n2. Как работает: запускается после отрисовки; массив зависимостей решает когда: без массива — после каждого рендера, `[]` — один раз после монтирования, `[a, b]` — когда изменились `a` или `b`.\n3. Очистка: функция из `return` вызывается перед следующим запуском эффекта и при размонтировании.\n4. Подвох: забытая зависимость — эффект видит устаревшее значение; объект или функция в зависимостях — новая ссылка каждый рендер, эффект срабатывает постоянно.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-usereducer-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое `useReducer`?", "code": "const [state, dispatch] = useReducer(reducer, { count: 0 });\ndispatch({ type: 'inc' });", "a": "Хук состояния, где все изменения описаны в одной функции-редьюсере. Компонент только отправляет действия через `dispatch`.", "hint": "state + dispatch.", "added": "2026-10-27"}, {"id": "term-usereducer-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Каким должен быть редьюсер?", "code": "function reducer(state, action) {\n  switch (action.type) {\n    case 'inc': return { ...state, count: state.count + 1 };\n    default: return state;\n  }\n}", "a": "Чистой функцией: принимает состояние и действие, возвращает новое состояние, не мутирует старое и не делает побочных эффектов.", "hint": "Чистая, без мутаций.", "added": "2026-10-27"}, {"id": "term-usereducer-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Когда `useReducer` лучше `useState`?", "a": "Когда в состоянии много связанных полей и много разных действий над ними. Логика собрана в одном месте и тестируется отдельно. Для одного-двух простых значений хватает `useState`.", "hint": "Сложная связанная логика.", "added": "2026-10-27"}, {"id": "term-usereducer-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «useReducer» полностью, как на собеседовании (4 шага).", "a": "1. Что: `useReducer` — хук для состояния, где логика изменений вынесена в чистую функцию-редьюсер.\n2. Как работает: `dispatch({ type: 'add', payload })` отправляет действие, редьюсер `(state, action) => newState` возвращает новое состояние.\n3. Пример: корзина или форма с несколькими связанными полями и множеством действий.\n4. Когда лучше useState: когда много связанных полей, следующее состояние зависит от предыдущего сложным образом, логику хочется тестировать отдельно от компонента.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-useref-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое `useRef`?", "code": "const inputRef = useRef(null);\n<input ref={inputRef} />\ninputRef.current.focus();", "a": "Хук, который возвращает объект `{ current }`, сохраняющийся между рендерами. Используют для доступа к DOM-элементам и для хранения значений без ре-рендера.", "hint": "Коробка { current }.", "added": "2026-10-27"}, {"id": "term-useref-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Чем `useRef` отличается от `useState`?", "a": "Изменение `ref.current` не вызывает ре-рендер и видно сразу. Изменение state вызывает ре-рендер, а новое значение появится в следующем рендере. Что показывается на экране — в state.", "hint": "Ре-рендер или нет.", "added": "2026-10-27"}, {"id": "term-useref-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Где хранить id таймера, который нужно отменить позже?", "code": "const timerRef = useRef(null);\nfunction start() {\n  timerRef.current = setInterval(tick, 1000);\n}\nfunction stop() {\n  clearInterval(timerRef.current);\n}", "a": "В `useRef`: значение нужно помнить между рендерами, но на экране оно не показывается. В обычной переменной оно пропадёт при ре-рендере, в state — вызовет лишний рендер.", "hint": "Помнить, но не рисовать.", "added": "2026-10-27"}, {"id": "term-useref-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Как передать ref в свой компонент в React 19?", "code": "function Input({ ref, ...props }) {\n  return <input ref={ref} {...props} />;\n}", "a": "С React 19 `ref` — обычный проп функционального компонента. Раньше для этого нужен был `forwardRef`.", "hint": "forwardRef больше не нужен.", "added": "2026-10-27"}, {"id": "term-useref-05", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «useRef» полностью, как на собеседовании (4 шага).", "a": "1. Что: `useRef` возвращает объект `{ current }`, который живёт между рендерами.\n2. Отличие от state: изменение `ref.current` не вызывает ре-рендер и происходит сразу.\n3. Пример: ссылка на DOM-элемент (`ref={inputRef}`, потом `inputRef.current.focus()`) или хранение id таймера.\n4. Подвох: то, что показывается на экране, хранят в state; в ref — то, что нужно помнить, но не рисовать; читать и менять ref во время рендера нельзя.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-usestate-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Что возвращает `useState`?", "code": "const [count, setCount] = useState(0);", "a": "Массив из двух элементов: текущее значение и функцию-сеттер. Аргумент — начальное значение, используется только при первом рендере.", "hint": "Значение + сеттер.", "added": "2026-10-27"}, {"id": "term-usestate-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Что выведет `console.log` и почему?", "code": "const [count, setCount] = useState(0);\nfunction click() {\n  setCount(count + 1);\n  console.log(count);\n}", "a": "`0`. Сеттер не меняет переменную сразу: `count` — константа этого рендера. Новое значение будет в следующем рендере.", "hint": "count — снимок рендера.", "added": "2026-10-27"}, {"id": "term-usestate-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое batching?", "code": "setA(1);\nsetB(2);\nsetC(3); // один ре-рендер", "a": "Объединение нескольких обновлений состояния в один ре-рендер. С React 18 работает везде: в обработчиках, промисах, таймерах.", "hint": "Один ре-рендер на пачку.", "added": "2026-10-27"}, {"id": "term-usestate-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Чему будет равен `count` после клика?", "code": "function click() {\n  setCount(count + 1);\n  setCount(count + 1);\n  setCount((c) => c + 1);\n}", "a": "Было 0 — станет 2. Первые два вызова оба ставят `0 + 1`. Функциональное обновление берёт актуальное значение из очереди: `1 + 1 = 2`. Если новое значение зависит от старого — используем `(prev) => ...`.", "hint": "Обновления по очереди.", "added": "2026-10-27"}, {"id": "term-usestate-05", "deck": "Термины собеса · React", "kind": "topic", "q": "Зачем передавать в `useState` функцию?", "code": "const [data] = useState(() => JSON.parse(localStorage.getItem('data')));", "a": "Чтобы тяжёлое начальное вычисление выполнилось только один раз, при первом рендере. Если передать результат вызова, он будет считаться на каждом рендере.", "hint": "Только при первом рендере.", "added": "2026-10-27"}, {"id": "term-usestate-06", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «useState» полностью, как на собеседовании (4 шага).", "a": "1. Что: `useState` — хук локального состояния: возвращает значение и сеттер.\n2. Как работает: сеттер не меняет переменную сразу, а ставит обновление в очередь; новое значение появится в следующем рендере. Несколько обновлений в одном событии React объединяет (batching).\n3. Пример: `setCount(count + 1)` три раза подряд даст +1, а `setCount((c) => c + 1)` три раза — +3.\n4. Подвох: сразу после сеттера переменная ещё старая; если новое значение зависит от старого — функциональное обновление.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-varletconst-01", "deck": "Термины собеса", "kind": "topic", "q": "Что такое hoisting (поднятие)?", "code": "console.log(a); // undefined\nvar a = 1;\n\nsayHi(); // работает\nfunction sayHi() {}", "a": "Объявления переменных и функций обрабатываются до выполнения кода, как будто «поднимаются» наверх. `var` поднимается со значением `undefined`, Function Declaration — целиком, `let`/`const` — без значения.", "hint": "Что поднимается и с каким значением?", "added": "2026-10-27"}, {"id": "term-varletconst-02", "deck": "Термины собеса", "kind": "topic", "q": "Что такое TDZ (временная мёртвая зона)?", "code": "console.log(b); // ReferenceError\nlet b = 2;", "a": "Участок от начала блока до строки объявления `let`/`const`. Переменная уже существует, но обратиться к ней нельзя — будет `ReferenceError`.", "hint": "Почему let до объявления — ошибка?", "added": "2026-10-27"}, {"id": "term-varletconst-03", "deck": "Термины собеса", "kind": "topic", "q": "Чем область видимости `var` отличается от `let`?", "code": "if (true) {\n  var a = 1;\n  let b = 2;\n}\nconsole.log(a); // 1\nconsole.log(b); // ReferenceError", "a": "`var` видна во всей функции и игнорирует блоки `{ }`. `let` и `const` видны только внутри блока, где объявлены.", "hint": "Видит ли var фигурные скобки?", "added": "2026-10-27"}, {"id": "term-varletconst-04", "deck": "Термины собеса", "kind": "topic", "q": "Можно ли изменить объект, объявленный через `const`?", "code": "const user = { name: 'Саша' };\nuser.name = 'Алекс'; // можно\nuser = {};             // TypeError", "a": "Можно менять содержимое объекта, но нельзя присвоить переменной новое значение. `const` защищает ссылку, а не сам объект.", "hint": "Что защищает const — ссылку или содержимое?", "added": "2026-10-27"}, {"id": "term-varletconst-05", "deck": "Термины собеса", "kind": "topic", "q": "Что выведет код и как исправить?", "code": "for (var i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 0);\n}", "a": "`3 3 3`. У `var` одна переменная на весь цикл, к моменту срабатывания таймеров она равна 3. С `let` у каждой итерации своя `i` — будет `0 1 2`.", "hint": "Сколько переменных i у var?", "added": "2026-10-27"}, {"id": "term-varletconst-06", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «var, let, const и hoisting» полностью, как на собеседовании (4 шага).", "a": "1. Что: `var`, `let` и `const` — способы объявить переменную; различаются областью видимости, хойстингом и возможностью переприсвоить.\n2. Как работает: `var` — функциональная область, поднимается со значением `undefined`; `let` и `const` — блочная область и TDZ до строки объявления.\n3. Пример: `console.log(a); var a = 1` выведет `undefined`, а с `let` будет `ReferenceError`.\n4. Подвох: `const` запрещает переприсваивание, но объект внутри можно менять; `var` в цикле с `setTimeout` даёт `3 3 3`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-vdom-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое Virtual DOM?", "a": "Описание интерфейса в виде обычных JS-объектов, которое React держит в памяти. При изменениях React сравнивает новое описание со старым и обновляет настоящий DOM только там, где есть разница.", "hint": "Объекты в памяти + сравнение.", "added": "2026-10-27"}, {"id": "term-vdom-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое reconciliation (согласование)?", "a": "Алгоритм сравнения старого и нового дерева элементов. Если тип элемента изменился — React пересоздаёт поддерево; если тот же — обновляет атрибуты и идёт вглубь. Элементы списка сопоставляет по `key`.", "hint": "Сравнение двух деревьев.", "added": "2026-10-27"}, {"id": "term-vdom-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Чем фаза render отличается от фазы commit?", "a": "Render — React вызывает компоненты и вычисляет, что должно получиться, DOM не трогает. Commit — применяет изменения к DOM, после этого запускаются эффекты.", "hint": "Вычислить и применить.", "added": "2026-10-27"}, {"id": "term-vdom-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Что значит «React декларативный»?", "code": "// декларативно\n<p>{isOpen ? 'Открыто' : 'Закрыто'}<\/p>\n// императивно\nel.textContent = isOpen ? 'Открыто' : 'Закрыто';", "a": "Мы описываем, как интерфейс должен выглядеть при данном состоянии, а не шаги по изменению DOM. Как привести DOM к этому виду, решает React.", "hint": "Что, а не как.", "added": "2026-10-27"}, {"id": "term-vdom-05", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «Virtual DOM» полностью, как на собеседовании (4 шага).", "a": "1. Что: Virtual DOM — это лёгкое описание интерфейса в виде JS-объектов, которое React держит в памяти.\n2. Как работает: при изменении состояния React строит новое дерево, сравнивает его со старым (reconciliation) и вносит в настоящий DOM только отличия.\n3. Пример: поменялся счётчик в одной кнопке — React обновит один текстовый узел, а не перерисует страницу.\n4. Зачем: работа с настоящим DOM дорогая; React собирает изменения и применяет их пачкой, а мы пишем UI декларативно — описываем результат, а не шаги.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "topic-closure-01", "deck": "Замыкание", "kind": "topic", "q": "Что такое замыкание?", "code": "function outer() {\n  const name = 'Alex';\n  return function inner() {\n    console.log(name);\n  };\n}\n\nconst fn = outer();\nfn(); // 'Alex' — хотя outer уже завершилась", "a": "Замыкание — это функция вместе с доступом к переменным из того места, где её создали. Она может пользоваться ими даже после того, как внешняя функция завершилась. В JS замыкание создаётся при каждом создании функции.", "hint": "Внутренняя функция помнит переменные внешней.", "added": "2026-10-19"}, {"id": "topic-closure-02", "deck": "Замыкание", "kind": "topic", "q": "Что выведет код? Замыкание запоминает значение или переменную?", "code": "let x = 1;\nconst show = () => console.log(x);\n\nx = 2;\nshow();", "a": "Выведет `2`. Замыкание хранит ссылку на переменную (лексическое окружение), а не копию значения, поэтому видит её текущее значение.", "hint": "Хранится ссылка на окружение, а не снимок.", "added": "2026-10-19"}, {"id": "topic-closure-03", "deck": "Замыкание", "kind": "topic", "q": "Продолжает ли функция-замыкание выполняться «с того места, где остановилась»?", "a": "Нет. Каждый вызов функции выполняется с первой строки. Между вызовами сохраняются только переменные внешней функции. «Продолжить с места» умеют генераторы (`function*` и `yield`), а не замыкания.", "hint": "Сохраняются переменные, а не место выполнения.", "added": "2026-10-19"}, {"id": "topic-closure-04", "deck": "Замыкание", "kind": "topic", "q": "Где замыкания используются на практике? Пример с debounce.", "code": "function debounce(fn, ms) {\n  let timer;\n  return (...args) => {\n    clearTimeout(timer);\n    timer = setTimeout(() => fn(...args), ms);\n  };\n}", "a": "Debounce и throttle (хранят id таймера между вызовами), счётчики и приватные переменные, обработчики событий, фабрики функций. В debounce возвращённая функция замыкает `timer` и при каждом вызове отменяет предыдущий таймер.", "hint": "Что должно «жить» между вызовами функции?", "added": "2026-10-19"}, {"id": "topic-closure-05", "deck": "Замыкание", "kind": "topic", "q": "Как сделать переменную, к которой нельзя обратиться снаружи?", "code": "function createWallet() {\n  let balance = 0;\n  return {\n    add(sum) { balance += sum; },\n    get() { return balance; },\n  };\n}\n\nconst wallet = createWallet();\nwallet.add(100);\nwallet.get();    // 100\nwallet.balance;  // undefined", "a": "Объявить переменную внутри функции и вернуть методы, которые с ней работают. Методы замыкают переменную, а снаружи прямого доступа к ней нет. Это приватное состояние через замыкание.", "hint": "Переменная внутри функции снаружи не видна.", "added": "2026-10-19"}, {"id": "topic-closure-06", "deck": "Замыкание", "kind": "topic", "q": "Что выведет код? А если заменить `var` на `let`?", "code": "for (var i = 0; i < 3; i++) {\n  setTimeout(() => console.log(i), 0);\n}", "a": "`3, 3, 3`. У `var` одна переменная на весь цикл: к моменту срабатывания таймеров цикл закончился и `i = 3`. С `let` будет `0, 1, 2` — `let` создаёт новую переменную на каждой итерации.", "hint": "Сколько переменных `i` создаёт `var` и сколько `let`?", "added": "2026-10-19"}, {"id": "topic-closure-07", "deck": "Замыкание", "kind": "topic", "q": "Как долго живут переменные, которые замкнула функция?", "a": "Пока жива сама функция-замыкание, то есть пока на неё есть ссылка. Поэтому лишние замыкания — например, не удалённые обработчики событий — могут держать память, это утечка.", "hint": "Переменная живёт, пока на неё есть ссылка.", "added": "2026-10-19"}, {"id": "topic-el-01", "deck": "Event Loop", "kind": "topic", "q": "Что такое Event Loop?", "a": "Механизм, который позволяет однопоточному JS выполнять асинхронный код, не блокируясь. Event loop следит за стеком вызовов: когда стек пуст, берёт задачи из очередей — сначала все микрозадачи, потом одну макрозадачу, и так по кругу.", "hint": "Стек пуст → микрозадачи → одна макрозадача.", "added": "2026-10-19"}, {"id": "topic-el-02", "deck": "Event Loop", "kind": "topic", "q": "Что выведет код и почему?", "code": "console.log(1);\nsetTimeout(() => console.log(2), 0);\nPromise.resolve().then(() => console.log(3));\nconsole.log(4);", "a": "`1, 4, 3, 2`. Порядок: синхронный код → все микрозадачи → одна макрозадача → снова все микрозадачи → и так далее. `then` — микрозадача, `setTimeout` — макрозадача.", "hint": "Синхронный код всегда первым.", "added": "2026-10-19"}, {"id": "topic-el-03", "deck": "Event Loop", "kind": "topic", "q": "Макрозадачи выполняются все подряд или по одной?", "a": "По одной. После каждой макрозадачи event loop полностью опустошает очередь микрозадач и только потом берёт следующую макрозадачу.", "hint": "Между макрозадачами — проверка микрозадач.", "added": "2026-10-19"}, {"id": "topic-el-04", "deck": "Event Loop", "kind": "topic", "q": "Что относится к микрозадачам?", "a": "Обработчики `then` / `catch` / `finally`, код после `await`, `queueMicrotask`, `MutationObserver`.", "hint": "Всё, что связано с промисами.", "added": "2026-10-19"}, {"id": "topic-el-05", "deck": "Event Loop", "kind": "topic", "q": "Что относится к макрозадачам?", "a": "`setTimeout`, `setInterval`, события (клик, ввод), загрузка скриптов, `MessageChannel`.", "hint": "Таймеры и события.", "added": "2026-10-19"}, {"id": "topic-el-06", "deck": "Event Loop", "kind": "topic", "q": "Почему `then` выполняется раньше `setTimeout(fn, 0)`?", "code": "setTimeout(() => console.log('timeout'), 0);\nPromise.resolve().then(() => console.log('then'));\n// then, timeout", "a": "`then` — микрозадача, а микрозадачи выполняются сразу после синхронного кода, до следующей макрозадачи. Задержка 0 в `setTimeout` означает «не раньше следующей макрозадачи», а не «сразу».", "hint": "Какая очередь проверяется первой?", "added": "2026-10-19"}, {"id": "topic-el-07", "deck": "Event Loop", "kind": "topic", "q": "Что выведет код?", "code": "setTimeout(() => console.log('timeout'), 0);\n\n(async () => {\n  console.log('async start');\n  await null;\n  console.log('after await');\n})();\n\nconsole.log('sync');", "a": "`async start, sync, after await, timeout`. Async-функция синхронно выполняется до `await`, продолжение после `await` — микрозадача, а `setTimeout` — макрозадача, она последняя.", "hint": "Код после `await` — микрозадача.", "added": "2026-10-19"}, {"id": "topic-el-08", "deck": "Event Loop", "kind": "topic", "q": "Что произойдёт при выполнении кода?", "code": "function loop() {\n  Promise.resolve().then(loop);\n}\n\nloop();", "a": "Страница зависнет. Каждая микрозадача ставит новую, очередь микрозадач никогда не опустеет, и event loop не дойдёт ни до макрозадач, ни до отрисовки.", "hint": "Пока есть микрозадачи, макрозадачи ждут.", "added": "2026-10-19"}, {"id": "topic-promise-01", "deck": "Promise и async/await", "kind": "topic", "q": "Что такое Promise?", "code": "const promise = new Promise((resolve, reject) => {\n  // состояние: pending\n  resolve('данные');           // → fulfilled\n  // reject(new Error('fail')); // → rejected\n});\n\npromise.then((data) => console.log(data));", "a": "Объект, который хранит будущий результат асинхронной операции. У него три состояния: pending — ожидание, fulfilled — успех, rejected — ошибка. Состояние меняется один раз. Результат обрабатывают через `then` / `catch` / `finally` или через `async/await`.", "hint": "Три состояния, переход — один раз и навсегда.", "added": "2026-10-19"}, {"id": "topic-promise-02", "deck": "Promise и async/await", "kind": "topic", "q": "Когда выполняется функция внутри `new Promise(...)`? Что выведет код?", "code": "console.log(1);\n\nnew Promise((resolve) => {\n  console.log(2);\n  resolve();\n});\n\nconsole.log(3);", "a": "`1, 2, 3`. Функция-исполнитель (executor) выполняется сразу и синхронно, в момент создания промиса. Асинхронно выполняются только обработчики `then` / `catch` / `finally`.", "hint": "Executor — это не отложенный коллбэк.", "added": "2026-10-19"}, {"id": "topic-promise-03", "deck": "Promise и async/await", "kind": "topic", "q": "Что выведет код?", "code": "Promise.resolve().then(() => console.log('then'));\nconsole.log('sync');", "a": "`sync`, потом `then`. Обработчик `then` всегда выполняется асинхронно — как микрозадача, после всего синхронного кода. Даже если промис уже выполнен.", "hint": "`then` → очередь микрозадач.", "added": "2026-10-19"}, {"id": "topic-promise-04", "deck": "Promise и async/await", "kind": "topic", "q": "Что выведет цепочка, если промис отклонён?", "code": "Promise.reject(new Error('fail'))\n  .then(() => console.log('A'))\n  .catch((err) => console.log('B', err.message))\n  .then(() => console.log('C'));", "a": "`B fail`, потом `C`. При ошибке все `then` пропускаются до ближайшего `catch`. Если `catch` отработал без ошибки, цепочка дальше идёт как успешная, поэтому `C` выполняется.", "hint": "Ошибка «перепрыгивает» `then` до ближайшего `catch`.", "added": "2026-10-19"}, {"id": "topic-promise-05", "deck": "Promise и async/await", "kind": "topic", "q": "Что будет, если выбросить ошибку внутри `then`?", "code": "Promise.resolve(1)\n  .then(() => {\n    throw new Error('oops');\n  })\n  .then(() => console.log('не выполнится'))\n  .catch((err) => console.log(err.message));", "a": "Выведет `oops`. `throw` внутри `then` переводит промис в состояние rejected — это то же самое, что `reject`. Следующие `then` пропускаются, срабатывает ближайший `catch`.", "hint": "`throw` в цепочке = `reject`.", "added": "2026-10-19"}, {"id": "topic-promise-06", "deck": "Promise и async/await", "kind": "topic", "q": "Что получит второй `then`?", "code": "Promise.resolve(2)\n  .then((x) => { x * 10 })\n  .then((y) => console.log(y));", "a": "`undefined`. Следующий `then` получает то, что вернул предыдущий. В стрелочной функции с фигурными скобками нет `return`, значит она возвращает `undefined`. Правильно: `(x) => x * 10` или `{ return x * 10; }`.", "hint": "Значение передаётся дальше только через `return`.", "added": "2026-10-19"}, {"id": "topic-promise-07", "deck": "Promise и async/await", "kind": "topic", "q": "Что делает `await` при успехе и при ошибке промиса?", "code": "async function load() {\n  try {\n    const user = await getUser(1);\n    console.log(user);\n  } catch (err) {\n    console.log(err.message);\n  }\n}", "a": "`await` приостанавливает только эту async-функцию, пока промис не выполнится. При успехе возвращает результат промиса. При ошибке выбрасывает её как исключение — её ловит `try/catch`. Код снаружи функции в это время продолжает выполняться.", "hint": "Успех → значение, ошибка → `throw`.", "added": "2026-10-19"}, {"id": "topic-promise-08", "deck": "Promise и async/await", "kind": "topic", "q": "Чем отличаются `Promise.all` и `Promise.allSettled`?", "code": "await Promise.all([a(), b()]);\n// массив результатов, но упадёт при первой ошибке\n\nawait Promise.allSettled([a(), b()]);\n// [{ status: 'fulfilled', value }, { status: 'rejected', reason }]", "a": "`Promise.all` ждёт все промисы и возвращает массив результатов, но отклоняется сразу при первой ошибке. `Promise.allSettled` ждёт все промисы и возвращает статус каждого — он никогда не отклоняется.", "hint": "«Всё или ничего» против «отчёт по каждому».", "added": "2026-10-19"}, {"id": "topic-promise-09", "deck": "Promise и async/await", "kind": "topic", "q": "Что выведет цепочка?", "code": "Promise.resolve(1)\n  .then((x) => x + 1)\n  .then((x) => x * 10)\n  .then((x) => console.log(x));", "a": "`20`. Каждый `then` получает то, что вернул предыдущий, а не исходное значение: 1 → 2 → 20. Стрелки без фигурных скобок возвращают результат сами.", "hint": "Значение передаётся по цепочке от `then` к `then`.", "added": "2026-10-21"}, {"id": "topic-promise-10", "deck": "Promise и async/await", "kind": "topic", "q": "Как сделать паузу между действиями в async-функции? Напиши `wait`.", "code": "function wait(ms) {\n  return new Promise((resolve) => {\n    setTimeout(() => resolve(), ms);\n  });\n}\n\nasync function countdown() {\n  console.log(3);\n  await wait(1000);\n  console.log(2);\n  await wait(1000);\n  console.log('Старт!');\n}", "a": "`wait` возвращает промис, который выполняется через `ms` миллисекунд: `resolve()` вызывается внутри `setTimeout`. В async-функции `await wait(1000)` ставит её на паузу на секунду. `await` можно использовать сколько угодно раз — каждый раз функция ждёт и только потом идёт дальше.", "hint": "`resolve` — внутри таймера; `await` — сколько угодно раз.", "added": "2026-10-21"}, {"id": "topic-promise-11", "deck": "Promise и async/await", "kind": "topic", "q": "Что выведет код? Когда выполняется `finally`?", "code": "function test() {\n  try {\n    console.log(1);\n    throw new Error('x');\n  } catch (e) {\n    console.log(2);\n    return 'из catch';\n  } finally {\n    console.log(3);\n  }\n}\n\nconsole.log(test());", "a": "`1`, `2`, `3`, `из catch`. `throw` переводит в `catch`. `finally` выполняется всегда — даже если в `try` или `catch` стоит `return`: сначала `finally`, потом функция возвращает значение.", "hint": "`finally` выполняется всегда, даже перед `return`.", "added": "2026-10-21"}], "progress": {"term-ts_utility-01": {"box": 0, "due": "2026-11-07", "seen": 0, "wrong": 0}, "topic-el-03": {"box": 1, "due": "2026-10-20", "last": "2026-10-19", "seen": 1, "wrong": 0}, "term-varletconst-01": {"box": 0, "due": "2026-10-28", "seen": 0, "wrong": 0}, "term-perf-04": {"box": 0, "due": "2026-11-05", "seen": 0, "wrong": 0}, "term-controlled-04": {"box": 0, "due": "2026-11-02", "seen": 0, "wrong": 0}, "term-memo-01": {"box": 0, "due": "2026-11-03", "seen": 0, "wrong": 0}, "term-memo-02": {"box": 0, "due": "2026-11-03", "seen": 0, "wrong": 0}, "term-immutability-03": {"box": 0, "due": "2026-10-31", "seen": 0, "wrong": 0}, "err-js-06": {"box": 0, "due": "2026-10-20", "last": "2026-10-19", "seen": 1, "wrong": 0}, "term-arrays-04": {"box": 0, "due": "2026-10-30", "seen": 0, "wrong": 0}, "term-functions-03": {"box": 0, "due": "2026-10-30", "seen": 0, "wrong": 0}, "term-vdom-03": {"box": 0, "due": "2026-10-31", "seen": 0, "wrong": 0}, "term-this-04": {"box": 0, "due": "2026-10-28", "seen": 0, "wrong": 0}, "err-css-12": {"box": 0, "due": "2026-10-20", "last": "2026-10-19", "seen": 1, "wrong": 0}, "term-key-01": {"box": 0, "due": "2026-11-02", "seen": 0, "wrong": 0}, "term-usee <script>
const SEED=JSON.parse(document.getElementById("seed").textContent);
const LS="dojo-cards-progress";
const BELTS=[["Белый","#f2f2f2"],["Жёлтый","#e8c53a"],["Оранжевый","#e2832b"],["Зелёный","#3f9a5a"],["Синий","#2f63b8"],["Коричневый","#7a4b2a"],["Чёрный","#111111"]];
const INTERVAL=[0,1,2,4,7,14,30];
const state={cards:[],progress:{},local:{},deck:"Все",mode:"due",queue:[],cur:null,shown:false,hinted:false,done:0,total:0};

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>")}
function snip(c){return c.code?'<pre class="snippet"><code>'+esc(c.code)+'</code></pre>':''}
function avail(c){return !c.from||c.from<=today()}
function isDue(c){if(!avail(c))return false;const p=state.progress[c.id];return !p||!p.due||p.due<=today()}
function inDeck(c){return state.deck==="Все"||c.deck===state.deck}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function loadLocal(){try{return JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch(e){return {}}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state.local));return true}catch(e){return false}}
function merge(){
  const m={...SEED.progress};
  for(const [id,p] of Object.entries(state.local)){const s=m[id];if(!s||!s.last||(p.last&&p.last>=s.last))m[id]=p}
  state.progress=m;
}

function renderStats(){
  const cs=state.cards.filter(inDeck);
  document.getElementById("sDue").textContent=cs.filter(isDue).length;
  document.getElementById("sNew").textContent=cs.filter(c=>avail(c)&&!state.progress[c.id]).length;
  document.getElementById("sAll").textContent=cs.length;
}
function renderDecks(){
  const el=document.getElementById("decks");
  const names=["Все",...[...new Set(state.cards.map(c=>c.deck))].sort()];
  el.innerHTML="";
  for(const n of names){
    const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed",String(n===state.deck));
    const cnt=state.cards.filter(c=>(n==="Все"||c.deck===n)&&isDue(c)).length;
    b.innerHTML=esc(n)+" <i>"+cnt+"</i>";
    b.onclick=()=>{state.deck=n;buildQueue();renderAll()};
    el.appendChild(b);
  }
  const more=document.getElementById("moreDecks");
  more.hidden=el.classList.contains("open")||el.scrollHeight<=el.clientHeight+2;
}
function buildQueue(){
  let cs=state.cards.filter(inDeck);
  if(state.mode==="due")cs=cs.filter(isDue);
  const errs=shuffle(cs.filter(c=>c.kind==="error")),rest=shuffle(cs.filter(c=>c.kind!=="error"));
  state.queue=[...errs,...rest];state.done=0;state.total=state.queue.length;next();
}
function next(){state.cur=state.queue.shift()||null;state.shown=false;state.hinted=false}
function beltOf(c){const p=state.progress[c.id];return Math.min(p?.box??0,BELTS.length-1)}
function renderCard(){
  const el=document.getElementById("card");
  document.getElementById("pbar").style.width=state.total?(state.done/state.total*100)+"%":"0";
  const c=state.cur;
  if(!c){
    const left=state.cards.filter(inDeck).filter(isDue).length;
    el.innerHTML='<div class="empty"><strong>'+(state.total?'На сегодня всё 🥋':'На сегодня карточек нет')+'</strong><span>'+(state.total?'Пройдено: '+state.done+'. ':'')+(left?'Осталось к повтору: '+left+'.':'Следующие карточки придут по расписанию.')+'</span><button class="link" id="again">Пройти все карточки колоды подряд</button></div>';
    document.getElementById("again").onclick=()=>{setMode("all")};return;
  }
  const b=beltOf(c);
  el.innerHTML='<div class="meta"><span class="deck">'+esc(c.deck)+'</span><span class="belt">'+BELTS[b][0]+' пояс <span style="background:'+BELTS[b][1]+'"></span></span></div>'+
    '<div class="q">'+fmt(c.q)+'</div>'+snip(c)+
    (state.hinted&&c.hint?'<div class="hintbox"><b>Подсказка</b>'+fmt(c.hint)+'</div>':'')+
    (state.shown?'<div class="a">'+fmt(c.a)+'</div>':'')+
    '<div class="actions'+(!state.shown&&c.hint&&!state.hinted?' two':'')+'">'+(state.shown?
      '<button class="btn bad" data-r="0">Не помню<small>ещё раз</small></button><button class="btn mid" data-r="1">С трудом<small>завтра</small></button><button class="btn good" data-r="2">Помню<small>через '+INTERVAL[Math.min(b+1,6)]+' дн.</small></button>'
      :((c.hint&&!state.hinted)?'<button class="btn hint" id="hint">Подсказка<small>теория</small></button>':'')+'<button class="btn show" id="show">Показать ответ<small>сначала ответь вслух</small></button>')+'</div>';
  if(state.shown)el.querySelectorAll("[data-r]").forEach(x=>x.onclick=()=>rate(+x.dataset.r));
  else{document.getElementById("show").onclick=show;const hb=document.getElementById("hint");if(hb)hb.onclick=hint}
}
function renderList(){
  const el=document.getElementById("list");
  if(state.mode==="eve"){
    const all=state.cards.filter(inDeck).filter(avail);
    const dates=[...new Set(all.map(c=>c.added).filter(Boolean))].sort();
    const day=dates.includes(today())?today():dates[dates.length-1];
    const cs=all.filter(c=>c.added===day);
    const d=day?day.split("-").reverse().slice(0,2).join("."):"";
    el.innerHTML='<p class="eve-head">'+(day===today()?'Добавлены сегодня':'Добавлены '+d)+' · '+cs.length+' карточек. Просто прочитай — утром спрошу.</p>'+(cs.length?cs.map(c=>'<article class="eve"><span class="deck">'+esc(c.deck)+'</span><h3>'+fmt(c.q)+'</h3>'+snip(c)+(c.hint?'<p class="eve-hint">'+fmt(c.hint)+'</p>':'')+'<div class="a">'+fmt(c.a)+'</div></article>').join(""):'<p class="empty">За этот день карточек нет.</p>');
    return;
  }
  const cs=state.cards.filter(inDeck).filter(avail);
  el.innerHTML=cs.length?cs.map(c=>'<details><summary><span>'+fmt(c.q)+'</span><span class="deck">'+BELTS[beltOf(c)][0]+'</span></summary>'+snip(c)+(c.hint?'<p class="eve-hint">'+fmt(c.hint)+'</p>':'')+'<div class="a">'+fmt(c.a)+'</div></details>').join(""):'<p class="empty">В этой колоде пока пусто.</p>';
}
function renderAll(){
  renderStats();renderDecks();
  const list=state.mode==="list"||state.mode==="eve";
  document.getElementById("card").hidden=list;document.getElementById("list").hidden=!list;
  document.querySelector(".progress").hidden=list;
  if(list)renderList();else renderCard();
}
function hint(){if(!state.cur||state.shown||!state.cur.hint)return;state.hinted=true;renderCard()}
function show(){if(!state.cur||state.shown)return;state.shown=true;renderCard()}
function rate(r){
  const c=state.cur;if(!c||!state.shown)return;
  const p=state.progress[c.id]||{box:0,seen:0,wrong:0};
  let box=p.box??0,due;
  if(r===0){box=0;due=today();state.queue.push(c)}
  else if(r===1){due=addDays(1)}
  else{box=Math.min(box+1,6);due=addDays(INTERVAL[box])}
  const np={box,due,seen:(p.seen||0)+1,wrong:(p.wrong||0)+(r===0?1:0),last:today()};
  state.local[c.id]=np;state.progress[c.id]=np;
  if(r!==0)state.done++; else state.total++;
  document.getElementById("saveState").textContent=saveLocal()?"":"Прогресс не сохраняется: браузер запретил хранилище (приватный режим?)";
  next();renderAll();window.scrollTo({top:0});
}
function setMode(m){
  state.mode=m;["mDue","mAll","mList","mEve"].forEach(id=>document.getElementById(id).setAttribute("aria-pressed","false"));
  document.getElementById({due:"mDue",all:"mAll",list:"mList",eve:"mEve"}[m]).setAttribute("aria-pressed","true");
  if(m!=="list"&&m!=="eve")buildQueue();renderAll();
}
document.getElementById("mDue").onclick=()=>setMode("due");
document.getElementById("mAll").onclick=()=>setMode("all");
document.getElementById("mList").onclick=()=>setMode("list");
document.getElementById("mEve").onclick=()=>setMode("eve");
document.getElementById("moreDecks").onclick=()=>{document.getElementById("decks").classList.add("open");renderDecks()};
document.getElementById("copyProg").onclick=async()=>{
  const txt="Прогресс карточек с сайта: "+JSON.stringify(state.local);
  const ss=document.getElementById("saveState");
  try{await navigator.clipboard.writeText(txt);ss.textContent="Скопировано: "+Object.keys(state.local).length+" карточек. Вставь в чат Додзё."}
  catch(e){ss.textContent="Не удалось скопировать автоматически."}
};
document.addEventListener("keydown",e=>{
  if(state.mode==="list"||state.mode==="eve")return;
  if((e.key==="h"||e.key==="р")&&!state.shown&&state.cur){e.preventDefault();hint()}
  else if((e.key===" "||e.key==="Enter")&&!state.shown&&state.cur){e.preventDefault();show()}
  else if(state.shown&&["1","2","3"].includes(e.key)){e.preventDefault();rate(+e.key-1)}
});
state.cards=SEED.cards.slice().sort((a,b)=>String(a.added||"").localeCompare(String(b.added||"")));
state.local=loadLocal();merge();buildQueue();renderAll();
</script>
<script>
(function(){function save(){try{var k=location.hash.slice(1);var t=document.querySelector('.tab[aria-selected="true"]');
localStorage.setItem('dojo-last',JSON.stringify({s:"cards",n:"Карточки Додзё",k:k,t:t?t.textContent.trim():'',at:Date.now()}))}catch(e){}}
addEventListener('hashchange',save);addEventListener('load',function(){setTimeout(save,300)});
document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('.tab'))setTimeout(save,50)});})();
</script>
