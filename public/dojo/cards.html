<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Карточки Додзё</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Oswald:wght@500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#080808; --surface:#131112; --fg:#efe9ea; --muted:#9a9093; --line:#262123;
  --accent:#e0283a; --accent-soft:#2a1013; --code-bg:#1d191a;
  --bad:#e0283a; --mid:#d99a2b; --good:#4fb07a; color-scheme:dark;
  --f-display:"Oswald","Arial Narrow",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding-block:max(16px,env(safe-area-inset-top)) max(40px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:600;font-size:28px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
h1 span{color:var(--accent)}
.stats{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.stat b{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1}
.stat small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.due b{color:var(--accent)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:7px 12px;font:500 13px var(--f-body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] i{color:inherit;opacity:.7}
.chip:focus-visible,.btn:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.decks{max-height:138px;overflow:hidden}
.decks.open{max-height:none}
.more{font-size:13px}
.mode{display:flex;gap:6px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:16px;min-height:260px}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.deck{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--accent)}
.belt{display:inline-flex;align-items:center;gap:6px}
.belt span{width:22px;height:6px;border-radius:2px;border:1px solid var(--line)}
.q{font-size:19px;font-weight:600;line-height:1.4;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.a{border-top:1px dashed var(--line);padding-top:14px;font-size:16px;min-width:0;overflow-wrap:anywhere;white-space:pre-line}
.card,.eve,.list details{min-width:0;max-width:100%}
.snippet{margin:0;font-family:var(--f-mono);font-size:13px;line-height:1.55;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre;max-width:100%;tab-size:2}
.snippet code{background:none;padding:0;font-size:inherit;border-radius:0}
.list details .snippet{margin-top:10px}
code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:13px 6px;font:600 15px var(--f-body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.btn small{font-weight:500;font-size:11px;color:var(--muted)}
.btn.show{grid-column:1/-1;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.actions.two .btn.show{grid-column:2/-1}
.btn.hint{border-style:dashed}
.hintbox{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:15px;min-width:0;overflow-wrap:anywhere}
.hintbox b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--accent);display:block;margin-bottom:4px}
.btn.show small{color:inherit;opacity:.7}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.mid{border-color:var(--mid);color:var(--mid)}
.btn.good{border-color:var(--good);color:var(--good)}
.empty{color:var(--muted);text-align:center;margin:auto;max-width:42ch;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--fg);font-size:18px}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress div{height:100%;background:var(--accent);width:0;transition:width .3s}
.foot{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.link{background:none;border:0;color:var(--fg);text-decoration:underline;cursor:pointer;font:inherit;padding:0;text-align:left}
.list{display:flex;flex-direction:column;gap:8px}
.list details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.list summary{cursor:pointer;font-weight:600;display:flex;gap:10px;justify-content:space-between}
.list summary span:first-child{min-width:0;overflow-wrap:anywhere}
.list .a{border:0;padding-top:8px;font-size:14px}
.eve-head{color:var(--muted);font-size:13px;margin:0}
.eve{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.eve h3{margin:0;font-size:17px;line-height:1.4;font-weight:600;overflow-wrap:anywhere}
.eve-hint{margin:0;background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:14px;overflow-wrap:anywhere}
.eve .a{border-top:1px dashed var(--line);padding-top:8px;font-size:15px}
@media (max-width:480px){.stat{align-items:flex-start}}
@media (prefers-reduced-motion:reduce){.progress div{transition:none}}
</style>

<style>
.dojo-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0;padding:0;font:500 15px/1.2 Onest,system-ui,sans-serif}
.dojo-bar a{color:#e9e9e9;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border:1px solid #2a2a2a;border-radius:999px;background:#111}
.dojo-bar a:active{background:#1c1c1c}
.dojo-bar span{color:#8a8a8a;font-size:13px}
</style>

<body>
<div class="wrap"><nav class="dojo-bar"><a href="./">← Все разделы</a><span>Карточки Додзё</span></nav>
  <header>
    <h1>Карточки <span>Додзё</span></h1>
    <div class="stats">
      <div class="stat due"><b id="sDue">—</b><small>на сегодня</small></div>
      <div class="stat"><b id="sNew">—</b><small>новых</small></div>
      <div class="stat"><b id="sAll">—</b><small>всего</small></div>
    </div>
  </header>

  <div class="mode" role="group" aria-label="Режим">
    <button class="chip" id="mDue" aria-pressed="true">По расписанию</button>
    <button class="chip" id="mAll" aria-pressed="false">Все подряд</button>
    <button class="chip" id="mList" aria-pressed="false">Список</button>
    <button class="chip" id="mEve" aria-pressed="false">Вечер · читать</button>
  </div>
  <div>
    <div class="bar decks" id="decks" aria-label="Колоды"></div>
    <button class="link more" id="moreDecks" hidden>Все колоды ↓</button>
  </div>

  <div class="progress" aria-hidden="true"><div id="pbar"></div></div>
  <section class="card" id="card" aria-live="polite"></section>
  <section class="list" id="list" hidden></section>

  <div class="foot">
    <span>Прогресс хранится в этом браузере. Колода обновлена: 28.10.2026.</span>
    <button class="link" id="copyProg">Скопировать прогресс для Claude</button>
    <span id="saveState"></span>
  </div>
</div>

<script id="seed" type="application/json">{"cards": [{"id": "err-css-01", "deck": "HTML/CSS", "kind": "error", "q": "Чем отличаются `vertical-align` и `align-items`?", "code": ".icon {\n  display: inline-block;\n  vertical-align: middle;\n}\n\n.row {\n  display: flex;\n  align-items: center;\n}", "a": "`vertical-align` выравнивает строчные элементы (`inline`, `inline-block`) и ячейки таблиц внутри строки. `align-items` пишется на flex- или grid-контейнере и выравнивает его дочерние элементы по поперечной оси.", "hint": "Одно — для строчных элементов, другое — для flex/grid-контейнера.", "added": "2026-10-19"}, {"id": "err-css-02", "deck": "HTML/CSS", "kind": "error", "q": "Зачем нужен `<label>` и как связать его с полем?", "code": "<label for=\"phone\">Телефон<\/label>\n<input id=\"phone\" type=\"tel\">\n\n<!-- или поле внутри label -->\n<label>Телефон <input type=\"tel\"><\/label>", "a": "`<label>` — подпись к полю формы. Связь — через атрибут `for`, равный `id` поля, или поле внутри `label`. Клик по подписи ставит фокус в поле, а скринридер зачитывает подпись при фокусе.", "hint": "`for` у label = `id` у input.", "added": "2026-10-19"}, {"id": "err-css-03", "deck": "HTML/CSS", "kind": "error", "q": "Что такое `currentColor`?", "code": ".button {\n  color: #FF9549;\n}\n\n.button svg {\n  stroke: currentColor;\n}", "a": "Ключевое слово «текущее значение свойства `color`». Пишется без `#`. Удобно для SVG-иконок: меняешь `color` у кнопки, например на hover, — меняется и цвет иконки.", "hint": "Это ключевое слово, а не hex-цвет.", "added": "2026-10-19"}, {"id": "err-css-04", "deck": "HTML/CSS", "kind": "error", "q": "Какие семантические теги использовать для шапки и контактов?", "code": "<header class=\"header\">\n  <address class=\"header__contacts\">\n    <a href=\"tel:+79990000000\">+7 999 000-00-00<\/a>\n  <\/address>\n<\/header>", "a": "`<header>` — шапка страницы или раздела, `<address>` — контактная информация. Семантические теги помогают скринридерам и поисковикам понимать структуру страницы. `div` — только когда подходящего тега нет.", "hint": "Есть отдельные теги для шапки и для контактов.", "added": "2026-10-19"}, {"id": "err-css-05", "deck": "HTML/CSS", "kind": "error", "q": "Как связать текст ошибки с полем для скринридера?", "code": "<input id=\"phone\" aria-describedby=\"phone-error\" aria-invalid=\"true\">\n<p id=\"phone-error\">Неверный номер телефона<\/p>", "a": "Атрибутом `aria-describedby` со значением `id` элемента с текстом ошибки. Скринридер прочитает ошибку при фокусе на поле. `id` должен совпадать символ в символ — опечатку глазами не видно, а связь сломается.", "hint": "Связь по `id`, как у label.", "added": "2026-10-19"}, {"id": "err-css-06", "deck": "HTML/CSS", "kind": "error", "q": "Чем отличаются `justify-content` и `align-items` во flex?", "code": ".row {\n  display: flex;\n  justify-content: space-between; /* по главной оси */\n  align-items: center;            /* по поперечной */\n}", "a": "`justify-content` распределяет элементы по главной оси (при `flex-direction: row` — по горизонтали). `align-items` выравнивает по поперечной оси (по вертикали). При `flex-direction: column` оси меняются местами.", "hint": "Главная ось и поперечная ось.", "added": "2026-10-19"}, {"id": "err-css-07", "deck": "HTML/CSS", "kind": "error", "q": "Как отцентрировать блок по горизонтали и вертикали?", "code": ".parent {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n\n/* или */\n.parent {\n  display: grid;\n  place-items: center;\n}", "a": "Через flex: `justify-content: center` и `align-items: center` на родителе. Или через grid: `place-items: center`. Оба способа работают для элемента любого размера.", "hint": "Свойства пишутся на родителе.", "added": "2026-10-19"}, {"id": "err-css-08", "deck": "HTML/CSS", "kind": "error", "q": "Зачем элементу во flex `flex-shrink: 0`?", "code": ".field {\n  display: flex;\n}\n\n.field__icon {\n  flex-shrink: 0;\n}", "a": "По умолчанию flex-элементы сжимаются, если не хватает места (`flex-shrink: 1`). `flex-shrink: 0` запрещает сжатие — например, иконка сохранит свой размер рядом с длинным текстом.", "hint": "По умолчанию flex-элементы могут сжиматься.", "added": "2026-10-19"}, {"id": "err-css-09", "deck": "HTML/CSS", "kind": "error", "q": "Что даёт `type=\"tel\"` у поля ввода?", "code": "<input type=\"tel\">\n<a href=\"tel:+79990000000\">Позвонить<\/a>", "a": "На мобильных открывает цифровую клавиатуру и даёт полю правильную семантику. Формат номера `type=\"tel\"` не проверяет. Позвонить по клику позволяет ссылка `href=\"tel:...\"`, а не поле.", "hint": "Влияет на клавиатуру, а не на звонки.", "added": "2026-10-19"}, {"id": "err-css-10", "deck": "HTML/CSS", "kind": "error", "q": "Чем отличаются пробел и запятая в селекторе?", "code": "/* запятая — список: «и это, и это» */\n*, *::before, *::after {\n  box-sizing: border-box;\n}\n\n/* пробел — вложенность: .title внутри .card */\n.card .title {\n  color: red;\n}", "a": "Запятая перечисляет независимые селекторы. Пробел — комбинатор потомка: элемент внутри другого. `body ::after ::before` означает «::before внутри ::after внутри body» и ничего не выберет.", "hint": "Запятая — «и», пробел — «внутри».", "added": "2026-10-19"}, {"id": "err-css-11", "deck": "HTML/CSS", "kind": "error", "q": "Чем отличаются `fill` и `stroke` в SVG?", "code": "<svg viewBox=\"0 0 24 24\">\n  <path d=\"M5 12h14\" fill=\"none\" stroke=\"currentColor\"/>\n<\/svg>", "a": "`fill` — заливка фигуры, `stroke` — обводка (контур). У контурных иконок цвет задаёт `stroke`, поэтому `currentColor` ставят туда, иначе цвет не поменяется.", "hint": "Заливка и обводка.", "added": "2026-10-19"}, {"id": "err-css-12", "deck": "HTML/CSS", "kind": "error", "q": "Стили не применились. Как найти причину?", "code": "/* в CSS */\n.button--sm { padding: 8px; }\n\n<!-- в HTML -->\n<button class=\"button button--small\">", "a": "Открыть DevTools → Elements → Styles. Если правила нет совсем — не совпадает селектор (например, опечатка в классе, как здесь `--sm` и `--small`). Если правило перечёркнуто — его перебило другое по специфичности или порядку. Итоговое значение видно во вкладке Computed.", "hint": "Где в браузере видно, какие правила применились?", "added": "2026-10-19"}, {"id": "err-css-13", "deck": "HTML/CSS", "kind": "error", "q": "Зачем у `<img>` атрибуты `width` и `height`?", "code": "<img src=\"hero.webp\" width=\"1440\" height=\"700\" alt=\"Внедорожник TANK 500\">", "a": "Браузер заранее резервирует место под картинку по её пропорциям, и страница не прыгает, когда картинка загрузится (метрика CLS). Указывают реальные размеры изображения.", "hint": "Что происходит со страницей, пока картинка грузится?", "added": "2026-10-19"}, {"id": "err-css-14", "deck": "HTML/CSS", "kind": "error", "q": "Что такое логические свойства в CSS?", "code": "padding-block: 16px;   /* сверху и снизу */\npadding-inline: 24px;  /* слева и справа */\ninline-size: 100%;     /* ширина */\nblock-size: 48px;      /* высота */", "a": "Свойства, которые задают направления относительно потока текста, а не сторон экрана: `block` — по вертикали, `inline` — по горизонтали (для обычного письма слева направо). Корректно работают и для языков справа налево.", "hint": "`block` — вертикаль, `inline` — горизонталь.", "added": "2026-10-19"}, {"id": "err-css-15", "deck": "HTML/CSS", "kind": "error", "q": "Что такое модификатор в БЭМ и как его называть?", "code": "<button class=\"button button--large\">Отправить<\/button>\n<button class=\"button button--secondary\">Отмена<\/button>", "a": "Модификатор задаёт вариант блока или элемента: размер, вид, состояние. Пишется через `--`. Называют по смыслу отличия (`button--large`, `button--disabled`), а не по содержимому.", "hint": "Модификатор описывает, чем вариант отличается.", "added": "2026-10-19"}, {"id": "err-css-16", "deck": "HTML/CSS", "kind": "error", "q": "Что такое схлопывание margin?", "code": ".a { margin-bottom: 20px; }\n.b { margin-top: 30px; }\n/* расстояние между .a и .b — 30px, а не 50px */", "a": "Вертикальные `margin` соседних блоков не складываются — берётся больший. Схлопывания нет у горизонтальных отступов и у элементов внутри flex- и grid-контейнеров.", "hint": "Вертикальные отступы соседей не суммируются.", "added": "2026-10-19"}, {"id": "err-css-17", "deck": "HTML/CSS", "kind": "error", "q": "Чем отличаются `padding` и `margin`?", "code": ".card {\n  padding: 24px;       /* внутри: фон карточки его закрашивает */\n  margin-bottom: 16px; /* снаружи: расстояние до соседа */\n}", "a": "`padding` — внутренний отступ между содержимым и границей блока, его закрашивает фон блока. `margin` — внешний отступ между блоками, он прозрачный и по вертикали может схлопываться.", "hint": "Внутри рамки или снаружи.", "added": "2026-10-19"}, {"id": "err-css-18", "deck": "HTML/CSS", "kind": "error", "q": "Что такое контекст наложения и зачем `isolation: isolate`?", "code": ".hero {\n  position: relative;\n  isolation: isolate;\n}\n\n.hero__bg {\n  position: absolute;\n  inset: 0;\n  z-index: -1;\n}", "a": "`z-index` сравнивается внутри контекста наложения. `isolation: isolate` создаёт у `.hero` новый контекст, поэтому фон с `z-index: -1` остаётся под содержимым hero, но не уходит под фон страницы.", "hint": "Без нового контекста `z-index: -1` уходит ниже родителя.", "added": "2026-10-19"}, {"id": "err-css-19", "deck": "HTML/CSS", "kind": "error", "q": "Как располагать медиа-запросы при desktop-first?", "code": ".title { font-size: 48px; }\n\n@media (max-width: 1024px) {\n  .title { font-size: 36px; }\n}\n\n@media (max-width: 600px) {\n  .title { font-size: 28px; }\n}", "a": "Базовые стили пишут для десктопа, а медиа-запросы с `max-width` — от большего экрана к меньшему. Правило для меньшего экрана стоит ниже и перекрывает предыдущее.", "hint": "Меньший экран — ниже по коду.", "added": "2026-10-19"}, {"id": "err-js-02", "deck": "Promise и async/await", "kind": "error", "q": "Почему промис никогда не выполнится?", "code": "new Promise((resolve) => {\n  setTimeout(() => {\n    resolve;\n  }, 1000);\n}).then(() => console.log('готово'));", "a": "`resolve` не вызван — нет скобок. Это просто ссылка на функцию. Промис навсегда остаётся в состоянии pending, `then` не сработает, и ошибки не будет. Нужно `resolve()`.", "hint": "Функция выполняется только при вызове — со скобками.", "added": "2026-10-19"}, {"id": "err-js-03", "deck": "Promise и async/await", "kind": "error", "q": "Откуда в `result` берётся значение?", "code": "function checkAge(age) {\n  return new Promise((resolve) => {\n    resolve('Доступ разрешён');\n  });\n}\n\ncheckAge(20).then((result) => console.log(result));", "a": "`then` сам вызывает переданную функцию и передаёт ей первым аргументом значение из `resolve`. `result` — просто имя параметра, его выбираем мы. Выведет «Доступ разрешён».", "hint": "Параметр функции получает переданный при вызове аргумент.", "added": "2026-10-19"}, {"id": "err-js-04", "deck": "JS: синтаксис и функции", "kind": "error", "q": "Почему `undefined`, а не ошибка?", "code": "const err = new Error('Нет доступа');\nconsole.log(err.mesasge); // undefined", "a": "В имени свойства опечатка — `mesasge` вместо `message`. Обращение к несуществующему свойству объекта возвращает `undefined`, программа не падает. Видишь `undefined` вместо значения — проверь имя свойства.", "hint": "Несуществующее свойство объекта — это `undefined`.", "added": "2026-10-19"}, {"id": "err-js-05", "deck": "JS: синтаксис и функции", "kind": "error", "q": "Что выведут две строки?", "code": "const error = new Error('fail');\n\nconsole.log('Ошибка: error.message');\nconsole.log('Ошибка:', error.message);", "a": "Первая выведет текст «Ошибка: error.message» как есть — всё внутри кавычек это строка. Вторая выведет «Ошибка: fail». Переменные пишутся вне кавычек.", "hint": "Всё в кавычках — текст, а не переменная.", "added": "2026-10-19"}, {"id": "err-js-06", "deck": "JS: синтаксис и функции", "kind": "error", "q": "Почему внутри `getUser` параметр `id` равен `undefined`?", "code": "function getUser(id) { /* ... */ }\n\nasync function showUser() {\n  const user = await getUser();\n}\n\nshowUser(1);", "a": "У `showUser` нет параметра, поэтому переданная `1` никуда не попадает. А `getUser` вызвана без аргумента — её `id` равен `undefined`. Нужно: `async function showUser(id)` и внутри `getUser(id)`.", "hint": "Аргумент попадает в функцию, только если у неё объявлен параметр.", "added": "2026-10-19"}, {"id": "err-js-07", "deck": "Promise и async/await", "kind": "error", "q": "Как работает `try / catch / finally`?", "code": "try {\n  // код, который может выбросить ошибку\n} catch (err) {\n  // сюда — если в try была ошибка\n} finally {\n  // выполнится в любом случае\n}", "a": "`try` выполняет блок кода. Если внутри выброшена ошибка, остаток `try` пропускается и управление переходит в `catch`, куда приходит объект ошибки. `finally` выполняется всегда. У `try` нет условия — это не `if`.", "hint": "`try` ничего не проверяет — он ловит ошибки.", "added": "2026-10-19"}, {"id": "err-js-08", "deck": "Promise и async/await", "kind": "error", "q": "Что выведет код и как исправить?", "code": "async function show() {\n  const result = checkAge(20); // checkAge возвращает промис\n  console.log(result);\n}\n\nshow();", "a": "Выведет `Promise { <pending> }`: без `await` в переменную попадает сам промис, а не его результат. И ошибку такого промиса `try/catch` не поймает. Нужно `const result = await checkAge(20);`.", "hint": "`await` ставится перед вызовом функции, которая возвращает промис.", "added": "2026-10-19"}, {"id": "err-js-09", "deck": "Promise и async/await", "kind": "error", "q": "Что будет, если ошибку промиса никто не поймал?", "code": "async function run() {\n  const res = await Promise.reject(new Error('fail'));\n  console.log(res); // не выполнится\n}\n\nrun();", "a": "Unhandled promise rejection — необработанная ошибка промиса. В браузере в консоли будет `Uncaught (in promise)`, в Node.js процесс упадёт. Нужен `try/catch` внутри функции или `run().catch(...)`.", "hint": "Ошибку промиса обязательно должен кто-то поймать.", "added": "2026-10-19"}, {"id": "err-js-10", "deck": "Promise и async/await", "kind": "error", "q": "Что выведет код?", "code": "async function f() {\n  console.log('A');\n  await null;\n  console.log('B');\n}\n\nf();\nconsole.log('C');", "a": "`A, C, B`. Async-функция начинает выполняться сразу и синхронно — до первого `await`. На `await` она встаёт на паузу, код снаружи продолжает выполняться, а остаток функции выполнится позже как микрозадача.", "hint": "До первого `await` — обычный синхронный код.", "added": "2026-10-19"}, {"id": "err-js-11", "deck": "Promise и async/await", "kind": "error", "q": "Что возвращает async-функция?", "code": "async function getNumber() {\n  return 42;\n}\n\nconst x = getNumber();\nconsole.log(x);", "a": "Async-функция всегда возвращает промис. Выведет `Promise { 42 }`, а не 42. Значение достают через `await getNumber()` или `getNumber().then(...)`.", "hint": "`async` оборачивает результат в промис.", "added": "2026-10-19"}, {"id": "err-js-12", "deck": "Promise и async/await", "kind": "error", "q": "Что вернёт `getUser(1)`? Нужно: `id` больше 0 — успех, иначе ошибка.", "code": "function getUser(id) {\n  return new Promise((resolve, reject) => {\n    if (id < 0) {\n      resolve({ id, name: 'Alex' });\n    } else {\n      reject(new Error('Нет пользователя'));\n    }\n  });\n}", "a": "Ошибку «Нет пользователя»: `1 < 0` — это `false`, выполнение уходит в `else`. Условие перевёрнуто, нужно `id > 0`.", "hint": "Подставь значение в условие и посчитай true/false.", "added": "2026-10-19"}, {"id": "err-js-13", "deck": "JS: синтаксис и функции", "kind": "error", "q": "Где синтаксическая ошибка?", "code": "getUser(1)\n  .then((user) => console.log(user)\n  .catch((err) => console.log(err));", "a": "Не закрыта скобка `then`: первая `)` закрывает `console.log(`, а для `.then(` нужна вторая. Будет SyntaxError «`)` expected». Правильно: `.then((user) => console.log(user))`.", "hint": "Сколько скобок открыл — столько и закрой.", "added": "2026-10-19"}, {"id": "err-js-14", "deck": "Замыкание", "kind": "error", "q": "Почему этот debounce не работает?", "code": "function debounce(fn, ms) {\n  return function (...args) {\n    let timer;\n    clearTimeout(timer);\n    timer = setTimeout(() => fn(...args), ms);\n  };\n}", "a": "`timer` объявлен внутри возвращаемой функции: при каждом вызове это новая переменная со значением `undefined`, `clearTimeout` ничего не отменяет. Сработают все вызовы. `let timer` должен стоять снаружи, перед `return`, — тогда его замкнут все вызовы.", "hint": "Переменная внутри функции создаётся заново при каждом вызове.", "added": "2026-10-19"}, {"id": "err-js-15", "deck": "Event Loop", "kind": "error", "q": "Что выведет код?", "code": "setTimeout(() => {\n  console.log('A');\n  Promise.resolve().then(() => console.log('B'));\n}, 0);\n\nsetTimeout(() => console.log('C'), 0);", "a": "`A, B, C`. После каждой макрозадачи выполняются все микрозадачи. `B` — микрозадача, которую поставил первый таймер, поэтому она выполнится раньше второго таймера.", "hint": "Одна макрозадача → все микрозадачи → следующая макрозадача.", "added": "2026-10-19"}, {"id": "err-js-16", "deck": "Замыкание", "kind": "error", "q": "Как работает счётчик на замыкании?", "code": "function createCounter() {\n  let count = 0;\n  return function () {\n    count += 1;\n    return count;\n  };\n}\n\nconst next = createCounter();\nnext(); // 1\nnext(); // 2", "a": "`createCounter` возвращает функцию, которая замыкает переменную `count`. Каждый вызов `next` увеличивает один и тот же `count` и возвращает его. Снаружи до `count` не добраться.", "hint": "Внешняя функция возвращает функцию, а не число.", "added": "2026-10-19"}, {"id": "err-js-17", "deck": "Promise и async/await", "kind": "error", "q": "Что выведет код? Выполнится ли строка `console.log('C')`?", "code": "try {\n  console.log('A');\n  console.log('B');\n  throw new Error('oops');\n  console.log('C');\n} catch (err) {\n  console.log('D', err.message);\n}\nconsole.log('E');", "a": "`A`, `B`, `D oops`, `E`. `throw` сразу прерывает блок `try`: строки ниже него (`C`) не выполняются. Управление прыгает в `catch` — сразу, а не в конце программы. После `catch` код продолжается после всего блока `try/catch`. `await` с отклонённым промисом работает так же, как `throw` на этой строке.", "hint": "`throw` — это «стоп, беги в ближайший catch», а не «запиши ошибку и иди дальше».", "added": "2026-10-21"}, {"id": "err-js-18", "deck": "Promise и async/await", "kind": "error", "q": "Почему ошибка `Cannot read properties of undefined (reading 'then')`?", "code": "function checkStock(count) {\n  new Promise((resolve, reject) => {\n    setTimeout(() => resolve('есть'), 400);\n  });\n}\n\ncheckStock(1).then((r) => console.log(r));", "a": "Функция создаёт промис, но не возвращает его — нет `return`. Функция без `return` возвращает `undefined`, а у `undefined` нет метода `then`. Нужно `return new Promise(...)`. Ошибку читаем так: «что-то слева от `.then` — `undefined`».", "hint": "Что возвращает функция с фигурными скобками, если в ней нет `return`?", "added": "2026-10-21"}, {"id": "err-js-19", "deck": "Promise и async/await", "kind": "error", "q": "Почему здесь не сработает «иначе»?", "code": "try {\n  count > 0;\n  console.log('Товар в наличии');\n} catch (error) {\n  new Error('Нет в наличии');\n}", "a": "`try/catch` — не `if/else`. `count > 0;` просто вычисляет `true`/`false` и ничего не проверяет, поэтому «Товар в наличии» выводится всегда. `catch` сработает, только если кто-то бросит ошибку (`throw`). А `new Error(...)` лишь создаёт объект ошибки — без `throw` или `reject` он ничего не делает. Условие проверяют через `if`, а в промисе результат сообщают через `resolve` / `reject`.", "hint": "`if` проверяет условие, `try/catch` ловит брошенные ошибки.", "added": "2026-10-21"}, {"id": "err-js-20", "deck": "Promise и async/await", "kind": "error", "q": "Почему `await wait(2000)` не ждёт 2 секунды?", "code": "function wait(ms) {\n  return new Promise((resolve) => {\n    resolve();\n  }, ms);\n}", "a": "`resolve()` вызывается сразу, а `ms` передан вторым аргументом в `new Promise`, который его игнорирует. Промис выполняется мгновенно. Нужно вызвать `resolve()` внутри `setTimeout(() => resolve(), ms)`.", "hint": "Кто в JS умеет «подождать N миллисекунд»?", "added": "2026-10-21"}, {"id": "err-tool-01", "deck": "Инструменты", "kind": "error", "q": "Почему стили из SCSS-партиала не попали в сборку?", "code": "// blocks/_header.scss — партиал\n\n// main.scss\n@use 'blocks/header';", "a": "Файл с `_` в начале имени — партиал: сам по себе он не компилируется. Его нужно подключить через `@use` в главном файле, иначе стили в сборку не попадут.", "hint": "Что связывает партиал с главным файлом?", "added": "2026-10-19"}, {"id": "err-tool-02", "deck": "Инструменты", "kind": "error", "q": "Чем отличаются пути `/src/img.webp` и `./src/img.webp`?", "code": "<img src=\"/src/img/hero.webp\">   <!-- от корня проекта -->\n<img src=\"./img/hero.webp\">      <!-- от текущего файла -->", "a": "Путь со `/` в начале считается от корня проекта (сайта) и одинаково работает с любой страницы. Путь с `./` — относительно файла, в котором он написан, и ломается, если файл лежит в другой папке.", "hint": "`/` — от корня, `./` — от текущего файла.", "added": "2026-10-19"}, {"id": "err-tool-03", "deck": "Инструменты", "kind": "error", "q": "Как проверить, что файл игнорируется git?", "code": "git check-ignore -v src/fonts/TT-Tank-Bold.ttf\n# .gitignore:3:src/fonts/*   src/fonts/TT-Tank-Bold.ttf", "a": "Командой `git check-ignore -v путь`: она показывает, каким правилом из `.gitignore` файл игнорируется. Пустой вывод — файл не игнорируется. Проверять до первого коммита: шаблон может не совпасть из-за регистра или пробелов в имени.", "hint": "У git есть отдельная команда для проверки `.gitignore`.", "added": "2026-10-19"}, {"id": "err-tool-04", "deck": "Инструменты", "kind": "error", "q": "Почему иконка пропала после замены цвета?", "code": "<!-- было -->\n<path stroke=\"#FF9549\"/>\n\n<!-- заменили FF9549 на currentColor -->\n<path stroke=\"#currentColor\"/>", "a": "Заменили только hex-код, а `#` остался: получилось `#currentColor` — невалидный цвет, обводка не рисуется. Искать и заменять нужно вместе с решёткой: `#FF9549` → `currentColor`.", "hint": "Посмотри, что стоит перед словом currentColor.", "added": "2026-10-19"}, {"id": "term-arrays-01", "deck": "Термины собеса", "kind": "topic", "q": "Что делает `map`?", "code": "[1, 2, 3].map((n) => n * 2); // [2, 4, 6]", "a": "Возвращает новый массив той же длины, где каждый элемент — результат колбэка. Исходный массив не меняет.", "hint": "Длина та же?", "added": "2026-10-27"}, {"id": "term-arrays-02", "deck": "Термины собеса", "kind": "topic", "q": "Что делает `filter`?", "code": "[1, 2, 3, 4].filter((n) => n % 2 === 0); // [2, 4]", "a": "Возвращает новый массив только из элементов, для которых колбэк вернул `true`.", "hint": "Оставляет подходящие.", "added": "2026-10-27"}, {"id": "term-arrays-03", "deck": "Термины собеса", "kind": "topic", "q": "Что делает `reduce`? Что такое аккумулятор?", "code": "[1, 2, 3].reduce((acc, n) => acc + n, 0); // 6", "a": "Сводит массив к одному значению. Аккумулятор — промежуточный результат, который передаётся от шага к шагу. Второй аргумент — начальное значение; без него берётся первый элемент.", "hint": "acc + начальное значение.", "added": "2026-10-27"}, {"id": "term-arrays-04", "deck": "Термины собеса", "kind": "topic", "q": "Чем `find` отличается от `filter`?", "code": "const users = [{ id: 1 }, { id: 2 }];\nusers.find((u) => u.id === 2);   // { id: 2 }\nusers.filter((u) => u.id === 2); // [{ id: 2 }]", "a": "`find` возвращает первый подходящий элемент или `undefined`. `filter` возвращает массив всех подходящих, может быть пустым.", "hint": "Элемент или массив?", "added": "2026-10-27"}, {"id": "term-arrays-05", "deck": "Термины собеса", "kind": "topic", "q": "Что возвращает `forEach`?", "code": "const res = [1, 2].forEach((n) => n * 2);\nconsole.log(res); // undefined", "a": "Ничего — `undefined`. Он только перебирает элементы. Если нужен новый массив — `map`. Прервать `forEach` через `break` нельзя.", "hint": "Есть ли результат?", "added": "2026-10-27"}, {"id": "term-arrays-06", "deck": "Термины собеса", "kind": "topic", "q": "Какие методы массива мутируют исходный массив?", "a": "`push`, `pop`, `shift`, `unshift`, `splice`, `sort`, `reverse`, `fill`. Не мутируют `map`, `filter`, `slice`, `concat`. Есть неизменяемые версии: `toSorted`, `toReversed`, `toSpliced`.", "hint": "sort мутирует!", "added": "2026-10-27"}, {"id": "term-arrays-07", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «Методы массивов» полностью, как на собеседовании (4 шага).", "a": "1. Что: методы перебора массива: `forEach`, `map`, `filter`, `reduce`, `find`.\n2. Как работает: `map` — новый массив той же длины, `filter` — новый массив из подходящих, `reduce` — сводит к одному значению, `find` — первый подходящий элемент или `undefined`, `forEach` — ничего не возвращает.\n3. Пример: `users.filter(u => u.active).map(u => u.name)` — имена активных.\n4. Подвох: мутируют исходный массив `push`, `pop`, `splice`, `sort`, `reverse`; `map` и `filter` — нет.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-br_crp-01", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Какие этапы проходит браузер, чтобы показать страницу?", "a": "Разбор HTML в DOM, CSS в CSSOM, их объединение в render tree, layout (расчёт геометрии), paint (рисование) и composite (сборка слоёв).", "hint": "DOM, CSSOM, render tree, layout, paint, composite.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_crp-02", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что такое render tree?", "a": "Дерево только тех элементов, которые будут видны, с их стилями. Элементы с `display: none` и `head` в него не попадают.", "hint": "Только видимое.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_crp-03", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что блокирует первую отрисовку?", "a": "CSS блокирует отрисовку — браузер ждёт CSSOM. Обычный скрипт без `async`/`defer` блокирует разбор HTML.", "hint": "CSS и синхронные скрипты.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_crp-04", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Расскажи про тему «Critical rendering path» полностью, как на собеседовании (4 шага).", "a": "1. Что: путь от HTML до пикселей: DOM → CSSOM → render tree → layout → paint → composite.\n2. Как работает: HTML парсится в DOM, CSS — в CSSOM; вместе — дерево отрисовки (только видимое); layout считает размеры и позиции, paint рисует, composite собирает слои.\n3. Блокировки: CSS блокирует отрисовку, обычный `<script>` блокирует разбор HTML.\n4. Как ускорить: критичный CSS — пораньше, скрипты — `defer`, меньше и легче ресурсы в начале страницы.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_devtools-01", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Как отлаживать код без console.log?", "code": "function calc(items) {\n  debugger; // остановка здесь при открытых DevTools\n  return items.reduce((s, i) => s + i.price, 0);\n}", "a": "Поставить точку останова во вкладке Sources или написать `debugger`. Выполнение остановится, можно смотреть значения переменных и идти по шагам.", "hint": "Точка останова.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_devtools-02", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что смотреть во вкладке Network?", "a": "Ушёл ли запрос, его метод, статус, заголовки (CORS, кэш, авторизация), тело запроса и ответа, время. Так понятно, на чьей стороне ошибка.", "hint": "Статус, заголовки, тело.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_devtools-03", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что даёт React DevTools?", "a": "Дерево компонентов с их props, state и хуками, и Profiler — какие компоненты рендерились, почему и сколько времени.", "hint": "Компоненты и Profiler.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_devtools-04", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Расскажи про тему «Отладка и DevTools» полностью, как на собеседовании (4 шага).", "a": "1. Elements — DOM и стили: смотрю, какие правила применились и что перебило; меняю на лету.\n2. Console — ошибки и `console.log`; Sources — точки останова (breakpoints) и пошаговое выполнение.\n3. Network — запросы: статус, заголовки, тело, время; проверка CORS и кэша.\n4. Performance и Lighthouse — долгие задачи, рендеры, Core Web Vitals; React DevTools — дерево компонентов, props, state и Profiler.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_observer-01", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что делает IntersectionObserver?", "code": "const io = new IntersectionObserver(([entry]) => {\n  if (entry.isIntersecting) loadMore();\n}, { rootMargin: '200px' });\nio.observe(sentinel);", "a": "Асинхронно сообщает, когда элемент пересёк видимую область. Используют для бесконечной ленты, ленивой загрузки и анимаций при появлении.", "hint": "Элемент стал видимым.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_observer-02", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Чем observer лучше обработчика scroll?", "a": "Обработчик `scroll` вызывается десятки раз в секунду и обычно читает размеры, вызывая reflow. Observer работает асинхронно, браузер сам считает пересечения эффективно.", "hint": "Не нагружает главный поток.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_observer-03", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Расскажи про тему «IntersectionObserver» полностью, как на собеседовании (4 шага).", "a": "1. Что: API, которое сообщает, когда элемент появился или исчез в видимой области (или в другом контейнере).\n2. Как работает: создаём наблюдатель с колбэком и `threshold`, вызываем `observe(el)`; браузер сам вызывает колбэк — без слушателя `scroll`.\n3. Когда нужен: ленивая загрузка картинок, бесконечная лента (догрузка при появлении «маячка» внизу), анимации при появлении, аналитика показов.\n4. Почему лучше scroll: `scroll` срабатывает очень часто и требует расчётов размеров (reflow); observer — асинхронный и экономный.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_reflow-01", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что такое reflow?", "a": "Пересчёт размеров и положения элементов. Вызывается изменением ширины, высоты, отступов, шрифта, добавлением элементов. Дорогой, может затронуть много элементов.", "hint": "Пересчёт геометрии.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_reflow-02", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что такое repaint?", "a": "Перерисовка пикселей без изменения геометрии: смена цвета, фона, тени. Дешевле reflow.", "hint": "Только перерисовка.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_reflow-03", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Какие свойства дешевле всего анимировать?", "code": "/* плохо */  .box { transition: left 0.3s; }\n/* хорошо */ .box { transition: transform 0.3s; }", "a": "`transform` и `opacity`: они меняются на этапе композиции, без layout и paint, часто на видеокарте. Анимация `top`, `width`, `margin` вызывает reflow на каждом кадре.", "hint": "transform и opacity.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_reflow-04", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что такое layout thrashing?", "code": "for (const el of items) {\n  el.style.width = box.offsetWidth + 'px'; // чтение + запись в цикле\n}", "a": "Чередование изменения стилей и чтения размеров в цикле: каждое чтение заставляет браузер пересчитать layout сразу. Решение — сначала все чтения, потом все записи.", "hint": "Чтение-запись по очереди.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_reflow-05", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Расскажи про тему «Reflow и repaint» полностью, как на собеседовании (4 шага).", "a": "1. Reflow (layout): пересчёт геометрии — размеров и позиций; дорогой, может затронуть всю страницу.\n2. Repaint: перерисовка без изменения геометрии — цвет, фон, тень.\n3. Composite: самые дешёвые изменения — `transform` и `opacity`: обрабатываются на этапе композиции, часто на GPU, без layout и paint.\n4. Подвох: чтение `offsetHeight` сразу после изменения стилей заставляет браузер сделать layout немедленно (layout thrashing); анимировать лучше `transform`, а не `top`/`width`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_security-01", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что такое XSS и как React от него защищает?", "code": "<p>{comment}<\/p>                              // безопасно: экранируется\n<div dangerouslySetInnerHTML={{ __html: comment }} /> // опасно", "a": "Внедрение вредоносного скрипта через данные пользователя. React экранирует значения в JSX, поэтому текст не станет кодом. Опасность — `dangerouslySetInnerHTML` без очистки (DOMPurify) и `href` с `javascript:`.", "hint": "Чужой скрипт на странице.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_security-02", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что такое CSRF?", "a": "Атака, когда чужой сайт отправляет запрос на твой сервер от имени пользователя, а браузер сам прикладывает его cookie. Защищают флаг `SameSite` у cookie и CSRF-токены.", "hint": "Запрос с чужого сайта с твоими cookie.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_security-03", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что такое clickjacking?", "a": "Сайт встраивают в невидимый iframe поверх приманки, и пользователь кликает по кнопкам твоего сайта, не видя их. Защита — заголовки `X-Frame-Options: DENY` или CSP `frame-ancestors`.", "hint": "Невидимый iframe.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_security-04", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что такое CSP?", "a": "Content Security Policy — заголовок, который разрешает загружать скрипты, стили и картинки только с указанных источников. Даже если XSS случился, чужой скрипт не загрузится.", "hint": "Белый список источников.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_security-05", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Расскажи про тему «Безопасность: XSS, CSRF, clickjacking» полностью, как на собеседовании (4 шага).", "a": "1. XSS — внедрение чужого скрипта на страницу через пользовательские данные. Защита: React экранирует вывод по умолчанию; опасно `dangerouslySetInnerHTML` без очистки (DOMPurify); CSP.\n2. CSRF — сайт злоумышленника заставляет браузер отправить запрос с твоими cookie. Защита: cookie `SameSite`, CSRF-токены.\n3. Clickjacking — твой сайт встраивают невидимым iframe и подсовывают клик. Защита: заголовки `X-Frame-Options` / CSP `frame-ancestors`.\n4. Общее: токены в httpOnly-cookie, HTTPS, не доверять данным с клиента — проверять на сервере.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_speed-01", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Как ускорить загрузку картинок?", "code": "<img src=\"photo.webp\" srcset=\"photo-480.webp 480w, photo-960.webp 960w\" sizes=\"(max-width: 600px) 480px, 960px\" loading=\"lazy\" width=\"960\" height=\"640\" alt=\"…\">", "a": "Современный формат (WebP, AVIF), подходящий размер через `srcset`, `loading=\"lazy\"` для картинок ниже первого экрана и заданные размеры против прыжков вёрстки.", "hint": "Формат, размер, lazy.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_speed-02", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что делает `preload`?", "code": "<link rel=\"preload\" href=\"/fonts/onest.woff2\" as=\"font\" crossorigin>", "a": "Говорит браузеру скачать важный ресурс заранее, не дожидаясь, пока он найдёт его в CSS или JS. Используют для шрифтов и главной картинки.", "hint": "Скачать заранее.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_speed-03", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Как уменьшить JS-бандл?", "a": "Разделить по страницам через lazy и динамический `import()`, убрать неиспользуемые зависимости, импортировать только нужные функции (tree shaking), проверить состав бандла анализатором.", "hint": "Splitting, tree shaking.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_speed-04", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Расскажи про тему «Как ускорить загрузку» полностью, как на собеседовании (4 шага).", "a": "1. Меньше JS: code splitting, lazy-загрузка страниц, удалить лишние зависимости, tree shaking.\n2. Картинки: современные форматы (WebP/AVIF), правильные размеры через `srcset`, `loading=\"lazy\"` ниже первого экрана.\n3. Сеть: кэширование с хэшем в именах, сжатие (gzip/brotli), CDN, `preload` для критичных ресурсов.\n4. Рендер: скрипты с `defer`, критичный CSS пораньше, шрифты с `font-display: swap`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_vitals-01", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что такое LCP?", "a": "Largest Contentful Paint — время отрисовки самого большого элемента первого экрана (картинка, заголовок). Хорошо — до 2,5 секунды.", "hint": "Главный контент, 2,5 с.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_vitals-02", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что такое INP?", "a": "Interaction to Next Paint — сколько проходит от действия пользователя (клик, ввод) до следующей отрисовки. Хорошо — до 200 мс. Портят долгие задачи в главном потоке.", "hint": "Реакция на действия, 200 мс.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_vitals-03", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что такое CLS и как его уменьшить?", "a": "Cumulative Layout Shift — насколько сдвигается вёрстка при загрузке. Уменьшают, задавая размеры (`width`/`height` или `aspect-ratio`) картинкам, видео и блокам под рекламу, и не вставляя контент над уже показанным.", "hint": "Прыжки вёрстки, 0,1.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_vitals-04", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Расскажи про тему «Core Web Vitals» полностью, как на собеседовании (4 шага).", "a": "1. Что: три метрики Google о реальном опыте пользователя.\n2. LCP (Largest Contentful Paint) — когда отрисован самый большой элемент первого экрана; хорошо — до 2,5 с.\n3. INP (Interaction to Next Paint) — задержка реакции на клики и ввод; хорошо — до 200 мс. CLS (Cumulative Layout Shift) — прыжки вёрстки; хорошо — до 0,1.\n4. Как улучшать: LCP — оптимизировать главную картинку и сервер; INP — разбивать долгие задачи; CLS — задавать размеры картинкам и местам под рекламу.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_vite-01", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Зачем нужен сборщик?", "a": "Перевести TS и JSX в JS, объединить модули, минифицировать, выкинуть неиспользуемый код, разделить на чанки и добавить хэши в имена для кэширования.", "hint": "Транспиляция, бандл, оптимизация.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_vite-02", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Почему Vite быстро стартует в разработке?", "a": "Он не собирает весь проект заранее: отдаёт файлы браузеру как нативные ES-модули и преобразует их по запросу. Зависимости предварительно собирает один раз.", "hint": "Нативные ES-модули.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_vite-03", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что такое HMR?", "a": "Hot Module Replacement — при сохранении файла заменяется только изменённый модуль без перезагрузки страницы, состояние компонентов сохраняется.", "hint": "Замена модуля на лету.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_vite-04", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Расскажи про тему «Сборщик (Vite)» полностью, как на собеседовании (4 шага).", "a": "1. Что: сборщик превращает исходники (JSX, TS, модули, CSS, картинки) в файлы, которые быстро грузит браузер.\n2. Что делает: транспиляция (TS/JSX → JS), бандлинг, минификация, tree shaking, code splitting, хэши в именах для кэша.\n3. Vite в разработке: отдаёт файлы как нативные ES-модули без сборки всего проекта — мгновенный старт, HMR (обновление модуля без перезагрузки).\n4. Vite в продакшене: собирает оптимизированный бандл (Rollup / Rolldown).", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_workers-01", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что такое Web Worker?", "code": "const worker = new Worker(new URL('./parse.worker.js', import.meta.url));\nworker.postMessage(file);\nworker.onmessage = (e) => setRows(e.data);", "a": "Скрипт в отдельном потоке. Выполняет тяжёлую работу, не блокируя главный поток и интерфейс. С главным потоком обменивается сообщениями.", "hint": "Отдельный поток.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_workers-02", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Что нельзя делать в Web Worker?", "a": "Нельзя работать с DOM и `window`. Данные передаются сообщениями (копируются или передаются владение), а не через общие переменные.", "hint": "Нет DOM.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-br_workers-03", "deck": "Термины собеса · Браузер", "kind": "topic", "q": "Расскажи про тему «Web Workers» полностью, как на собеседовании (4 шага).", "a": "1. Что: Web Worker — JS, который работает в отдельном потоке, не блокируя интерфейс.\n2. Как работает: общение с главным потоком только сообщениями — `postMessage` и `onmessage`; доступа к DOM нет.\n3. Когда нужен: тяжёлые вычисления — обработка больших данных, парсинг файлов, фильтрация огромных списков, работа с изображениями.\n4. Пример: разбор CSV на 100 000 строк в воркере — страница не зависает и кнопки отвечают.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-14"}, {"id": "term-callapplybind-01", "deck": "Термины собеса", "kind": "topic", "q": "Что делает `call`?", "code": "function greet(greeting) {\n  console.log(greeting, this.name);\n}\ngreet.call({ name: 'Саша' }, 'Привет');", "a": "Вызывает функцию сразу с указанным `this`. Первый аргумент — `this`, остальные передаются через запятую.", "hint": "Сразу или потом? Как аргументы?", "added": "2026-10-27"}, {"id": "term-callapplybind-02", "deck": "Термины собеса", "kind": "topic", "q": "Чем `apply` отличается от `call`?", "code": "greet.apply({ name: 'Саша' }, ['Привет']);", "a": "Тоже вызывает функцию сразу с указанным `this`, но аргументы передаются одним массивом.", "hint": "Apply — Array.", "added": "2026-10-27"}, {"id": "term-callapplybind-03", "deck": "Термины собеса", "kind": "topic", "q": "Что делает `bind`?", "code": "const bound = greet.bind({ name: 'Саша' });\nbound('Привет');", "a": "Не вызывает функцию, а возвращает новую функцию с закреплённым `this` (и, если передать, первыми аргументами). Используют, чтобы не терять контекст в колбэках.", "hint": "Вызывает или возвращает?", "added": "2026-10-27"}, {"id": "term-callapplybind-04", "deck": "Термины собеса", "kind": "topic", "q": "Что выведет код?", "code": "function show() { console.log(this.name); }\nconst bound = show.bind({ name: 'A' });\nbound.call({ name: 'B' });", "a": "`A`. `this`, закреплённый через `bind`, переопределить нельзя — ни `call`, ни `apply`, ни повторным `bind`.", "hint": "Можно ли переписать закреплённый this?", "added": "2026-10-27"}, {"id": "term-callapplybind-05", "deck": "Термины собеса", "kind": "topic", "q": "Что такое частичное применение через `bind`?", "code": "function mul(a, b) { return a * b; }\nconst double = mul.bind(null, 2);\ndouble(5); // 10", "a": "`bind` может закрепить не только `this`, но и первые аргументы. Получается новая функция с частью аргументов «заранее».", "hint": "Аргументы после this в bind.", "added": "2026-10-27"}, {"id": "term-callapplybind-06", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «call, apply, bind» полностью, как на собеседовании (4 шага).", "a": "1. Что: `call`, `apply` и `bind` — методы функций, которые позволяют явно задать `this`.\n2. Как работает: `call` вызывает функцию сразу, аргументы через запятую; `apply` — сразу, аргументы массивом; `bind` не вызывает, а возвращает новую функцию с закреплённым `this`.\n3. Пример: `setTimeout(user.greet.bind(user), 0)` — чиним потерю контекста.\n4. Подвох: `this` у функции после `bind` нельзя переопределить ни `call`, ни повторным `bind`; у стрелочных функций `this` они не меняют.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-classes-01", "deck": "Термины собеса", "kind": "topic", "q": "Что делает `constructor` в классе?", "code": "class User {\n  constructor(name) {\n    this.name = name;\n  }\n}\nconst u = new User('Саша');", "a": "Специальный метод, который вызывается при создании объекта через `new`. В нём задают начальные поля через `this`.", "hint": "Когда вызывается?", "added": "2026-10-27"}, {"id": "term-classes-02", "deck": "Термины собеса", "kind": "topic", "q": "Что делают `extends` и `super`?", "code": "class Admin extends User {\n  constructor(name) {\n    super(name);\n    this.role = 'admin';\n  }\n}", "a": "`extends` наследует класс: методы родителя доступны через цепочку прототипов. `super(...)` вызывает конструктор родителя, `super.method()` — метод родителя. В наследнике `super()` вызывают до обращения к `this`, иначе ошибка.", "hint": "Что будет, если обратиться к this до super()?", "added": "2026-10-27"}, {"id": "term-classes-03", "deck": "Термины собеса", "kind": "topic", "q": "Что такое статический метод?", "code": "class MathUtil {\n  static sum(a, b) { return a + b; }\n}\nMathUtil.sum(1, 2); // 3", "a": "Метод самого класса, а не его экземпляров. Вызывается через имя класса, у объекта его нет.", "hint": "Где вызывается — у класса или у объекта?", "added": "2026-10-27"}, {"id": "term-classes-04", "deck": "Термины собеса", "kind": "topic", "q": "Как сделать приватное поле в классе?", "code": "class Wallet {\n  #balance = 0;\n  add(n) { this.#balance += n; }\n}\nnew Wallet().#balance; // SyntaxError", "a": "Через `#` перед именем. Такое поле доступно только внутри класса, снаружи — ошибка.", "hint": "Один символ перед именем.", "added": "2026-10-27"}, {"id": "term-classes-05", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «Классы» полностью, как на собеседовании (4 шага).", "a": "1. Что: класс — шаблон для создания объектов, синтаксический сахар над конструкторами и прототипами.\n2. Как работает: `constructor` задаёт поля, методы попадают в прототип, `extends` наследует, `super` вызывает родителя.\n3. Пример: `class Admin extends User { constructor(name) { super(name); } }`.\n4. Подвох: в наследнике `super()` надо вызвать до `this`; есть статические методы и приватные поля через `#`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-classes_r-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Почему сейчас пишут функциональные компоненты?", "a": "Меньше кода, нет `this` и привязки методов, логику с состоянием легко переиспользовать через кастомные хуки. Новые возможности React (хуки, компилятор, Server Components) — для функций.", "hint": "Хуки, без this.", "added": "2026-10-27"}, {"id": "term-classes_r-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Какие хуки заменяют методы жизненного цикла?", "a": "`componentDidMount` — `useEffect(fn, [])`; `componentDidUpdate` — `useEffect` с зависимостями; `componentWillUnmount` — функция очистки эффекта; `shouldComponentUpdate` — `React.memo`.", "hint": "Всё через useEffect.", "added": "2026-10-27"}, {"id": "term-classes_r-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Где классовые компоненты нужны до сих пор?", "a": "Для Error Boundary — у функций нет аналога `componentDidCatch`. И в старом коде, который нужно поддерживать.", "hint": "Error Boundary.", "added": "2026-10-27"}, {"id": "term-classes_r-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «Классовые и функциональные компоненты» полностью, как на собеседовании (4 шага).", "a": "1. Что: раньше состояние и жизненный цикл были только у классовых компонентов; с хуками (React 16.8) всё это есть у функций.\n2. Почему функции: меньше кода, нет путаницы с `this`, логику легко выносить в кастомные хуки, новые возможности React делаются для функций.\n3. Соответствие: `componentDidMount` → `useEffect(fn, [])`, `componentWillUnmount` → очистка эффекта, `this.state` → `useState`.\n4. Где классы остались: Error Boundary и старый код, который нужно уметь читать.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-closure-01", "deck": "Термины собеса", "kind": "topic", "q": "Что такое замыкание? Дай определение.", "code": "function outer() {\n  const name = 'Alex';\n  return function inner() {\n    console.log(name);\n  };\n}\nconst fn = outer();\nfn(); // 'Alex'", "a": "Замыкание — это функция вместе с её лексическим окружением, то есть с переменными из того места, где она была создана. Она может читать и менять их, даже когда внешняя функция уже завершилась.", "hint": "Обязательные слова: «лексическое окружение», «создана» (не вызвана).", "added": "2026-10-27"}, {"id": "term-closure-02", "deck": "Термины собеса", "kind": "topic", "q": "Что такое лексическое окружение (Lexical Environment)?", "a": "Это внутренний объект, где хранятся переменные функции и ссылка на внешнее окружение — то место, где функция объявлена в коде. Создаётся при каждом вызове функции и для каждого блока.", "hint": "Две части: переменные + ссылка наружу.", "added": "2026-10-27"}, {"id": "term-closure-03", "deck": "Термины собеса", "kind": "topic", "q": "Что такое область видимости (scope)? Какие бывают?", "code": "const a = 1;          // глобальная\nfunction f() {\n  const b = 2;        // функциональная\n  if (true) {\n    const c = 3;      // блочная\n  }\n}", "a": "Область видимости — часть кода, где переменная доступна. Бывает глобальная, функциональная и блочная (`let`/`const` внутри `{ }`). `var` блок не видит — только функцию.", "hint": "Три вида; `var` игнорирует блок.", "added": "2026-10-27"}, {"id": "term-closure-04", "deck": "Термины собеса", "kind": "topic", "q": "Что такое цепочка областей видимости (scope chain)?", "code": "const x = 'global';\nfunction outer() {\n  function inner() {\n    console.log(x); // ищет: inner → outer → global\n  }\n  inner();\n}", "a": "Это порядок поиска переменной: сначала в своём окружении, потом во внешнем, и так до глобального. Не нашли нигде — `ReferenceError`. Поиск идёт только изнутри наружу.", "hint": "Поиск изнутри наружу; не нашли — ошибка.", "added": "2026-10-27"}, {"id": "term-closure-05", "deck": "Термины собеса", "kind": "topic", "q": "Почему переменная внешней функции не удаляется после её завершения?", "code": "function createCounter() {\n  let count = 0;\n  return () => ++count;\n}\nconst next = createCounter(); // createCounter завершилась", "a": "Сборщик мусора (garbage collector) удаляет только то, на что больше нет ссылок. Возвращённая функция хранит ссылку на окружение с `count`, поэтому оно живёт, пока жива сама функция.", "hint": "Кто удаляет память и по какому правилу?", "added": "2026-10-27"}, {"id": "term-closure-06", "deck": "Термины собеса", "kind": "topic", "q": "Как называется этот приём? Зачем он нужен?", "code": "function createAccount() {\n  let balance = 100;\n  return {\n    getBalance: () => balance,\n    withdraw: (n) => (balance -= n),\n  };\n}\nconst acc = createAccount();\nacc.balance; // undefined", "a": "Инкапсуляция — приватная переменная через замыкание. До `balance` нельзя добраться напрямую, только через методы, которые мы разрешили. Так данные защищены от случайной порчи.", "hint": "Скрываем данные — одно слово из ООП.", "added": "2026-10-27"}, {"id": "term-closure-07", "deck": "Термины собеса", "kind": "topic", "q": "Как называется этот приём?", "code": "function makeAdder(x) {\n  return (y) => x + y;\n}\nconst add5 = makeAdder(5);\nadd5(3); // 8", "a": "Фабрика функций: функция, которая создаёт и возвращает новые функции. Каждая созданная функция замыкает своё значение `x`.", "hint": "Функция, которая «производит» функции.", "added": "2026-10-27"}, {"id": "term-closure-08", "deck": "Термины собеса", "kind": "topic", "q": "Где замыкания используются на практике? Назови 3–4 примера.", "a": "Приватные данные (инкапсуляция, модульный паттерн), фабрики функций, `debounce`/`throttle` — хранят id таймера, обработчики событий и колбэки, которые помнят данные. В React на замыканиях работают хуки.", "hint": "Данные, фабрики, таймеры, обработчики.", "added": "2026-10-27"}, {"id": "term-closure-09", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про замыкание полностью, как на собеседовании (4 шага).", "a": "1. Что: замыкание — это функция вместе с её лексическим окружением, то есть с переменными из того места, где она была создана.\n2. Как работает: внешняя функция завершилась, а внутренняя хранит ссылку на её переменные, поэтому сборщик мусора их не удаляет.\n3. Пример: `createCounter` возвращает функцию, которая делает `count++`. Снаружи `count` не достать, а функция его помнит.\n4. Зачем / подвох: приватные данные, фабрики функций, `debounce`. Подвох — `var` в цикле с `setTimeout` выводит `3 3 3`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-compiler-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое React Compiler?", "a": "Инструмент сборки, который автоматически добавляет мемоизацию в компоненты и хуки. Убирает большую часть ручных `useMemo`, `useCallback` и `memo`.", "hint": "Автоматическая мемоизация при сборке.", "added": "2026-10-27"}, {"id": "term-compiler-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Что нужно от кода, чтобы компилятор работал?", "a": "Соблюдать правила React: компоненты и хуки — чистые, props и state не мутируются, хуки вызываются по правилам. Код, который их нарушает, компилятор пропускает.", "hint": "Правила React.", "added": "2026-10-27"}, {"id": "term-compiler-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Нужны ли ещё `useMemo` и `useCallback` с компилятором?", "a": "В основном нет: компилятор делает это сам. Вручную — в редких случаях, например для стабильной зависимости эффекта. А в проектах без компилятора они по-прежнему нужны, поэтому знать их обязательно.", "hint": "Реже, но знать надо.", "added": "2026-10-27"}, {"id": "term-compiler-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «React Compiler» полностью, как на собеседовании (4 шага).", "a": "1. Что: React Compiler — инструмент сборки, который автоматически мемоизирует компоненты и значения.\n2. Как работает: анализирует код на этапе сборки и сам добавляет кэширование там, где это безопасно — как если бы мы расставили `memo`, `useMemo`, `useCallback`.\n3. Пример: обработчик в props больше не ломает мемоизацию ребёнка — компилятор сам сохранит ссылку.\n4. Подвох: работает, только если код следует правилам React (чистые компоненты, без мутаций); ручные `useMemo`/`useCallback` остаются как точечный инструмент, но писать их «на всякий случай» больше не нужно.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-context-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое prop drilling?", "a": "Передача props через много промежуточных компонентов, которым эти данные не нужны, только чтобы донести их до глубокого потомка.", "hint": "Проброс через уровни.", "added": "2026-10-27"}, {"id": "term-context-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Как работает Context?", "code": "const ThemeContext = createContext('light');\n<ThemeContext.Provider value=\"dark\"><App /><\/ThemeContext.Provider>\nconst theme = useContext(ThemeContext);", "a": "Создаём контекст, оборачиваем дерево в Provider со значением и читаем его в любом потомке через `useContext`. В React 19 можно писать `<ThemeContext value=...>` без `.Provider`.", "hint": "createContext → Provider → useContext.", "added": "2026-10-27"}, {"id": "term-context-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Что происходит при изменении value контекста?", "a": "Перерисовываются все компоненты, которые читают этот контекст. Если в `value` передавать новый объект на каждом рендере провайдера — они будут рендериться постоянно, поэтому `value` мемоизируют.", "hint": "Все потребители.", "added": "2026-10-27"}, {"id": "term-context-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Когда Context, а когда Redux?", "a": "Context — для редко меняющихся глобальных данных: тема, язык, пользователь. Redux — для большого часто меняющегося состояния: подписка на часть данных через селекторы, DevTools, middleware, асинхронная логика.", "hint": "Редко меняется — Context.", "added": "2026-10-27"}, {"id": "term-context-05", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «Context API» полностью, как на собеседовании (4 шага).", "a": "1. Что: Context — способ передать данные глубоко по дереву без пробрасывания props через каждый уровень (prop drilling).\n2. Как работает: `createContext` → Provider с `value` наверху → `useContext` в любом потомке.\n3. Пример: тема, текущий пользователь, язык интерфейса.\n4. Подвох: при смене `value` перерисовываются все потребители; для часто меняющегося большого состояния лучше Redux / Zustand с подпиской на часть данных.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-controlled-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое управляемый (controlled) компонент?", "code": "const [name, setName] = useState('');\n<input value={name} onChange={(e) => setName(e.target.value)} />", "a": "Поле, значение которого хранится в state React и задаётся через `value`. Каждое изменение идёт через `onChange` и сеттер. Удобно для валидации и масок.", "hint": "value + onChange.", "added": "2026-10-27"}, {"id": "term-controlled-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое неуправляемый (uncontrolled) компонент?", "code": "const ref = useRef(null);\n<input defaultValue=\"Саша\" ref={ref} />\n// ref.current.value", "a": "Поле хранит значение само, в DOM. Начальное значение — `defaultValue`, прочитать — через `ref` или `FormData` при отправке.", "hint": "defaultValue + ref.", "added": "2026-10-27"}, {"id": "term-controlled-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Что будет, если указать `value` без `onChange`?", "a": "Поле станет только для чтения: ввод не меняет state, а React всегда возвращает `value`. В консоли будет предупреждение. Нужен `onChange` или `readOnly`, или `defaultValue`.", "hint": "Нельзя печатать.", "added": "2026-10-27"}, {"id": "term-controlled-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «Controlled и uncontrolled» полностью, как на собеседовании (4 шага).", "a": "1. Что: управляемый компонент — значение поля хранится в state React; неуправляемый — значение хранит сам DOM.\n2. Как работает: управляемый — `value` + `onChange`, каждый ввод проходит через состояние; неуправляемый — `defaultValue` и чтение через `ref` или `FormData`.\n3. Пример: валидация на лету, маска телефона — управляемое поле; простая форма отправки — можно неуправляемое.\n4. Подвох: `value` без `onChange` — поле только для чтения и предупреждение в консоли.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-css_a11y-01", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Зачем атрибут `alt`?", "code": "<img src=\"chart.png\" alt=\"Продажи выросли на 20% за квартал\">\n<img src=\"decor.svg\" alt=\"\">", "a": "Текстовая замена картинки для скринридеров и когда картинка не загрузилась. Для декоративных изображений — пустой `alt=\"\"`, чтобы скринридер их пропустил.", "hint": "Текст вместо картинки.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_a11y-02", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Как связать label с полем?", "code": "<label for=\"email\">Email<\/label>\n<input id=\"email\" type=\"email\">", "a": "Атрибут `for` у `label` указывает на `id` поля, или поле кладётся внутрь `label`. Скринридер прочитает подпись, а клик по подписи поставит фокус в поле.", "hint": "for = id.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_a11y-03", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Когда нужны ARIA-атрибуты?", "code": "<button aria-expanded=\"false\" aria-controls=\"menu\">Меню<\/button>", "a": "Когда нативного HTML не хватает, чтобы описать роль или состояние: раскрыто ли меню, что за иконка-кнопка. Но сначала — подходящий семантический тег.", "hint": "Когда не хватает HTML.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_a11y-04", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Что проверить про клавиатуру?", "a": "Что всё доступно через `Tab`, порядок логичный, фокус виден (не убирать `outline` без замены), модальные окна держат фокус внутри и закрываются по `Esc`.", "hint": "Tab, видимый фокус.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_a11y-05", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Расскажи про тему «Доступность (a11y)» полностью, как на собеседовании (4 шага).", "a": "1. Что: доступность — чтобы сайтом могли пользоваться все: с клавиатуры, скринридером, при плохом зрении.\n2. На практике: семантические теги, `alt` у картинок, `label` у полей, видимый фокус, достаточный контраст, работа без мыши.\n3. ARIA: атрибуты `aria-label`, `aria-expanded`, `role` — когда семантики HTML не хватает; первое правило ARIA — сначала нативный тег.\n4. Проверка: пройти страницу Tab-ом, Lighthouse, расширение axe.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_adaptive-01", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Что такое mobile first?", "code": ".grid { display: grid; gap: 12px; }\n@media (min-width: 768px) {\n  .grid { grid-template-columns: 1fr 1fr; }\n}", "a": "Подход, где базовые стили пишутся для маленьких экранов, а для больших добавляются через `min-width`. Мобильные устройства грузят меньше лишнего CSS.", "hint": "Сначала телефон, потом min-width.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_adaptive-02", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Чем container queries отличаются от media queries?", "code": ".card-wrap { container-type: inline-size; }\n@container (min-width: 400px) {\n  .card { display: flex; }\n}", "a": "Медиазапрос смотрит на ширину окна, container query — на ширину конкретного контейнера. Компонент меняет вид в зависимости от места, куда его вставили.", "hint": "Окно / контейнер.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_adaptive-03", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Что делает `clamp()`?", "code": "h1 { font-size: clamp(1.5rem, 4vw, 3rem); }", "a": "Задаёт значение с минимумом и максимумом: шрифт растёт вместе с окном, но не меньше 1.5rem и не больше 3rem — без медиазапросов.", "hint": "Мин, желаемое, макс.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_adaptive-04", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Расскажи про тему «Адаптивная вёрстка» полностью, как на собеседовании (4 шага).", "a": "1. Mobile first: базовые стили — для телефона, а медиазапросы `min-width` добавляют раскладку для больших экранов.\n2. Медиазапросы реагируют на размер окна: `@media (min-width: 768px) { ... }`.\n3. Container queries реагируют на размер контейнера: `container-type: inline-size` + `@container (min-width: 400px)` — карточка подстраивается под место, куда её поставили.\n4. Ещё: гибкие сетки (`minmax`, `auto-fill`), `clamp()` для шрифтов, `srcset` для картинок, мета-тег `viewport`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_bem-01", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Что такое БЭМ?", "a": "Методология именования CSS-классов: блок — самостоятельный компонент, элемент — его часть, модификатор — вариант внешнего вида или состояния.", "hint": "Блок, элемент, модификатор.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_bem-02", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Как правильно назвать классы по БЭМ?", "code": "<article class=\"card card--featured\">\n  <h3 class=\"card__title\">…<\/h3>\n  <button class=\"card__button card__button--disabled\">…<\/button>\n<\/article>", "a": "Элемент — `блок__элемент`, модификатор — `блок--модификатор` или `блок__элемент--модификатор`. Модификатор пишется вместе с основным классом.", "hint": "__ элемент, -- модификатор.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_bem-03", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Можно ли писать `card__header__title`?", "a": "Нет. Элемент принадлежит блоку, а не другому элементу: правильно `card__title`, даже если в разметке он внутри `card__header`. Вложенность DOM в имени не повторяют.", "hint": "Только блок__элемент.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_bem-04", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Расскажи про тему «БЭМ» полностью, как на собеседовании (4 шага).", "a": "1. Что: БЭМ — методология именования классов: Блок, Элемент, Модификатор.\n2. Синтаксис: блок `card`, элемент `card__title` (два подчёркивания), модификатор `card--active` или `card__button--disabled` (два дефиса).\n3. Зачем: нет конфликтов имён, низкая одинаковая специфичность (один класс), по имени понятна структура.\n4. Правила: элемент принадлежит блоку, а не другому элементу (`card__title`, не `card__header__title`); модификатор не используется без основного класса.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_box-01", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Из чего состоит блочная модель?", "a": "Из четырёх слоёв: content (содержимое), padding (внутренний отступ), border (рамка), margin (внешний отступ).", "hint": "content, padding, border, margin.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_box-02", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Какая итоговая ширина у блока?", "code": ".box {\n  width: 200px;\n  padding: 20px;\n  border: 5px solid;\n}", "a": "При `content-box` (по умолчанию) — 250px: 200 + 20×2 + 5×2. При `border-box` — ровно 200px, padding и border входят в ширину.", "hint": "200 + 40 + 10.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_box-03", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Что такое схлопывание отступов?", "code": ".a { margin-bottom: 20px; }\n.b { margin-top: 30px; } /* между ними 30px, не 50 */", "a": "Вертикальные margin соседних блоков не складываются, а берётся больший. Во flex и grid контейнерах схлопывания нет.", "hint": "Берётся больший.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_box-04", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Расскажи про тему «Box model и box-sizing» полностью, как на собеседовании (4 шага).", "a": "1. Что: каждый элемент — прямоугольник из content → padding → border → margin.\n2. box-sizing: content-box (по умолчанию): `width` — это только контент; padding и border добавляются сверху.\n3. box-sizing: border-box: `width` включает content + padding + border — элемент не «распухает».\n4. Пример: `width: 200px; padding: 20px; border: 5px` → content-box — 250px, border-box — 200px. Поэтому почти везде ставят `*, *::before, *::after { box-sizing: border-box; }`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_center-01", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Как отцентрировать элемент через flex?", "code": ".parent {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}", "a": "На родителе: `display: flex`, `justify-content: center` — по горизонтали, `align-items: center` — по вертикали.", "hint": "Два свойства на родителе.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_center-02", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Самый короткий способ центрирования?", "code": ".parent { display: grid; place-items: center; }", "a": "Grid и `place-items: center` — центрирует содержимое по обеим осям одной строкой.", "hint": "Grid.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_center-03", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Как отцентрировать абсолютны
