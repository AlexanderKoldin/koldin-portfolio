й элемент без известных размеров?", "code": ".child {\n  position: absolute;\n  top: 50%;\n  left: 50%;\n  transform: translate(-50%, -50%);\n}", "a": "Сдвинуть левый верхний угол в центр родителя через `top` и `left` 50%, а потом вернуть элемент на половину его же размера через `transform: translate(-50%, -50%)`.", "hint": "50% и translate -50%.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_center-04", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Расскажи про тему «Центрирование» полностью, как на собеседовании (4 шага).", "a": "1. Flex: контейнеру `display: flex; justify-content: center; align-items: center;` — по обеим осям.\n2. Grid: `display: grid; place-items: center;` — самый короткий способ.\n3. Absolute: `position: absolute; inset: 0; margin: auto;` с заданными размерами, или `top: 50%; left: 50%; transform: translate(-50%, -50%)`.\n4. По горизонтали: блок с шириной — `margin: 0 auto`; текст — `text-align: center`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_flexgrid-01", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Когда Flexbox, а когда Grid?", "a": "Flexbox — для одного направления: ряд кнопок, меню, выравнивание элементов в строке. Grid — для двух измерений: каркас страницы, сетка карточек, где важны и строки, и колонки.", "hint": "Одна ось / две оси.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_flexgrid-02", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Чем `justify-content` отличается от `align-items`?", "a": "Во flex `justify-content` выравнивает по главной оси (по умолчанию горизонталь), `align-items` — по поперечной. Задаются на контейнере.", "hint": "Главная / поперечная ось.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_flexgrid-03", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Как сделать адаптивную сетку без медиазапросов?", "code": ".grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));\n  gap: 16px;\n}", "a": "Через `repeat(auto-fill, minmax(240px, 1fr))`: колонок столько, сколько влезает по 240px, остаток делится поровну.", "hint": "repeat + minmax.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_flexgrid-04", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Что значит `flex: 1`?", "a": "Сокращение `flex-grow: 1; flex-shrink: 1; flex-basis: 0`. Элементы делят свободное место поровну.", "hint": "Делить место поровну.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_flexgrid-05", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Расскажи про тему «Flexbox и Grid» полностью, как на собеседовании (4 шага).", "a": "1. Flexbox: раскладка в одном направлении — строка или колонка; размеры от содержимого.\n2. Grid: раскладка в двух измерениях — строки и колонки одновременно; сетка задаётся контейнером.\n3. Когда что: flex — меню, ряд кнопок, выравнивание внутри карточки; grid — каркас страницы, галерея карточек, формы с колонками.\n4. Пример: `grid-template-columns: repeat(auto-fill, minmax(240px, 1fr))` — адаптивная сетка карточек без медиазапросов.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_hide-01", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Что делает `display: none`?", "a": "Убирает элемент из раскладки: места не занимает, событий не получает, скринридер его не видит. Анимировать нельзя.", "hint": "Нет места, нет событий.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_hide-02", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Чем `visibility: hidden` отличается от `display: none`?", "a": "Элемент невидим и не кликается, но место в раскладке занимает. `display: none` убирает и место.", "hint": "Место остаётся.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_hide-03", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "В чём подвох `opacity: 0`?", "a": "Элемент невидим, но по-прежнему занимает место, получает клики и фокус и читается скринридером. Удобно для плавного появления, но не для скрытия.", "hint": "Кликабелен.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_hide-04", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Расскажи про тему «Скрытие элементов» полностью, как на собеседовании (4 шага).", "a": "1. display: none — элемента нет в раскладке и в дереве доступности: места не занимает, скринридер не видит, не кликается.\n2. visibility: hidden — место остаётся, элемент невидим и не кликается, скринридер не читает.\n3. opacity: 0 — место остаётся, элемент кликабелен и читается скринридером; можно анимировать.\n4. Для скринридеров: спрятать визуально, но оставить для чтения — класс `.visually-hidden` (sr-only).", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_modern-01", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Как работают CSS-переменные?", "code": ":root { --accent: #c1121f; }\n.button { background: var(--accent, red); }\n[data-theme=\"dark\"] { --accent: #ff4d5a; }", "a": "Объявляются через `--имя`, читаются через `var(--имя, запасное)`. Наследуются по дереву и могут меняться в рантайме — удобно для тем.", "hint": "--имя и var().", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_modern-02", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Чем CSS-переменные отличаются от переменных Sass?", "a": "Переменные Sass заменяются значениями при сборке и в браузере их нет. CSS-переменные живут в браузере: наследуются, переопределяются в медиазапросах и меняются из JS.", "hint": "Сборка / рантайм.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_modern-03", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Что такое нативная вложенность CSS?", "code": ".card {\n  padding: 16px;\n  &:hover { border-color: var(--accent); }\n  .title { font-weight: 600; }\n}", "a": "Возможность писать вложенные селекторы прямо в CSS, как в Sass: `&` — ссылка на родительский селектор. Поддерживается современными браузерами без сборки.", "hint": "Как в Sass, но нативно.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_modern-04", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Расскажи про тему «CSS-переменные и современный CSS» полностью, как на собеседовании (4 шага).", "a": "1. CSS-переменные: `--accent: #c1121f;` и `color: var(--accent)`; наследуются и меняются в рантайме — темы, состояния.\n2. Отличие от Sass-переменных: Sass подставляет значения при сборке, CSS-переменные живут в браузере и меняются через классы, медиазапросы и JS.\n3. Современное: нативная вложенность селекторов, `:has()`, container queries, `clamp()`, `@layer` для управления каскадом, `aspect-ratio`, `gap` во flex.\n4. Пример тем: переопределить переменные в `[data-theme=\"dark\"]` — весь интерфейс перекрасится без дублирования стилей.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_position-01", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "От чего позиционируется `absolute`?", "a": "От ближайшего предка, у которого `position` не `static`. Если такого нет — от начального блока (страницы). Элемент вынимается из потока.", "hint": "От позиционированного предка.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_position-02", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Чем `fixed` отличается от `sticky`?", "a": "`fixed` привязан к окну и всегда на месте при скролле. `sticky` идёт в потоке как обычный элемент, а при прокрутке до заданного `top` прилипает — но только в пределах своего родителя.", "hint": "Окно / прилипание в родителе.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_position-03", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Почему `z-index: 9999` не помогает?", "code": ".parent { position: relative; z-index: 1; }\n.child  { position: absolute; z-index: 9999; }\n.sibling { position: relative; z-index: 2; }", "a": "Родитель создал свой контекст наложения с `z-index: 1`. Ребёнок сравнивается только внутри него, а весь родитель целиком ниже соседа с `z-index: 2`.", "hint": "Свой контекст у родителя.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_position-04", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Расскажи про тему «position и z-index» полностью, как на собеседовании (4 шага).", "a": "1. static — обычный поток; relative — сдвиг от своего места, место в потоке сохраняется; absolute — вынут из потока, позиция от ближайшего позиционированного предка.\n2. fixed — от окна браузера, не скроллится; sticky — ведёт себя как relative, пока не доскроллит до порога, потом прилипает внутри родителя.\n3. z-index: работает у позиционированных элементов (и flex/grid-детей); сравнивается внутри одного контекста наложения.\n4. Подвох: `opacity < 1`, `transform`, `z-index` у позиционированного родителя создают новый контекст наложения — ребёнок с `z-index: 9999` не выйдет выше соседа родителя.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_pseudo-01", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Что такое псевдокласс?", "code": "a:hover { color: red; }\ninput:focus-visible { outline: 2px solid; }\nli:nth-child(odd) { background: #eee; }", "a": "Селектор состояния или положения существующего элемента: наведение, фокус, отмеченность, номер среди соседей. Пишется с одним двоеточием.", "hint": "Состояние.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_pseudo-02", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Что такое псевдоэлемент?", "code": ".required::after {\n  content: ' *';\n  color: red;\n}", "a": "Виртуальная часть элемента, которой нет в HTML: `::before`, `::after`, `::placeholder`. Пишется с двумя двоеточиями, для `before`/`after` обязателен `content`.", "hint": "Виртуальная часть.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_pseudo-03", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Что делает `:has()`?", "code": ".field:has(input:invalid) { border-color: red; }", "a": "Выбирает элемент, внутри которого есть подходящий потомок. Фактически «селектор родителя» — раньше такое делали только через JS.", "hint": "Родитель по потомку.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_pseudo-04", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Расскажи про тему «Псевдоклассы и псевдоэлементы» полностью, как на собеседовании (4 шага).", "a": "1. Псевдокласс (одно двоеточие) — состояние существующего элемента: `:hover`, `:focus-visible`, `:checked`, `:disabled`, `:nth-child(2n)`.\n2. Псевдоэлемент (два двоеточия) — виртуальная часть элемента, которой нет в DOM: `::before`, `::after`, `::placeholder`, `::marker`.\n3. Пример: `::before` с `content: ''` — декоративная иконка без лишнего тега.\n4. Современные: `:has()` — «родитель по ребёнку» (`.card:has(img)`), `:focus-visible` — фокус только с клавиатуры.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_react-01", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Что такое CSS Modules?", "code": "import styles from './Card.module.css';\n<div className={styles.card}>…<\/div>", "a": "CSS-файлы, классы которых при сборке получают уникальные имена. Стили изолированы внутри компонента, конфликтов имён нет.", "hint": "Уникальные имена классов.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_react-02", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Плюсы и минусы CSS-in-JS?", "a": "Плюсы: стили рядом с компонентом и зависят от props. Минусы: стили создаются в рантайме — дополнительная нагрузка, сложнее с серверными компонентами.", "hint": "Динамика, но рантайм.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_react-03", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Что такое Tailwind?", "code": "<button className=\"px-4 py-2 rounded bg-red-600 hover:bg-red-700\">OK<\/button>", "a": "CSS-фреймворк утилитарных классов: каждый класс — одно свойство. Верстаешь прямо в разметке, в итоговый CSS попадают только используемые классы.", "hint": "Утилитарные классы.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_react-04", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Расскажи про тему «Стили в React» полностью, как на собеседовании (4 шага).", "a": "1. Обычный CSS / БЭМ — просто, но глобальная область видимости имён.\n2. CSS Modules — файл `*.module.css`, имена классов уникализируются при сборке: `styles.card` → `Card_card__x7f2a` — без конфликтов.\n3. CSS-in-JS (styled-components, Emotion) — стили в JS, динамика через props, но есть накладные расходы в рантайме и сложности с Server Components.\n4. Tailwind — утилитарные классы прямо в разметке (`flex gap-4 p-2`), быстрая вёрстка и маленький итоговый CSS; минус — длинные списки классов.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_script-01", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Что делает обычный `<script>` в `head`?", "a": "Блокирует разбор HTML: браузер останавливается, скачивает и выполняет скрипт, и только потом продолжает. Страница появляется позже.", "hint": "Блокирует разбор.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_script-02", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Как работает `async`?", "a": "Скрипт грузится параллельно с разбором HTML и выполняется сразу после загрузки. Порядок выполнения нескольких async-скриптов не гарантирован.", "hint": "Как загрузился — выполнился.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_script-03", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Как работает `defer`?", "a": "Скрипт грузится параллельно, а выполняется после разбора всего HTML, в порядке подключения, до события `DOMContentLoaded`. Подходит для своих скриптов, которые работают с DOM.", "hint": "После разбора, по порядку.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_script-04", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Как ведёт себя `<script type=\"module\">`?", "a": "Как `defer` по умолчанию: грузится параллельно, выполняется после разбора HTML. Плюс поддерживает `import` и работает в строгом режиме.", "hint": "Как defer.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_script-05", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Расскажи про тему «script, async, defer» полностью, как на собеседовании (4 шага).", "a": "1. Обычный `<script>`: останавливает разбор HTML, пока скрипт не загрузится и не выполнится.\n2. async: грузится параллельно, выполняется сразу как загрузится — может прервать разбор; порядок не гарантирован.\n3. defer: грузится параллельно, выполняется после разбора всего HTML, по порядку, до `DOMContentLoaded`.\n4. Практика: свои скрипты — `defer` (или `type=\"module\"`, он отложен по умолчанию); независимые счётчики и аналитика — `async`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_semantic-01", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Что такое семантическая вёрстка?", "a": "Использование тегов по смыслу: `header`, `nav`, `main`, `article`, `footer`, `button`. Браузер, поисковики и скринридеры понимают структуру страницы.", "hint": "Тег по смыслу.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_semantic-02", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Почему кнопка — `button`, а не `div`?", "a": "`button` фокусируется с клавиатуры, нажимается `Enter` и `Space`, сообщает скринридеру роль «кнопка». У `div` всего этого нет — пришлось бы добавлять вручную.", "hint": "Клавиатура и роль из коробки.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_semantic-03", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Чем `article` отличается от `section`?", "a": "`article` — самостоятельный блок, который имеет смысл отдельно: пост, карточка товара. `section` — тематический раздел страницы, обычно с заголовком.", "hint": "Самостоятельный / раздел.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_semantic-04", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Расскажи про тему «Семантические теги» полностью, как на собеседовании (4 шага).", "a": "1. Что: семантические теги описывают смысл блока: `header`, `nav`, `main`, `article`, `section`, `aside`, `footer`, `button`.\n2. Зачем: доступность (скринридер понимает структуру и навигацию), SEO, читаемость кода.\n3. Пример: кнопка — это `<button>`, а не `<div onClick>`: у неё есть фокус, `Enter`/`Space` и роль из коробки.\n4. Правило: один `main` на странице, заголовки `h1–h6` по порядку уровней, `div` и `span` — когда смысла нет.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_spec-01", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Как считается специфичность?", "code": "#header .nav a   → (1, 1, 1)\n.nav .link:hover → (0, 3, 0)\nul li a          → (0, 0, 3)", "a": "Тройкой: число id, число классов/атрибутов/псевдоклассов, число тегов/псевдоэлементов. Сравниваем слева направо — один id сильнее любого числа классов.", "hint": "(id, классы, теги).", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_spec-02", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Что побеждает при конфликте стилей?", "a": "Сначала `!important`, потом инлайн-стили, потом большая специфичность, а при равной — правило, которое идёт позже в коде.", "hint": "important → inline → специфичность → порядок.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_spec-03", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Чем `:where()` отличается от `:is()`?", "code": ":is(.card, #main) p    → (1, 0, 1)\n:where(.card, #main) p → (0, 0, 1)", "a": "`:is()` берёт специфичность самого сильного аргумента. `:where()` всегда даёт 0 — удобно для базовых стилей, которые легко переопределить.", "hint": "where = 0.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_spec-04", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Расскажи про тему «Специфичность и каскад» полностью, как на собеседовании (4 шага).", "a": "1. Что: специфичность решает, какое правило победит, если несколько селекторов задают одно свойство.\n2. Как считается: тройка (id, классы/атрибуты/псевдоклассы, теги/псевдоэлементы), сравнивается слева направо: `#nav .link` = (1,1,0) сильнее `.menu .link:hover` = (0,3,0).\n3. Порядок каскада: `!important` → инлайн-стили → специфичность → при равной — последнее правило в коде.\n4. Подвох: `:where()` даёт специфичность 0, `:is()` и `:not()` — по самому сильному аргументу; `!important` — крайняя мера.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-16"}, {"id": "term-css_units-01", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Чем `em` отличается от `rem`?", "code": "html { font-size: 16px; }\n.card { font-size: 2em; }   /* 32px */\n.card p { font-size: 2em; } /* 64px! */\n.card p { font-size: 2rem; } /* 32px */", "a": "`rem` считается от размера шрифта корня `html` — всегда одинаково. `em` — от размера шрифта текущего элемента или родителя, поэтому во вложенности накапливается.", "hint": "Корень / родитель.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_units-02", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Зачем `dvh`, если есть `vh`?", "a": "На мобильных `100vh` не учитывает появляющуюся адресную строку, и блок вылезает за экран. `100dvh` — динамическая высота видимой области.", "hint": "Мобильные панели.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_units-03", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "От чего считаются проценты?", "a": "Для `width` — от ширины родителя. Для `padding` и `margin` — тоже от ширины родителя, даже вертикальные. Для `height` — от высоты родителя, если она задана.", "hint": "От родителя.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-css_units-04", "deck": "Термины собеса · HTML/CSS", "kind": "topic", "q": "Расскажи про тему «Единицы измерения» полностью, как на собеседовании (4 шага).", "a": "1. px — абсолютные пиксели; % — от размера родителя (для `width` — от ширины родителя).\n2. em — от font-size текущего элемента (для `font-size` — от родителя), накапливается во вложенности; rem — от font-size корня `html` — предсказуемо.\n3. vw / vh — проценты от окна; dvh — высота окна с учётом мобильных панелей браузера.\n4. Практика: шрифты и отступы — `rem` (уважает настройки пользователя), локальные отступы компонента — `em`, высота на весь экран на мобильных — `100dvh`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-17"}, {"id": "term-customhook-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое кастомный хук?", "code": "function useToggle(initial = false) {\n  const [on, setOn] = useState(initial);\n  const toggle = () => setOn((v) => !v);\n  return [on, toggle];\n}", "a": "Функция, имя которой начинается с `use` и которая вызывает другие хуки. Выносит повторяющуюся логику с состоянием из компонентов.", "hint": "use + хуки внутри.", "added": "2026-10-27"}, {"id": "term-customhook-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Делят ли два компонента состояние, если вызывают один хук?", "a": "Нет. Каждый вызов хука создаёт своё независимое состояние. Хук переиспользует логику, а не данные. Общие данные — через подъём состояния, контекст или стор.", "hint": "Логика, не данные.", "added": "2026-10-27"}, {"id": "term-customhook-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Что обычно возвращает `useFetch`?", "code": "const { data, loading, error } = useFetch('/api/users');", "a": "Данные, флаг загрузки и ошибку. Внутри — `useState` для трёх значений и `useEffect`, который делает запрос и отменяет его в очистке.", "hint": "data, loading, error.", "added": "2026-10-27"}, {"id": "term-customhook-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «Custom hook» полностью, как на собеседовании (4 шага).", "a": "1. Что: кастомный хук — функция с именем на `use`, которая внутри вызывает другие хуки.\n2. Как работает: выносит повторяющуюся логику с состоянием из компонентов; у каждого вызова своё состояние — хук делится логикой, а не данными.\n3. Пример: `useFetch(url)` возвращает `{ data, loading, error }`; `useDebounce(value, 300)`; `useLocalStorage(key)`.\n4. Когда выносить: логика повторяется в нескольких компонентах или компонент разросся и её хочется назвать и протестировать отдельно.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-debounce-01", "deck": "Термины собеса", "kind": "topic", "q": "Что такое debounce?", "code": "function debounce(fn, ms) {\n  let timer;\n  return (...args) => {\n    clearTimeout(timer);\n    timer = setTimeout(() => fn(...args), ms);\n  };\n}", "a": "Обёртка, которая вызывает функцию только после паузы в N мс. Каждый новый вызов сбрасывает таймер, поэтому сработает только последний.", "hint": "Ждёт паузу.", "added": "2026-10-27"}, {"id": "term-debounce-02", "deck": "Термины собеса", "kind": "topic", "q": "Что такое throttle?", "a": "Обёртка, которая вызывает функцию не чаще одного раза в N мс. Остальные вызовы в этот промежуток пропускаются.", "hint": "Не чаще раза в N мс.", "added": "2026-10-27"}, {"id": "term-debounce-03", "deck": "Термины собеса", "kind": "topic", "q": "Когда debounce, а когда throttle?", "a": "Debounce — когда важен итог после остановки: поиск при вводе, автосохранение, ресайз с перерасчётом. Throttle — когда нужны регулярные обновления во время действия: скролл, движение мыши.", "hint": "Итог после паузы или регулярно?", "added": "2026-10-27"}, {"id": "term-debounce-04", "deck": "Термины собеса", "kind": "topic", "q": "Почему `let timer` объявлен снаружи возвращаемой функции?", "a": "Чтобы все вызовы видели одну переменную через замыкание. Если объявить внутри, при каждом вызове будет новая `timer`, и `clearTimeout` ничего не отменит.", "hint": "Одна переменная на все вызовы.", "added": "2026-10-27"}, {"id": "term-debounce-05", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «Debounce и Throttle» полностью, как на собеседовании (4 шага).", "a": "1. Что: debounce и throttle — способы ограничить частоту вызова функции.\n2. Как работает: debounce вызывает функцию после паузы — каждый новый вызов сбрасывает таймер; throttle вызывает не чаще раза в N мс.\n3. Пример: поиск при вводе — debounce; `scroll` и `resize` — throttle.\n4. Подвох: id таймера хранится в замыкании: `let timer` объявляют снаружи возвращаемой функции.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-destructuring-01", "deck": "Термины собеса", "kind": "topic", "q": "Что делает этот код?", "code": "const { name, age = 18, city: town } = user;", "a": "Достаёт свойства объекта в переменные: `name` как есть, `age` со значением по умолчанию 18, `city` под новым именем `town`.", "hint": "По умолчанию и переименование.", "added": "2026-10-27"}, {"id": "term-destructuring-02", "deck": "Термины собеса", "kind": "topic", "q": "Как поменять местами две переменные?", "code": "let a = 1, b = 2;\n[a, b] = [b, a];", "a": "Через деструктуризацию массива: элементы достаются по позиции. Так можно обменять значения без временной переменной.", "hint": "По позиции.", "added": "2026-10-27"}, {"id": "term-destructuring-03", "deck": "Термины собеса", "kind": "topic", "q": "Что такое spread?", "code": "const all = [...arr1, ...arr2];\nconst copy = { ...user, age: 30 };", "a": "Оператор `...`, который раскладывает массив или объект на элементы. Используют для копирования и объединения.", "hint": "Раскладывает.", "added": "2026-10-27"}, {"id": "term-destructuring-04", "deck": "Термины собеса", "kind": "topic", "q": "Что такое rest?", "code": "function sum(...nums) {\n  return nums.reduce((a, n) => a + n, 0);\n}\nconst [first, ...others] = [1, 2, 3];", "a": "Тот же `...`, но собирает оставшиеся элементы в массив или объект: в параметрах функции или при деструктуризации. Стоит последним.", "hint": "Собирает.", "added": "2026-10-27"}, {"id": "term-destructuring-05", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «Деструктуризация, spread и rest» полностью, как на собеседовании (4 шага).", "a": "1. Что: деструктуризация — распаковка свойств объекта или элементов массива в переменные.\n2. Как работает: spread `...` раскладывает массив или объект на части, rest `...` собирает оставшееся в массив или объект.\n3. Пример: `const { name, ...rest } = user` — `name` отдельно, остальное в `rest`.\n4. Подвох: spread делает поверхностную копию — вложенные объекты остаются общими.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-dom-01", "deck": "Термины собеса", "kind": "topic", "q": "Что такое всплытие (bubbling)?", "code": "<div onclick=\"log('div')\">\n  <button onclick=\"log('button')\">OK<\/button>\n<\/div>\n<!-- клик: button, потом div -->", "a": "После срабатывания на элементе событие поднимается вверх по родителям и запускает их обработчики. По умолчанию обработчики работают на этой фазе.", "hint": "Снизу вверх.", "added": "2026-10-27"}, {"id": "term-dom-02", "deck": "Термины собеса", "kind": "topic", "q": "Что такое погружение (capturing)?", "code": "el.addEventListener('click', handler, { capture: true });", "a": "Первая фаза: событие идёт от `document` вниз к целевому элементу. Обработчик на этой фазе включают опцией `capture: true`.", "hint": "Сверху вниз.", "added": "2026-10-27"}, {"id": "term-dom-03", "deck": "Термины собеса", "kind": "topic", "q": "Что такое делегирование событий?", "code": "list.addEventListener('click', (e) => {\n  const item = e.target.closest('li');\n  if (item) console.log(item.dataset.id);\n});", "a": "Один обработчик на общем родителе вместо обработчиков на каждом дочернем элементе. Работает за счёт всплытия, элемент определяем через `event.target`. Подходит и для элементов, добавленных позже.", "hint": "Один обработчик на родителе.", "added": "2026-10-27"}, {"id": "term-dom-04", "deck": "Термины собеса", "kind": "topic", "q": "Чем `event.target` отличается от `event.currentTarget`?", "a": "`target` — элемент, где событие произошло, например кнопка. `currentTarget` — элемент, на котором висит обработчик, например список.", "hint": "Где кликнули и где слушают.", "added": "2026-10-27"}, {"id": "term-dom-05", "deck": "Термины собеса", "kind": "topic", "q": "Чем `preventDefault` отличается от `stopPropagation`?", "code": "form.addEventListener('submit', (e) => {\n  e.preventDefault(); // страница не перезагрузится\n});", "a": "`preventDefault` отменяет действие браузера по умолчанию: отправку формы, переход по ссылке. `stopPropagation` останавливает всплытие к родителям.", "hint": "Действие браузера или всплытие?", "added": "2026-10-27"}, {"id": "term-dom-06", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «DOM события» полностью, как на собеседовании (4 шага).", "a": "1. Что: событие в DOM проходит три фазы: погружение (capturing), цель, всплытие (bubbling).\n2. Как работает: по умолчанию обработчики срабатывают на всплытии — от элемента вверх к родителям.\n3. Пример: делегирование — один обработчик на списке вместо обработчика на каждом пункте, элемент узнаём через `event.target`.\n4. Подвох: `target` — где произошло событие, `currentTarget` — где висит обработчик; `preventDefault` отменяет действие браузера, `stopPropagation` — всплытие.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-equality-01", "deck": "Термины собеса", "kind": "topic", "q": "Чем `==` отличается от `===`?", "code": "'5' == 5;   // true\n'5' === 5;  // false\n0 == false; // true", "a": "`===` сравнивает без приведения типов: разные типы — сразу `false`. `==` сначала приводит к одному типу. В коде используют `===`.", "hint": "Есть ли приведение типов?", "added": "2026-10-27"}, {"id": "term-equality-02", "deck": "Термины собеса", "kind": "topic", "q": "Какие значения falsy?", "a": "Восемь: `false`, `0`, `-0`, `0n`, `''`, `null`, `undefined`, `NaN`. Все остальные — truthy, в том числе `'0'`, `[]` и `{}`.", "hint": "Восемь значений; [] и {} — truthy.", "added": "2026-10-27"}, {"id": "term-equality-03", "deck": "Термины собеса", "kind": "topic", "q": "Как проверить значение на `NaN`?", "code": "NaN === NaN;          // false\nNumber.isNaN(NaN);    // true", "a": "`NaN` не равен даже самому себе. Проверяют через `Number.isNaN(value)`.", "hint": "Равен ли NaN сам себе?", "added": "2026-10-27"}, {"id": "term-equality-04", "deck": "Термины собеса", "kind": "topic", "q": "Чем `null` отличается от `undefined`?", "code": "let a;\nconsole.log(a);         // undefined\nnull == undefined;      // true\nnull === undefined;     // false", "a": "`undefined` — значение не задано: переменная объявлена без значения, нет свойства. `null` — «пусто» специально, его присваивают сами. Нестрого равны друг другу, строго — нет.", "hint": "Кто ставит значение — движок или программист?", "added": "2026-10-27"}, {"id": "term-equality-05", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «== и ===, приведение типов» полностью, как на собеседовании (4 шага).", "a": "1. Что: `===` — строгое сравнение без приведения типов; `==` — нестрогое, с приведением типов.\n2. Как работает: `==` сначала приводит значения к одному типу, потом сравнивает.\n3. Пример: `'5' == 5` — `true`, `'5' === 5` — `false`; `null == undefined` — `true`.\n4. Подвох: в коде всегда `===`; в условиях работают truthy/falsy — falsy всего 8 значений.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-eventloop-01", "deck": "Термины собеса", "kind": "topic", "q": "Что такое Event Loop?", "a": "Event Loop — механизм, который позволяет однопоточному JS выполнять асинхронный код. Он ждёт, пока стек вызовов опустеет, и берёт задачи из очередей: сначала все микрозадачи, потом одну макрозадачу.", "hint": "Однопоточный JS + очереди + стек.", "added": "2026-10-27"}, {"id": "term-eventloop-02", "deck": "Термины собеса", "kind": "topic", "q": "Что такое стек вызовов (call stack)?", "code": "function a() { b(); }\nfunction b() { console.log('b'); }\na(); // стек: a → b", "a": "Структура, где выполняется код прямо сейчас. Вызвали функцию — она кладётся наверх, завершилась — снимается. Работает по принципу LIFO: последним пришёл — первым вышел.", "hint": "LIFO.", "added": "2026-10-27"}, {"id": "term-eventloop-03", "deck": "Термины собеса", "kind": "topic", "q": "Что значит «JavaScript однопоточный»?", "a": "У JS один поток выполнения: в каждый момент выполняется одна операция. Поэтому тяжёлый синхронный цикл блокирует интерфейс, а асинхронность устроена через очереди и Event Loop.", "hint": "Сколько операций одновременно?", "added": "2026-10-27"}, {"id": "term-eventloop-04", "deck": "Термины собеса", "kind": "topic", "q": "Что относится к микрозадачам?", "a": "Колбэки `then`, `catch`, `finally`, продолжение после `await`, `queueMicrotask`. Микрозадачи выполняются все подряд, как только стек пуст, — до любой макрозадачи.", "hint": "Всё, что связано с промисами.", "added": "2026-10-27"}, {"id": "term-eventloop-05", "deck": "Термины собеса", "kind": "topic", "q": "Что относится к макрозадачам?", "a": "`setTimeout`, `setInterval`, события DOM, загрузка скриптов, сообщения. Event Loop берёт их по одной, и после каждой выполняет все микрозадачи.", "hint": "Таймеры и события.", "added": "2026-10-27"}, {"id": "term-eventloop-06", "deck": "Термины собеса", "kind": "topic", "q": "Что выведет код?", "code": "console.log('A');\nsetTimeout(() => console.log('B'), 0);\nPromise.resolve().then(() => console.log('C'));\nconsole.log('D');", "a": "`A D C B`. Сначала синхронный код (`A`, `D`), потом микрозадача (`C`), потом макрозадача (`B`).", "hint": "Синхронный → микро → макро.", "added": "2026-10-27"}, {"id": "term-eventloop-07", "deck": "Термины собеса", "kind": "topic", "q": "Кто на самом деле ждёт таймер и ответ сервера?", "a": "Браузер, через Web API: таймеры, `fetch`, события. Это не часть самого JS. Когда операция готова, браузер кладёт колбэк в очередь, а Event Loop передаёт его в стек.", "hint": "Не сам JS.", "added": "2026-10-27"}, {"id": "term-eventloop-08", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «Event Loop» полностью, как на собеседовании (4 шага).", "a": "1. Что: Event Loop — механизм, который позволяет однопоточному JS выполнять асинхронный код: он берёт задачи из очередей и передаёт в стек вызовов.\n2. Как работает: сначала весь синхронный код; когда стек пуст — все микрозадачи, потом одна макрозадача, и снова все микрозадачи.\n3. Пример: `setTimeout(fn, 0)` и `Promise.resolve().then(fn)` — `then` выполнится раньше, потому что это микрозадача.\n4. Подвох: долгий синхронный код блокирует страницу — клики и таймеры ждут, пока освободится стек.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-events-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое SyntheticEvent?", "a": "Обёртка React над нативным событием браузера. API одинаковый во всех браузерах: `e.target`, `e.preventDefault()`, `e.stopPropagation()`. Нативное событие — в `e.nativeEvent`.", "hint": "Обёртка над нативным.", "added": "2026-10-27"}, {"id": "term-events-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Куда React на самом деле вешает обработчики?", "a": "На корневой контейнер приложения (с React 17). Событие всплывает до корня, и React сам вызывает нужные обработчики компонентов.", "hint": "Один слушатель на корне.", "added": "2026-10-27"}, {"id": "term-events-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Что не так в этом коде?", "code": "<button onClick={remove(id)}>Удалить<\/button>", "a": "`remove(id)` вызывается сразу при рендере, а в `onClick` попадает его результат. Нужно передать функцию: `onClick={() => remove(id)}`.", "hint": "Функция или её вызов?", "added": "2026-10-27"}, {"id": "term-events-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «События в React» полностью, как на собеседовании (4 шага).", "a": "1. Что: обработчики в React получают SyntheticEvent — обёртку над нативным событием с одинаковым API во всех браузерах.\n2. Как работает: React не вешает обработчик на каждый элемент, а использует делегирование — один слушатель на корневом контейнере приложения.\n3. Пример: `<button onClick={handleClick}>` — передаём функцию, а не вызов `handleClick()`.\n4. Подвох: `onClick={handleClick()}` вызовет функцию сразу при рендере; аргументы передают через стрелку: `onClick={() => remove(id)}`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-functions-01", "deck": "Термины собеса", "kind": "topic", "q": "Что такое Function Declaration?", "code": "sum(1, 2); // работает\nfunction sum(a, b) {\n  return a + b;\n}", "a": "Объявление функции отдельной инструкцией через `function имя()`. Поднимается целиком, поэтому её можно вызвать до объявления.", "hint": "Можно ли вызвать до объявления?", "added": "2026-10-27"}, {"id": "term-functions-02", "deck": "Термины собеса", "kind": "topic", "q": "Что такое Function Expression?", "code": "sum(1, 2); // ReferenceError\nconst sum = function (a, b) {\n  return a + b;\n};", "a": "Функция, созданная как значение и записанная в переменную. До строки создания её вызвать нельзя.", "hint": "Функция как значение.", "added": "2026-10-27"}, {"id": "term-functions-03", "deck": "Термины собеса", "kind": "topic", "q": "Чем стрелочная функция отличается от обычной?", "code": "const sum = (a, b) => a + b;", "a": "Короткая запись. Нет своего `this` и `arguments` — берёт их снаружи. Нельзя вызвать через `new`. С `{ }` нужен явный `return`.", "hint": "this, arguments, new, return.", "added": "2026-10-27"}, {"id": "term-functions-04", "deck": "Термины собеса", "kind": "topic", "q": "Что такое IIFE?", "code": "(function () {\n  const secret = 1;\n})();", "a": "Immediately Invoked Function Expression — функция, которая вызывается сразу после создания. Раньше так создавали отдельную область видимости для переменных.", "hint": "Сразу вызывается.", "added": "2026-10-27"}, {"id": "term-functions-05", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «Виды функций» полностью, как на собеседовании (4 шага).", "a": "1. Что: функцию можно создать тремя способами: Function Declaration, Function Expression и стрелочная функция.\n2. Как работает: Declaration поднимается целиком — её можно вызвать до объявления; Expression и стрелку — нельзя.\n3. Пример: `function f() {}` — declaration; `const f = function () {}` — expression; `const f = () => {}` — стрелка.\n4. Подвох: у стрелки нет своего `this` и `arguments`, её нельзя вызвать через `new`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-gc-01", "deck": "Термины собеса", "kind": "topic", "q": "Что такое сборщик мусора?", "a": "Механизм движка, который автоматически освобождает память от объектов, до которых больше нельзя добраться из кода.", "hint": "Автоматически.", "added": "2026-10-27"}, {"id": "term-gc-02", "deck": "Термины собеса", "kind": "topic", "q": "Какие объекты считаются «живыми»?", "a": "Достижимые: до них можно дойти по ссылкам от корней — глобального объекта, переменных в стеке вызовов. Недостижимые удаляются.", "hint": "От корней по ссылкам.", "added": "2026-10-27"}, {"id": "term-gc-03", "deck": "Термины собеса", "kind": "topic", "q": "Как работает алгоритм mark-and-sweep?", "a": "Сборщик проходит от корней по всем ссылкам и помечает достижимые объекты (mark), а непомеченные удаляет (sweep).", "hint": "Пометить и вымести.", "added": "2026-10-27"}, {"id": "term-gc-04", "deck": "Термины собеса", "kind": "topic", "q": "Что такое утечка памяти и откуда она берётся?", "code": "useEffect(() => {\n  const id = setInterval(tick, 1000);\n  return () => clearInterval(id); // без этого — утечка\n}, []);", "a": "Память, которая больше не нужна, но не освобождается, потому что на неё осталась ссылка. Частые причины: забытые таймеры и обработчики, глобальные переменные, замыкания с большими данными, удалённые из DOM элементы, на которые ещё ссылаются.", "hint": "Осталась лишняя ссылка.", "added": "2026-10-27"}, {"id": "term-gc-05", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «Сборка мусора и утечки памяти» полностью, как на собеседовании (4 шага).", "a": "1. Что: сборщик мусора автоматически освобождает память от объектов, которые стали недостижимы.\n2. Как работает: алгоритм mark-and-sweep: от корней (глобальный объект, стек вызовов) помечаем всё достижимое, остальное удаляем.\n3. Пример утечки: забытые `setInterval` и обработчики событий, глобальные переменные, замыкания с большими данными.\n4. В React: утечки убирают функцией очистки в `useEffect` — `clearInterval`, `removeEventListener`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-git_basics-01", "deck": "Термины собеса · Git", "kind": "topic", "q": "Какие зоны есть в Git?", "a": "Рабочая папка — где правим файлы, индекс (staging) — что попадёт в следующий коммит, локальный репозиторий — история коммитов. Плюс удалённый репозиторий на GitHub.", "hint": "Папка → индекс → коммит.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_basics-02", "deck": "Термины собеса · Git", "kind": "topic", "q": "Что делают `git add` и `git commit`?", "a": "`add` добавляет изменения в индекс — готовит коммит. `commit` сохраняет снимок индекса в историю с сообщением.", "hint": "Подготовить и сохранить.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_basics-03", "deck": "Термины собеса · Git", "kind": "topic", "q": "Чем `git fetch` отличается от `git pull`?", "a": "`fetch` скачивает новые коммиты с сервера, но не меняет твою ветку. `pull` = `fetch` + `merge` (или `rebase`): сразу вливает их в текущую ветку.", "hint": "Скачать / скачать и слить.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_basics-04", "deck": "Термины собеса · Git", "kind": "topic", "q": "Расскажи про тему «Основные команды Git» полностью, как на собеседовании (4 шага).", "a": "1. Что: у Git три зоны: рабочая папка → индекс (staging) → репозиторий (коммиты); плюс удалённый репозиторий.\n2. Команды: `git add` — в индекс, `git commit` — сохранить снимок, `git push` — отправить на сервер, `git pull` — забрать и слить (`fetch` + `merge`).\n3. Пример: `git status` → `git add .` → `git commit -m \"feat: форма входа\"` → `git push`.\n4. Подвох: `fetch` только скачивает изменения, не трогая твою ветку; `pull` ещё и сливает их.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_conflict-01", "deck": "Термины собеса · Git", "kind": "topic", "q": "Когда возникает merge conflict?", "a": "Когда одни и те же строки файла изменены в двух ветках по-разному (или файл удалён в одной и изменён в другой). Git останавливается и просит выбрать вручную.", "hint": "Одни строки — разные правки.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_conflict-02", "deck": "Термины собеса · Git", "kind": "topic", "q": "Что значат маркеры конфликта?", "code": "<<<<<<< HEAD\nconst limit = 10;\n=======\nconst limit = 20;\n>>>>>>> feature/pagination", "a": "Между `<<<<<<<` и `=======` — версия текущей ветки, между `=======` и `>>>>>>>` — входящая. Нужно оставить правильный вариант и удалить маркеры.", "hint": "Моё / их.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_conflict-03", "deck": "Термины собеса · Git", "kind": "topic", "q": "Какие шаги, чтобы решить конфликт?", "a": "Открыть файлы с конфликтом, выбрать или объединить код, удалить маркеры, `git add`, затем `git commit` (при rebase — `git rebase --continue`). Проверить, что проект собирается.", "hint": "Править, add, commit.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_conflict-04", "deck": "Термины собеса · Git", "kind": "topic", "q": "Расскажи про тему «Конфликты слияния» полностью, как на собеседовании (4 шага).", "a": "1. Что: конфликт — когда одни и те же строки изменены в двух ветках по-разному, и Git не может выбрать сам.\n2. Как выглядит: в файле маркеры `<<<<<<<`, `=======`, `>>>>>>>` — твоя версия и входящая.\n3. Как решать: открыть файл, оставить правильный код (свой, чужой или объединить), убрать маркеры, `git add`, затем `git commit` (или `git rebase --continue`).\n4. Практика: если не понимаешь чужой код — спросить автора; после решения — запустить проект и тесты.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_flow-01", "deck": "Термины собеса · Git", "kind": "topic", "q": "Что такое feature branch?", "a": "Отдельная ветка под одну задачу, созданная от основной. Основная ветка остаётся рабочей, а изменения попадают в неё только через Pull Request.", "hint": "Ветка на задачу.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_flow-02", "deck": "Термины собеса · Git", "kind": "topic", "q": "Что такое Pull Request?", "a": "Запрос на слияние ветки в основную. На нём запускаются автоматические проверки и проходит код-ревью; после одобрения ветку сливают.", "hint": "Запрос на слияние + ревью.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_flow-03", "deck": "Термины собеса · Git", "kind": "topic", "q": "Зачем нужно код-ревью?", "a": "Найти ошибки до попадания в основную ветку, держать единый стиль, делиться знаниями о коде. На ревью смотрят логику, читаемость, тесты и крайние случаи.", "hint": "Ошибки, стиль, знания.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_flow-04", "deck": "Термины собеса · Git", "kind": "topic", "q": "Расскажи про тему «Ветки и Pull Request» полностью, как на собеседовании (4 шага).", "a": "1. Что: каждая задача делается в своей ветке от основной (`feature/login-form`), основная ветка остаётся рабочей.\n2. Pull Request: готовую ветку отправляем на сервер и создаём PR — запрос на слияние; запускаются CI-проверки (тесты, линтер).\n3. Код-ревью: коллеги смотрят код, оставляют замечания, после исправлений и одобрения ветку сливают в `main`.\n4. Практика: маленькие PR с понятным описанием, ветку обновлять от `main`, конфликты решать до слияния.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_ignore-01", "deck": "Термины собеса · Git", "kind": "topic", "q": "Что обычно кладут в `.gitignore`?", "code": "node_modules/\ndist/\n.env\n.DS_Store", "a": "Зависимости, результаты сборки, файлы с секретами (`.env`), служебные файлы ОС и редактора — всё, что генерируется или не должно попасть в репозиторий.", "hint": "Сборка, зависимости, секреты.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_ignore-02", "deck": "Термины собеса · Git", "kind": "topic", "q": "Почему файл в `.gitignore` всё равно в коммитах?", "code": "git rm --cached .env", "a": "`.gitignore` действует только на неотслеживаемые файлы. Если файл уже добавлен, его надо убрать из индекса `git rm --cached`, а если там был секрет — сменить сам секрет.", "hint": "rm --cached.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_ignore-03", "deck": "Термины собеса · Git", "kind": "topic", "q": "Как писать сообщения коммитов?", "code": "feat: добавить фильтр по статусу\nfix: исправить двойную отправку формы\nrefactor: вынести useFetch в хук", "a": "Коротко, по делу, что сделано: тип (`feat`, `fix`, `refactor`, `docs`, `test`), двоеточие и описание. Один коммит — одно логическое изменение.", "hint": "Тип: что сделано.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_ignore-04", "deck": "Термины собеса · Git", "kind": "topic", "q": "Расскажи про тему «.gitignore и сообщения коммитов» полностью, как на собеседовании (4 шага).", "a": "1. .gitignore: список файлов и папок, которые Git не отслеживает: `node_modules`, `dist`, `.env` с секретами, файлы редактора.\n2. Подвох: файл, который уже в репозитории, `.gitignore` не уберёт — нужно `git rm --cached`.\n3. Сообщения: коротко что и зачем, в повелительном наклонении; часто по Conventional Commits: `feat:`, `fix:`, `refactor:`, `docs:`.\n4. Пример: `fix: не отправлять форму при пустом email` — по истории понятно, что изменилось.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_rebase-01", "deck": "Термины собеса · Git", "kind": "topic", "q": "Что делает `git merge`?", "a": "Сливает ветку в текущую, создавая коммит слияния с двумя родителями. История остаётся как была, с разветвлением.", "hint": "Коммит слияния.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_rebase-02", "deck": "Термины собеса · Git", "kind": "topic", "q": "Что делает `git rebase`?", "a": "Берёт коммиты твоей ветки и заново применяет их поверх другой ветки. История линейная, но коммиты получают новые хэши.", "hint": "Переписать поверх.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_rebase-03", "deck": "Термины собеса · Git", "kind": "topic", "q": "Когда нельзя делать rebase?", "a": "На общих ветках, которые уже отправлены на сервер и используются другими: у них останутся старые коммиты, и истории разойдутся. Свою локальную ветку перед PR ребейзить можно.", "hint": "Не трогать общую историю.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_rebase-04", "deck": "Термины собеса · Git", "kind": "topic", "q": "Расскажи про тему «merge и rebase» полностью, как на собеседовании (4 шага).", "a": "1. Что: оба способа переносят изменения одной ветки в другую.\n2. merge: создаёт коммит слияния, история сохраняется как была — с разветвлениями.\n3. rebase: переписывает коммиты ветки поверх свежего `main` — история получается линейной, но у коммитов новые хэши.\n4. Правило: не делать rebase общих веток, которые уже запушены и с которыми работают другие; свою ветку перед PR — можно.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_reset-01", "deck": "Термины собеса · Git", "kind": "topic", "q": "Что делает `git revert`?", "code": "git revert a1b2c3d", "a": "Создаёт новый коммит, который отменяет изменения указанного. История не переписывается, поэтому так отменяют то, что уже в общей ветке.", "hint": "Новый обратный коммит.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_reset-02", "deck": "Термины собеса · Git", "kind": "topic", "q": "Что делает `git reset`?", "code": "git reset --soft HEAD~1   # коммит отменён, изменения в индексе\ngit reset HEAD~1          # изменения в рабочей папке\ngit reset --hard HEAD~1   # изменения удалены", "a": "Передвигает указатель ветки на другой коммит. `--soft` оставляет изменения в индексе, `--mixed` — в рабочей папке, `--hard` удаляет их.", "hint": "Сдвинуть ветку.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_reset-03", "deck": "Термины собеса · Git", "kind": "topic", "q": "Когда reset, а когда revert?", "a": "Revert — для коммитов, которые уже запушены и есть у других. Reset — для локальных коммитов, которые ещё никто не видел.", "hint": "Общее — revert.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_reset-04", "deck": "Термины собеса · Git", "kind": "topic", "q": "Расскажи про тему «reset и revert» полностью, как на собеседовании (4 шага).", "a": "1. Что: оба отменяют изменения, но по-разному.\n2. revert: создаёт новый коммит, который делает обратное изменение; история не переписывается — безопасно для общих веток.\n3. reset: передвигает ветку назад, «удаляя» коммиты из истории: `--soft` — изменения остаются в индексе, `--mixed` (по умолчанию) — в рабочей папке, `--hard` — удаляются совсем.\n4. Правило: уже запушенное в общую ветку — revert; свои локальные коммиты — можно reset.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_stash-01", "deck": "Термины собеса · Git", "kind": "topic", "q": "Зачем нужен `git stash`?", "code": "git stash\ngit switch hotfix\n# …\ngit switch feature\ngit stash pop", "a": "Временно убрать незакоммиченные изменения, чтобы получить чистую рабочую папку, например переключиться на другую ветку. `stash pop` возвращает их.", "hint": "Отложить изменения.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_stash-02", "deck": "Термины собеса · Git", "kind": "topic", "q": "Что делает `git cherry-pick`?", "code": "git cherry-pick 9f8e7d6", "a": "Копирует изменения одного конкретного коммита в текущую ветку новым коммитом. Нужен, когда из ветки нужен не весь код, а одно исправление.", "hint": "Перенести один коммит.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-git_stash-03", "deck": "Термины собеса · Git", "kind": "topic", "q": "Расскажи про тему «stash и cherry-pick» полностью, как на собеседовании (4 шага).", "a": "1. stash: временно убирает незакоммиченные изменения в «карман» и возвращает чистую папку; `git stash pop` — вернуть их обратно.\n2. Пример stash: работаешь над задачей, срочно нужно переключиться на другую ветку — `stash`, переключился, вернулся, `stash pop`.\n3. cherry-pick: копирует один конкретный коммит из другой ветки в текущую.\n4. Пример cherry-pick: исправление бага сделано в `develop`, а нужно срочно в `release` — переносим только этот коммит.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-13"}, {"id": "term-hof-01", "deck": "Термины собеса", "kind": "topic", "q": "Что такое функция высшего порядка?", "code": "[1, 2].map((n) => n * 2);           // принимает функцию\nconst add = (a) => (b) => a + b;    // возвращает функцию", "a": "Функция, которая принимает другую функцию как аргумент или возвращает функцию. Примеры: `map`, `filter`, `setTimeout`, `debounce`.", "hint": "Работает с функциями.", "added": "2026-10-27"}, {"id": "term-hof-02", "deck": "Термины собеса", "kind": "topic", "q": "Что такое чистая функция?", "code": "const sum = (a, b) => a + b;              // чистая\nconst add = (n) => { total += n; };       // нечистая", "a": "Функция, которая при одних и тех же аргументах всегда возвращает один результат и не имеет побочных эффектов: не меняет внешние переменные, не делает запросов.", "hint": "Тот же вход — тот же выход.", "added": "2026-10-27"}, {"id": "term-hof-03", "deck": "Термины собеса", "kind": "topic", "q": "Что такое побочный эффект?", "a": "Любое влияние функции на внешний мир: изменение внешних переменных или аргументов, запрос к серверу, запись в DOM или `localStorage`, `console.log`. В React их выносят в `useEffect`.", "hint": "Влияние наружу.", "added": "2026-10-27"}, {"id": "term-hof-04", "deck": "Термины собеса", "kind": "topic", "q": "Что такое каррирование?", "code": "const add = (a) => (b) => a + b;\nadd(2)(3); // 5\nconst add2 = add(2);", "a": "Превращение функции от нескольких аргументов в цепочку функций, каждая принимает по одному аргументу. Работает за счёт замыканий.", "hint": "f(a, b) → f(a)(b).", "added": "2026-10-27"}, {"id": "term-hof-05", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «Функции высшего порядка, чистые функции, каррирование» полностью, как на собеседовании (4 шага).", "a": "1. Что: функция высшего порядка принимает функцию аргументом или возвращает функцию.\n2. Чистая функция: при одних и тех же аргументах всегда тот же результат и нет побочных эффектов.\n3. Каррирование: превращение `f(a, b)` в `f(a)(b)` — функция принимает аргументы по одному.\n4. Зачем: `map` и `filter` — функции высшего порядка; редьюсеры в Redux и компоненты React должны быть чистыми.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-hooksrules-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Какие два правила хуков?", "a": "Вызывать хуки только на верхнем уровне — не в условиях, циклах и вложенных функциях. Вызывать только из функциональных компонентов и своих хуков.", "hint": "Верхний уровень + только React-функции.", "added": "2026-10-27"}, {"id": "term-hooksrules-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Почему нельзя вызывать хук в условии?", "code": "if (isAuth) {\n  const [name, setName] = useState('');\n}\nconst [age, setAge] = useState(0);", "a": "React связывает состояние с хуком по порядку вызова. Если хук пропущен в одном рендере, все следующие сдвигаются и получают чужое состояние.", "hint": "Состояние по порядку вызова.", "added": "2026-10-27"}, {"id": "term-hooksrules-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Как правильно сделать «эффект только для авторизованных»?", "code": "useEffect(() => {\n  if (!isAuth) return;\n  loadProfile();\n}, [isAuth]);", "a": "Хук вызывать всегда, а условие ставить внутри него.", "hint": "Условие — внутрь.", "added": "2026-10-27"}, {"id": "term-hooksrules-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «Правила хуков» полностью, как на собеседовании (4 шага).", "a": "1. Что: два правила: хуки вызываются только на верхнем уровне компонента и только из компонентов или своих хуков.\n2. Почему: React хранит состояние хуков по порядку вызова; порядок должен быть одинаковым в каждом рендере.\n3. Пример: `if (isAuth) useState()` — при смене `isAuth` порядок сдвинется, и React отдаст чужое состояние не тому хуку.\n4. Подвох: условие переносят внутрь хука (`useEffect(() => { if (...) ... })`); исключение — новый `use()`, его можно вызывать в условиях.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-immutability-01", "deck": "Термины собеса", "kind": "topic", "q": "Что такое иммутабельность?", "a": "Подход, при котором данные не изменяют на месте, а создают новую копию с изменениями. Старый объект остаётся прежним.", "hint": "Менять или копировать?", "added": "2026-10-27"}, {"id": "term-immutability-02", "deck": "Термины собеса", "kind": "topic", "q": "Почему мутация состояния ломает React?", "code": "const [todos, setTodos] = useState([]);\ntodos.push(item);\nsetTodos(todos); // ре-рендера не будет", "a": "React сравнивает старое и новое состояние по ссылке (shallow compare). После `push` ссылка та же — React считает, что ничего не изменилось. Нужно `setTodos([...todos, item])`.", "hint": "Изменилась ли ссылка?", "added": "2026-10-27"}, {"id": "term-immutability-03", "deck": "Термины собеса", "kind": "topic", "q": "Как неизменяемо обновить вложенное поле?", "code": "const next = {\n  ...user,\n  address: { ...user.address, city: 'Москва' },\n};", "a": "Копировать каждый уровень, который меняется, через spread. Spread поверхностный, поэтому вложенный объект копируют отдельно.", "hint": "Spread на каждом уровне.", "added": "2026-10-27"}, {"id": "term-immutability-04", "deck": "Термины собеса", "kind": "topic", "q": "Что такое Immer?", "code": "const slice = createSlice({\n  reducers: {\n    add(state, action) {\n      state.items.push(action.payload); // можно\n    },\n  },\n});", "a": "Библиотека, которая позволяет писать код как с мутацией, а сама создаёт новую неизменяемую копию. Встроена в Redux Toolkit.", "hint": "Встроено в RTK.", "added": "2026-10-27"}, {"id": "term-immutability-05", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «Иммутабельность» полностью, как на собеседовании (4 шага).", "a": "1. Что: иммутабельность — данные не изменяют, а создают новую копию с изменениями.\n2. Как работает: копируем через spread, `map`, `filter`, `toSorted` вместо `push` и прямого присваивания.\n3. Пример: `setTodos([...todos, newTodo])` вместо `todos.push(newTodo)`.\n4. Зачем: React и Redux сравнивают состояние по ссылке (shallow compare) — мутация не меняет ссылку, и ре-рендера не будет; в Redux Toolkit Immer даёт писать «мутирующий» код безопасно.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-jsx-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Во что компилируется JSX?", "code": "const el = <h1 className=\"title\">Привет<\/h1>;\n// после сборки:\nconst el = jsx('h1', { className: 'title', children: 'Привет' });", "a": "В вызовы функции `jsx()` (раньше `React.createElement`). Они возвращают обычный объект-описание элемента: тип, пропсы, дети.", "hint": "Это просто вызов функции.", "added": "2026-10-27"}, {"id": "term-jsx-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Зачем нужен фрагмент `<>...<\/>`?", "code": "return (\n  <>\n    <Header />\n    <Main />\n  <\/>\n);", "a": "Компонент возвращает одно значение. Фрагмент группирует несколько элементов без лишнего `div` в DOM. Если нужен `key` — пишут `<Fragment key={...}>`.", "hint": "Обёртка без DOM-узла.", "added": "2026-10-27"}, {"id": "term-jsx-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Как в JSX вывести условие и список?", "code": "{isAuth && <Profile />}\n{isAuth ? <Profile /> : <Login />}\n{items.map((it) => <li key={it.id}>{it.name}<\/li>)}", "a": "В фигурных скобках — любое JS-выражение. Условие — через `&&` или тернарный оператор, список — через `map` с `key`. `if` и `for` внутри JSX нельзя: это инструкции, а не выражения.", "hint": "Только выражения.", "added": "2026-10-27"}, {"id": "term-jsx-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Что покажет `{count && <Badge />}`, если `count` равен 0?", "a": "Отрисуется `0`. React не рисует `false`, `null`, `undefined`, но число 0 — рисует. Правильно: `{count > 0 && <Badge />}`.", "hint": "0 — falsy, но React его выводит.", "added": "2026-10-27"}, {"id": "term-jsx-05", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «JSX» полностью, как на собеседовании (4 шага).", "a": "1. Что: JSX — синтаксическое расширение JS, которое позволяет писать разметку прямо в коде.\n2. Как работает: сборщик компилирует JSX в вызовы функции (`jsx()` / раньше `React.createElement`), которые возвращают объекты-элементы.\n3. Пример: `<Button color=\"red\">OK<\/Button>` → `jsx(Button, { color: 'red', children: 'OK' })`.\n4. Подвох: в JSX — `className` вместо `class`, `htmlFor` вместо `for`, выражения в `{ }`, один корневой элемент или фрагмент `<>...<\/>`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-key-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Зачем нужен `key` в списках?", "a": "Чтобы React сопоставлял элементы старого и нового списка. По `key` он понимает, что добавилось, удалилось или переставилось, и сохраняет состояние нужного элемента.", "hint": "Сопоставление элементов.", "added": "2026-10-27"}, {"id": "term-key-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Почему индекс — плохой key?", "code": "items.map((item, i) => <Row key={i} item={item} />)", "a": "При вставке в начало, удалении или сортировке индексы сдвигаются, и React сопоставляет не те элементы: состояние, например текст в инпуте, остаётся на месте, а данные уезжают. Нужен стабильный id из данных.", "hint": "Индексы сдвигаются.", "added": "2026-10-27"}, {"id": "term-key-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Как сбросить состояние компонента целиком?", "code": "<Profile key={userId} userId={userId} />", "a": "Поменять ему `key`. Новый key — для React это другой компонент: старый размонтируется, новый смонтируется с чистым состоянием.", "hint": "Новый key = новый компонент.", "added": "2026-10-27"}, {"id": "term-key-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Где должен быть уникален key?", "a": "Только среди соседей в одном списке. Глобально уникальным он быть не обязан. Генерировать key через `Math.random()` при рендере нельзя — он будет новым каждый раз.", "hint": "Среди соседей; не random.", "added": "2026-10-27"}, {"id": "term-key-05", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «key в списках» полностью, как на собеседовании (4 шага).", "a": "1. Что: `key` — уникальный стабильный идентификатор элемента списка.\n2. Как работает: при сравнении React сопоставляет элементы по `key`: понимает, какой добавлен, удалён или переставлен, и сохраняет состояние нужного элемента.\n3. Пример: `todos.map((t) => <Todo key={t.id} {...t} />)`.\n4. Подвох: индекс как key ломается при вставке, удалении, сортировке — состояние (текст в инпуте, чекбокс) «переезжает» к чужому элементу.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-lifecycle-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Как выполнить код один раз после монтирования?", "code": "useEffect(() => {\n  console.log('смонтирован');\n}, []);", "a": "`useEffect` с пустым массивом зависимостей. Он запускается после первого рендера и коммита в DOM.", "hint": "Пустой массив.", "added": "2026-10-27"}, {"id": "term-lifecycle-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Как выполнить код при размонтировании?", "code": "useEffect(() => {\n  const id = setInterval(tick, 1000);\n  return () => clearInterval(id);\n}, []);", "a": "Вернуть из эффекта функцию очистки. React вызовет её при размонтировании и перед каждым повторным запуском эффекта.", "hint": "return () => …", "added": "2026-10-27"}, {"id": "term-lifecycle-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Почему в разработке эффект срабатывает дважды?", "a": "`StrictMode` в dev-режиме специально монтирует, размонтирует и снова монтирует компонент. Так видно эффекты без правильной очистки. В продакшене эффект запускается один раз.", "hint": "Только dev, проверка очистки.", "added": "2026-10-27"}, {"id": "term-lifecycle-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Чем `useLayoutEffect` отличается от `useEffect`?", "a": "`useLayoutEffect` срабатывает синхронно после изменения DOM, но до отрисовки на экране — для замеров размеров без мигания. `useEffect` — после отрисовки, не блокирует экран. По умолчанию нужен `useEffect`.", "hint": "До или после отрисовки.", "added": "2026-10-27"}, {"id": "term-lifecycle-05", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «Жизненный цикл в хуках» полностью, как на собеседовании (4 шага).", "a": "1. Что: у компонента три этапа: монтирование, обновление, размонтирование.\n2. Как в хуках: `useEffect(fn, [])` — после монтирования; с зависимостями — после обновления этих значений; функция очистки — перед следующим запуском и при размонтировании.\n3. Пример: подписка на `resize` в эффекте и `removeEventListener` в очистке.\n4. Подвох: в StrictMode в разработке эффекты запускаются дважды (монтирование → очистка → монтирование) — чтобы найти эффекты без очистки.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-mapset-01", "deck": "Термины собеса", "kind": "topic", "q": "Что такое Map?", "code": "const m = new Map();\nm.set(user, 'данные');\nm.get(user);\nm.size; // 1", "a": "Коллекция пар «ключ — значение», где ключом может быть любое значение, даже объект. Сохраняет порядок вставки, есть `size`.", "hint": "Ключ любого типа.", "added": "2026-10-27"}, {"id": "term-mapset-02", "deck": "Термины собеса", "kind": "topic", "q": "Что такое Set?", "code": "const s = new Set([1, 2, 2, 3]);\ns.size;   // 3\ns.has(2); // true", "a": "Коллекция уникальных значений: дубли не добавляются. Методы `add`, `has`, `delete`, свойство `size`.", "hint": "Только уникальные.", "added": "2026-10-27"}, {"id": "term-mapset-03", "deck": "Термины собеса", "kind": "topic", "q": "Как убрать дубликаты из массива?", "code": "const unique = [...new Set([1, 1, 2, 3, 3])]; // [1, 2, 3]", "a": "Создать `Set` из массива и разложить обратно spread-ом или через `Array.from`.", "hint": "Set + spread.", "added": "2026-10-27"}, {"id": "term-mapset-04", "deck": "Термины собеса", "kind": "topic", "q": "Чем Map отличается от обычного объекта?", "a": "Ключи объекта — только строки и символы, у Map — любые. У Map есть `size`, она перебирается в порядке вставки и нет унаследованных ключей из прототипа.", "hint": "Тип ключей и size.", "added": "2026-10-27"}, {"id": "term-mapset-05", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «Map и Set» полностью, как на собеседовании (4 шага).", "a": "1. Что: Map — коллекция «ключ — значение» с ключами любого типа; Set — коллекция уникальных значений.\n2. Как работает: методы `set/get/has/delete`, свойство `size`, порядок вставки сохраняется.\n3. Пример: `[...new Set(arr)]` — убрать дубли из массива.\n4. Отличие от объекта: ключи объекта — только строки и символы, у Map есть `size` и она удобнее для частых добавлений и удалений.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-memo-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Что делает `React.memo`?", "code": "const List = memo(function List({ items }) {\n  return items.map((i) => <Row key={i.id} item={i} />);\n});", "a": "Оборачивает компонент и пропускает его ре-рендер, если props не изменились. Сравнение поверхностное — по ссылкам.", "hint": "Пропуск ре-рендера.", "added": "2026-10-27"}, {"id": "term-memo-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Что делает `useMemo`?", "code": "const visible = useMemo(() => filterTodos(todos, tab), [todos, tab]);", "a": "Запоминает результат вычисления и пересчитывает его только при изменении зависимостей. Для тяжёлых вычислений и для стабильной ссылки на объект или массив.", "hint": "Кэш результата.", "added": "2026-10-27"}, {"id": "term-memo-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Что делает `useCallback`?", "code": "const handleClick = useCallback(() => remove(id), [id]);", "a": "Запоминает саму функцию между рендерами, пока не изменились зависимости. Нужен, когда функцию передают в `memo`-компонент или в зависимости эффекта.", "hint": "Кэш функции.", "added": "2026-10-27"}, {"id": "term-memo-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Почему `memo` здесь не помогает?", "code": "const Child = memo(({ onClick }) => <button onClick={onClick}>+<\/button>);\nfunction Parent() {\n  const [n, setN] = useState(0);\n  return <Child onClick={() => setN(n + 1)} />;\n}", "a": "На каждом рендере `Parent` создаётся новая стрелка — новая ссылка в props, и `memo` видит изменение. Нужно стабилизировать функцию через `useCallback`.", "hint": "Новая функция каждый рендер.", "added": "2026-10-27"}, {"id": "term-memo-05", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «useMemo, useCallback, React.memo» полностью, как на собеседовании (4 шага).", "a": "1. Что: три инструмента мемоизации: `React.memo` — пропускает ре-рендер компонента; `useMemo` — кэширует результат вычисления; `useCallback` — кэширует саму функцию.\n2. Как работает: `React.memo` поверхностно сравнивает props; `useMemo`/`useCallback` пересчитывают значение только при изменении зависимостей.\n3. Пример: `memo(List)` + обработчик через `useCallback`, иначе новая функция каждый рендер ломает мемоизацию.\n4. Подвох: мемоизация не бесплатна — применяют там, где есть реальная проблема; с React Compiler это делается автоматически.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-modules-01", "deck": "Термины собеса", "kind": "topic", "q": "Что такое именованный экспорт?", "code": "export const sum = (a, b) => a + b;\nimport { sum } from './math';", "a": "Экспорт по имени. Их может быть много, импортируют в фигурных скобках с тем же именем (можно переименовать через `as`).", "hint": "Фигурные скобки.", "added": "2026-10-27"}, {"id": "term-modules-02", "deck": "Термины собеса", "kind": "topic", "q": "Что такое экспорт по умолчанию?", "code": "export default function Button() {}\nimport MyButton from './Button';", "a": "Один основной экспорт файла. Импортируется без фигурных скобок под любым именем.", "hint": "Один на файл.", "added": "2026-10-27"}, {"id": "term-modules-03", "deck": "Термины собеса", "kind": "topic", "q": "Чем CommonJS отличается от ES-модулей?", "a": "CommonJS — `require` и `module.exports`, загрузка синхронная, исторически формат Node. ES-модули — `import/export`, статическая структура, стандарт браузеров и современной сборки.", "hint": "require против import.", "added": "2026-10-27"}, {"id": "term-modules-04", "deck": "Термины собеса", "kind": "topic", "q": "Что такое tree shaking?", "a": "Удаление при сборке кода, который нигде не импортируется. Возможно благодаря статическим `import/export`.", "hint": "Сборщик выкидывает лишнее.", "added": "2026-10-27"}, {"id": "term-modules-05", "deck": "Термины собеса", "kind": "topic", "q": "Что такое динамический `import()`?", "code": "const { Chart } = await import('./Chart');", "a": "Загрузка модуля во время выполнения, возвращает промис. Используют для ленивой загрузки и code splitting, в React — вместе с `lazy`.", "hint": "Возвращает промис.", "added": "2026-10-27"}, {"id": "term-modules-06", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «ES-модули» полностью, как на собеседовании (4 шага).", "a": "1. Что: модуль — файл со своей областью видимости, который обменивается кодом через `import` и `export`.\n2. Как работает: именованных экспортов может быть сколько угодно, импортируются в `{ }` по имени; default — один, имя при импорте любое.\n3. Пример: `import Button, { Icon } from './ui'`.\n4. Отличие от CommonJS: CommonJS — `require/module.exports`, загружается синхронно, исторически в Node; ES-модули статические, это даёт tree shaking.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-net_auth-01", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Чем аутентификация отличается от авторизации?", "a": "Аутентификация — проверка, кто ты (логин, пароль, токен). Авторизация — проверка, что тебе можно делать (права). Ошибки: 401 и 403.", "hint": "Кто ты / что можно.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_auth-02", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Что такое JWT?", "code": "header.payload.signature\n// payload: { \"sub\": 42, \"role\": \"user\", \"exp\": 1730000000 }", "a": "JSON Web Token: три части через точку — заголовок, данные и подпись. Сервер проверяет подпись своим ключом и доверяет данным, не храня сессию. Данные не зашифрованы — только закодированы, секреты туда не кладут.", "hint": "Подписан, не зашифрован.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_auth-03", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Где безопаснее хранить токен?", "a": "В `httpOnly`-cookie с флагами `Secure` и `SameSite`: JavaScript не может его прочитать, поэтому XSS не украдёт токен. В `localStorage` токен доступен любому скрипту на странице.", "hint": "httpOnly-cookie.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_auth-04", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Зачем нужен refresh-токен?", "a": "Access-токен живёт недолго (минуты), чтобы утёкший токен быстро стал бесполезен. Refresh-токен живёт дольше, хранится в httpOnly-cookie и нужен, чтобы получать новые access-токены без повторного входа.", "hint": "Обновлять короткий токен.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_auth-05", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Расскажи про тему «Аутентификация: cookie и токены» полностью, как на собеседовании (4 шага).", "a": "1. Сессия в cookie: сервер хранит сессию и отдаёт id сессии в cookie; браузер сам отправляет её с каждым запросом.\n2. Токен (JWT): сервер выдаёт подписанный токен с данными пользователя, клиент отправляет его в заголовке `Authorization: Bearer …`; сервер проверяет подпись, не храня сессию.\n3. Где хранить: `httpOnly`-cookie — JS не может прочитать токен, это защита от XSS; нужен `SameSite` против CSRF. `localStorage` удобен, но токен украдёт любой внедрённый скрипт.\n4. Практика: короткий access-токен + долгий refresh-токен в httpOnly-cookie для обновления.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_cache-01", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Что значат `max-age`, `no-cache`, `no-store`?", "a": "`max-age=N` — использовать копию N секунд без запроса. `no-cache` — хранить, но перед использованием проверять у сервера. `no-store` — не сохранять вообще.", "hint": "Срок / проверять / не хранить.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_cache-02", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Как работают ETag и 304?", "code": "→ GET /app.js\n← 200, ETag: \"abc123\"\n→ GET /app.js, If-None-Match: \"abc123\"\n← 304 Not Modified", "a": "Сервер отдаёт ETag — отпечаток версии файла. При повторном запросе браузер присылает его, и если файл не изменился, сервер отвечает 304 без тела — браузер берёт копию из кэша.", "hint": "Отпечаток версии.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_cache-03", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Зачем хэш в имени файлов сборки?", "code": "index-8f3a1c.js", "a": "Чтобы кэшировать файл надолго (`max-age` на год): при изменении кода меняется имя, и браузер скачает новый файл. А `index.html` отдают с `no-cache`, чтобы он всегда ссылался на свежие файлы.", "hint": "Новый код — новое имя.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_cache-04", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Расскажи про тему «HTTP-кэширование» полностью, как на собеседовании (4 шага).", "a": "1. Что: сервер заголовками говорит браузеру, можно ли и как долго хранить ответ.\n2. Cache-Control: `max-age=31536000` — год без запросов (файлы с хэшем в имени), `no-cache` — хранить, но каждый раз проверять, `no-store` — не хранить совсем.\n3. Проверка: сервер отдаёт `ETag` (отпечаток версии); браузер шлёт `If-None-Match`; если не изменилось — 304 Not Modified без тела.\n4. Практика: `index.html` — `no-cache` (всегда свежий), JS и CSS с хэшем в имени — кэш на год.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_codes-01", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Что означают группы статус-кодов?", "a": "1xx — информационные, 2xx — успех, 3xx — перенаправление, 4xx — ошибка клиента (неверный запрос), 5xx — ошибка сервера.", "hint": "2 — ок, 3 — редирект, 4 — клиент, 5 — сервер.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_codes-02", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Чем отличаются 200, 201 и 204?", "a": "200 — успех с телом ответа. 201 — ресурс создан (обычно после POST). 204 — успех без тела (часто после DELETE).", "hint": "Ок, создано, без тела.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_codes-03", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Чем 401 отличается от 403?", "a": "401 Unauthorized — пользователь не аутентифицирован: нет токена или он истёк, нужно войти. 403 Forbidden — пользователь известен, но прав на действие нет.", "hint": "К
