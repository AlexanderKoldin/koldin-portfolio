то ты? / Нельзя.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_codes-04", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Что значат 301 и 304?", "a": "301 — ресурс навсегда переехал на другой адрес, браузер перейдёт туда. 304 Not Modified — ресурс не изменился, браузер берёт копию из кэша.", "hint": "Переехал / из кэша.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_codes-05", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Расскажи про тему «Статус-коды» полностью, как на собеседовании (4 шага).", "a": "1. Группы: 2xx — успех, 3xx — перенаправление, 4xx — ошибка клиента, 5xx — ошибка сервера.\n2. Успех: 200 OK, 201 Created (создали), 204 No Content (успех без тела).\n3. 3xx и 4xx: 301 — переехал навсегда, 304 — не изменился, бери из кэша; 400 — неверный запрос, 401 — не авторизован, 403 — нет прав, 404 — не найдено.\n4. 5xx: 500 — ошибка на сервере. Подвох: 401 — «кто ты?», 403 — «знаю, кто ты, но нельзя».", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_cors-01", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Что такое origin?", "a": "Сочетание протокола, домена и порта: `https://site.ru:443`. Отличие хотя бы в одном — уже другой origin.", "hint": "Протокол + домен + порт.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_cors-02", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Почему возникает ошибка CORS?", "a": "Браузер по Same-Origin Policy не отдаёт странице ответ с чужого origin, если сервер не разрешил это заголовком `Access-Control-Allow-Origin`. Запрос до сервера доходит, блокирует браузер.", "hint": "Сервер не разрешил.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_cors-03", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Что такое preflight-запрос?", "code": "OPTIONS /api/users\nOrigin: https://app.ru\nAccess-Control-Request-Method: DELETE", "a": "Предварительный OPTIONS-запрос, которым браузер спрашивает сервер, можно ли отправить «непростой» запрос: метод не GET/POST, JSON, свои заголовки.", "hint": "OPTIONS перед запросом.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_cors-04", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Как исправить ошибку CORS?", "a": "Настроить сервер: вернуть `Access-Control-Allow-Origin` с нашим origin и нужные методы и заголовки. В разработке — прокси в Vite (`server.proxy`). С фронтенда «выключить» CORS нельзя.", "hint": "Сервер или прокси.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_cors-05", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Расскажи про тему «CORS» полностью, как на собеседовании (4 шага).", "a": "1. Что: CORS — механизм, который разрешает странице делать запросы на другой origin (протокол + домен + порт).\n2. Как работает: по умолчанию действует Same-Origin Policy; браузер смотрит на заголовок ответа `Access-Control-Allow-Origin` — если нашего origin там нет, ответ не отдаётся JS.\n3. Preflight: для «непростых» запросов (PUT, DELETE, JSON, свои заголовки) браузер сначала шлёт OPTIONS — спрашивает разрешение.\n4. Подвох: ошибку CORS исправляют на сервере (заголовки) или через прокси в dev; это защита браузера — Postman её не видит.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_fetch-01", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Бросает ли fetch ошибку на 404?", "code": "const res = await fetch('/api/user');\nif (!res.ok) throw new Error(`HTTP ${res.status}`);\nconst data = await res.json();", "a": "Нет. `fetch` отклоняется только при сетевой ошибке. На 404 и 500 промис выполнится успешно, поэтому проверяем `res.ok` или `res.status`.", "hint": "Проверять res.ok.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_fetch-02", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Чем axios удобнее fetch?", "a": "Сам разбирает JSON, бросает ошибку на 4xx/5xx, умеет интерсепторы (например, добавлять токен ко всем запросам), таймауты и единый `baseURL`.", "hint": "JSON, ошибки, интерсепторы.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_fetch-03", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Как отменить запрос?", "code": "const controller = new AbortController();\nfetch(url, { signal: controller.signal });\ncontroller.abort();", "a": "Через `AbortController`: передаём его `signal` в запрос и вызываем `abort()`. В React — в функции очистки `useEffect`, чтобы старый ответ не перезаписал новые данные.", "hint": "signal + abort().", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_fetch-04", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Расскажи про тему «fetch, axios, ошибки и отмена» полностью, как на собеседовании (4 шага).", "a": "1. fetch: встроен в браузер, возвращает промис; не бросает ошибку на 4xx/5xx — нужно проверять `res.ok`; тело читаем через `res.json()`.\n2. axios: библиотека: сам парсит JSON, бросает ошибку на 4xx/5xx, есть интерсепторы (добавить токен ко всем запросам) и таймауты.\n3. Отмена: `AbortController` — передаём `signal` в запрос и вызываем `abort()`, например в очистке `useEffect`.\n4. Ошибки: различаем сетевую ошибку (нет ответа), HTTP-ошибку (ответ с кодом 4xx/5xx) и ошибку разбора данных.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_https-01", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Чем HTTPS отличается от HTTP?", "a": "HTTPS — HTTP поверх TLS: данные шифруются, сервер подтверждает свою подлинность сертификатом. По HTTP всё идёт открытым текстом.", "hint": "HTTP + TLS.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_https-02", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Зачем нужен SSL/TLS-сертификат?", "a": "Подтверждает, что сервер действительно владеет доменом. Сертификат выдаёт доверенный центр, браузер проверяет его при подключении.", "hint": "Подлинность сервера.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_https-03", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "От чего защищает HTTPS?", "a": "От чтения трафика посторонними (пароли, токены), от подмены данных по пути и от поддельного сервера.", "hint": "Чтение, подмена, подделка.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_https-04", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Расскажи про тему «HTTP и HTTPS» полностью, как на собеседовании (4 шага).", "a": "1. Что: HTTPS — это HTTP поверх TLS: те же запросы, но зашифрованные.\n2. Как работает: при подключении сервер показывает сертификат, браузер проверяет, что он выдан доверенным центром на этот домен; дальше трафик шифруется.\n3. Что даёт: конфиденциальность (никто не прочитает), целостность (не подменят), подлинность сервера.\n4. Практика: без HTTPS браузеры помечают сайт небезопасным, не работают многие API (геолокация, Service Worker), куки с `Secure` не отправляются.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_methods-01", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Что делают GET, POST, PUT, PATCH, DELETE?", "a": "GET — получить данные, POST — создать, PUT — заменить ресурс целиком, PATCH — изменить часть полей, DELETE — удалить.", "hint": "Получить, создать, заменить, изменить, удалить.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_methods-02", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Что такое идемпотентность?", "a": "Свойство запроса: повторный вызов даёт тот же результат на сервере. GET, PUT, DELETE идемпотентны, POST — нет: два одинаковых POST создадут две записи.", "hint": "Повтор = тот же результат.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_methods-03", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Чем PUT отличается от PATCH?", "code": "PUT   /users/5  { id: 5, name: 'Саша', email: 'a@b.ru' }\nPATCH /users/5  { name: 'Саша' }", "a": "PUT заменяет ресурс целиком — неуказанные поля пропадут. PATCH меняет только переданные поля.", "hint": "Целиком или часть.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_methods-04", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Расскажи про тему «HTTP-методы» полностью, как на собеседовании (4 шага).", "a": "1. Что: метод говорит серверу, что сделать с ресурсом: GET — получить, POST — создать, PUT — заменить целиком, PATCH — изменить частично, DELETE — удалить.\n2. Идемпотентность: повтор запроса даёт тот же результат: GET, PUT, DELETE — идемпотентны; POST — нет (два раза — две записи).\n3. Пример: `PATCH /users/5 { name: 'Саша' }` меняет одно поле, `PUT /users/5` заменяет весь объект.\n4. Безопасные методы: GET и HEAD не меняют данные — поэтому их можно кэшировать и повторять.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_rest-01", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Что такое REST?", "a": "Стиль API: данные — это ресурсы с URL, действия над ними — HTTP-методы, сервер не хранит состояние клиента между запросами, ответы — со статус-кодами.", "hint": "Ресурсы + методы.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_rest-02", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Как в REST выглядят URL для пользователей?", "code": "GET    /users\nPOST   /users\nGET    /users/5\nPATCH  /users/5\nDELETE /users/5", "a": "Существительные во множественном числе, id в пути. Действие задаёт метод, а не слово в URL.", "hint": "Существительные, без глаголов.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_rest-03", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Что значит stateless?", "a": "Сервер не хранит состояние клиента между запросами. Каждый запрос содержит всё нужное, например токен авторизации. Так проще масштабировать сервер.", "hint": "Каждый запрос самодостаточен.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_rest-04", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Расскажи про тему «REST» полностью, как на собеседовании (4 шага).", "a": "1. Что: REST — стиль построения API, где всё — ресурсы с адресами, а действия — HTTP-методы.\n2. Принципы: понятные URL-существительные (`/users/5`), методы вместо глаголов в URL, stateless (каждый запрос самодостаточен), правильные статус-коды, единый формат (обычно JSON).\n3. Пример: `GET /users` — список, `POST /users` — создать, `GET /users/5` — один, `DELETE /users/5` — удалить.\n4. Подвох: `/getUsers` или `/deleteUser?id=5` — не REST: глагол в URL вместо метода.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_storage-01", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Чем localStorage отличается от sessionStorage?", "a": "localStorage хранится бессрочно и общий для всех вкладок сайта. sessionStorage живёт до закрытия вкладки и у каждой вкладки свой.", "hint": "Навсегда / до закрытия вкладки.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_storage-02", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Чем cookies отличаются от localStorage?", "a": "Cookies маленькие (около 4 КБ) и автоматически отправляются на сервер с каждым запросом; их можно сделать httpOnly. localStorage больше (около 5 МБ), на сервер сам не уходит и всегда доступен из JS.", "hint": "Уходят на сервер.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_storage-03", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Когда нужен IndexedDB?", "a": "Когда данных много или это сложные объекты: офлайн-режим, кэш, файлы. Это асинхронная база данных в браузере с индексами и транзакциями.", "hint": "Много данных.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_storage-04", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Расскажи про тему «Хранилища в браузере» полностью, как на собеседовании (4 шага).", "a": "1. localStorage: строки ключ–значение, около 5 МБ, хранится бессрочно, доступен из JS, не отправляется на сервер.\n2. sessionStorage: то же, но живёт до закрытия вкладки и не делится между вкладками.\n3. cookies: маленькие (около 4 КБ), автоматически уходят на сервер с каждым запросом, можно сделать `httpOnly` — недоступными из JS.\n4. IndexedDB: асинхронная база данных в браузере для больших объёмов и объектов — офлайн-режим, кэш данных.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_url-01", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Что делает DNS?", "a": "Переводит доменное имя в IP-адрес сервера. Сначала ищет в кэше браузера и системы, потом спрашивает DNS-серверы.", "hint": "Имя → IP.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_url-02", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Что происходит перед отправкой HTTPS-запроса?", "a": "Устанавливается TCP-соединение (рукопожатие), затем TLS-рукопожатие: сервер показывает сертификат, стороны договариваются о ключах шифрования.", "hint": "Соединение + шифрование.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_url-03", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Перечисли шаги от ввода адреса до страницы.", "a": "DNS → TCP → TLS → HTTP-запрос → ответ с HTML → парсинг HTML в DOM, загрузка CSS и JS → CSSOM → layout → paint.", "hint": "Сеть, потом рендер.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_url-04", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Расскажи про тему «Что происходит при вводе адреса» полностью, как на собеседовании (4 шага).", "a": "1. DNS: браузер узнаёт IP-адрес домена (кэш браузера, ОС, затем DNS-сервер).\n2. Соединение: TCP-рукопожатие с сервером, для HTTPS — ещё TLS-рукопожатие (проверка сертификата, ключи шифрования).\n3. HTTP: браузер отправляет GET-запрос, сервер возвращает HTML с кодом ответа.\n4. Отрисовка: браузер парсит HTML в DOM, грузит CSS и JS, строит CSSOM, считает layout и рисует страницу.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-11"}, {"id": "term-net_ws-01", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Что такое polling?", "a": "Клиент запрашивает сервер по таймеру, например раз в 5 секунд. Просто реализовать, но много пустых запросов и задержка до следующего опроса.", "hint": "Спрашивать по таймеру.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_ws-02", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Что такое Server-Sent Events?", "code": "const es = new EventSource('/api/events');\nes.onmessage = (e) => console.log(e.data);", "a": "Поток событий от сервера к клиенту по обычному HTTP. Только в одну сторону, с автоматическим переподключением. Подходит для уведомлений и обновлений ленты.", "hint": "Сервер → клиент.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_ws-03", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Когда нужен WebSocket?", "code": "const ws = new WebSocket('wss://chat.ru');\nws.onmessage = (e) => show(e.data);\nws.send('Привет');", "a": "Когда нужна постоянная двусторонняя связь с малой задержкой: чаты, совместное редактирование, игры, биржевые котировки.", "hint": "Двусторонняя связь.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-net_ws-04", "deck": "Термины собеса · Сеть", "kind": "topic", "q": "Расскажи про тему «WebSocket, polling, SSE» полностью, как на собеседовании (4 шага).", "a": "1. Polling: клиент периодически спрашивает сервер («есть новое?») — просто, но лишние запросы и задержка.\n2. Long polling: запрос висит, пока у сервера не появятся данные, потом клиент сразу шлёт новый.\n3. SSE (Server-Sent Events): однонаправленный поток от сервера к клиенту поверх HTTP с автоматическим переподключением — уведомления, ленты.\n4. WebSocket: постоянное двустороннее соединение — чаты, совместное редактирование, игры.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-12"}, {"id": "term-perf-01", "deck": "Термины собеса · React", "kind": "topic", "q": "С чего начинать оптимизацию React?", "a": "С измерения: вкладка Profiler в React DevTools показывает, какие компоненты рендерились, сколько времени и почему. Оптимизировать вслепую нельзя.", "hint": "Сначала измерить.", "added": "2026-10-27"}, {"id": "term-perf-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Как уменьшить ре-рендеры без мемоизации?", "a": "Держать состояние как можно ниже — в том компоненте, которому оно нужно. Тогда при его изменении перерисовывается маленькое поддерево, а не всё приложение. Ещё — передавать тяжёлые части через `children`.", "hint": "State ближе к месту.", "added": "2026-10-27"}, {"id": "term-perf-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое виртуализация списков?", "a": "Рендер только видимых на экране элементов длинного списка вместо всех тысяч. При прокрутке строки переиспользуются. Библиотеки: `react-window`, `@tanstack/react-virtual`.", "hint": "Рисуем только видимое.", "added": "2026-10-27"}, {"id": "term-perf-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое code splitting?", "a": "Разделение бандла на части, которые грузятся по требованию: страницы и тяжёлые компоненты через `lazy` и динамический `import()`. Первый экран загружается быстрее.", "hint": "Бандл по частям.", "added": "2026-10-27"}, {"id": "term-perf-05", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «Оптимизация React» полностью, как на собеседовании (4 шага).", "a": "1. Что: оптимизация начинается с измерения: React DevTools Profiler показывает, что и почему рендерится.\n2. Ре-рендеры: держать состояние ближе к месту использования, `memo` + стабильные пропсы (или React Compiler), разделять большие контексты.\n3. Загрузка: code splitting через `lazy` и `Suspense`, оптимизация картинок, меньший бандл.\n4. Большие списки: виртуализация (рисуем только видимые строки), `key` из данных, `useTransition` для тяжёлых обновлений.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-polyfills-01", "deck": "Термины собеса", "kind": "topic", "q": "Что такое полифилл?", "code": "if (!Array.prototype.myMap) {\n  Array.prototype.myMap = function (cb) { /* ... */ };\n}", "a": "Код, который добавляет встроенный метод, если среда его не поддерживает. Сначала проверяем, есть ли метод, и только потом добавляем.", "hint": "Добавляем недостающий метод.", "added": "2026-10-27"}, {"id": "term-polyfills-02", "deck": "Термины собеса", "kind": "topic", "q": "Чем полифилл отличается от транспиляции?", "a": "Полифилл добавляет недостающие функции и методы (`Promise`, `Array.prototype.includes`). Транспилятор (Babel) переписывает новый синтаксис в старый (стрелки, `?.`). Полифиллы обычно берут из core-js.", "hint": "Метод или синтаксис?", "added": "2026-10-27"}, {"id": "term-polyfills-03", "deck": "Термины собеса", "kind": "topic", "q": "Напиши свой `map`. Что важно не забыть?", "code": "Array.prototype.myMap = function (cb) {\n  const result = [];\n  for (let i = 0; i < this.length; i++) {\n    result.push(cb(this[i], i, this));\n  }\n  return result;\n};", "a": "Массив берём из `this`, поэтому метод — обычная функция, не стрелка. Колбэк получает три аргумента: элемент, индекс, массив. Возвращаем новый массив, исходный не меняем.", "hint": "this, три аргумента колбэка, новый массив.", "added": "2026-10-27"}, {"id": "term-polyfills-04", "deck": "Термины собеса", "kind": "topic", "q": "Как устроен `Promise.all`, если писать его самому?", "code": "function all(promises) {\n  return new Promise((resolve, reject) => {\n    const results = [];\n    let done = 0;\n    promises.forEach((p, i) => {\n      Promise.resolve(p).then((v) => {\n        results[i] = v;\n        if (++done === promises.length) resolve(results);\n      }, reject);\n    });\n  });\n}", "a": "Возвращаем новый промис. Результаты кладём по индексу, чтобы сохранить порядок, считаем выполненные и вызываем `resolve`, когда готовы все. На первую ошибку — `reject`.", "hint": "Порядок по индексу, счётчик, первая ошибка.", "added": "2026-10-27"}, {"id": "term-polyfills-05", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «Полифиллы» полностью, как на собеседовании (4 шага).", "a": "1. Что: полифилл — код, который реализует встроенный метод, если его нет в старой среде.\n2. Как работает: проверяем, есть ли метод, и если нет — добавляем его в прототип, например `Array.prototype`.\n3. Пример: свой `map`: новый массив, в цикле вызываем колбэк с `(элемент, индекс, массив)`, массив берём из `this`.\n4. Подвох: полифилл добавляет методы, а новый синтаксис переводит транспилятор (Babel); на собесе просят написать с нуля `map`, `filter`, `reduce`, `bind`, `debounce`, `Promise.all`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-primitives-01", "deck": "Термины собеса", "kind": "topic", "q": "Какие типы данных есть в JS?", "a": "7 примитивов: string, number, bigint, boolean, undefined, null, symbol. Всё остальное — объекты, включая массивы и функции.", "hint": "7 + объекты.", "added": "2026-10-27"}, {"id": "term-primitives-02", "deck": "Термины собеса", "kind": "topic", "q": "Что выведет код и почему?", "code": "let a = 1;\nlet b = a;\nb = 2;\n\nconst x = { n: 1 };\nconst y = x;\ny.n = 2;\n\nconsole.log(a, x.n);", "a": "`1 2`. Примитив копируется по значению — `b` независима. Объект копируется по ссылке — `x` и `y` указывают на один объект.", "hint": "Что лежит в переменной с объектом?", "added": "2026-10-27"}, {"id": "term-primitives-03", "deck": "Термины собеса", "kind": "topic", "q": "Что вернёт `typeof` для разных значений?", "code": "typeof null;      // ?\ntypeof [];        // ?\ntypeof function(){}; // ?", "a": "`'object'`, `'object'`, `'function'`. `typeof null` — историческая ошибка языка. Массив проверяют через `Array.isArray`.", "hint": "Два подвоха: null и массив.", "added": "2026-10-27"}, {"id": "term-primitives-04", "deck": "Термины собеса", "kind": "topic", "q": "Что выведет `{} === {}`?", "a": "`false`. Объекты сравниваются по ссылке, а это два разных объекта. `true` будет, только если обе переменные ссылаются на один объект.", "hint": "Сравнивается содержимое или ссылка?", "added": "2026-10-27"}, {"id": "term-primitives-05", "deck": "Термины собеса", "kind": "topic", "q": "Что такое поверхностная копия?", "code": "const a = { user: { name: 'Саша' } };\nconst b = { ...a };\nb.user.name = 'Алекс';\nconsole.log(a.user.name); // 'Алекс'", "a": "Копируется только верхний уровень, вложенные объекты остаются общими по ссылке. Так копируют spread и `Object.assign`. Глубокая копия — `structuredClone`.", "hint": "Что происходит с вложенными объектами?", "added": "2026-10-27"}, {"id": "term-primitives-06", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «Примитивы и объекты» полностью, как на собеседовании (4 шага).", "a": "1. Что: в JS 7 примитивов — string, number, bigint, boolean, undefined, null, symbol — и объекты (массивы и функции тоже объекты).\n2. Как работает: примитивы копируются по значению, объекты — по ссылке: переменная хранит ссылку на объект.\n3. Пример: `const b = a; b.x = 2` — изменится и `a`, это один объект.\n4. Подвох: `typeof null` — `'object'` (историческая ошибка); объекты сравниваются по ссылке: `{} === {}` — `false`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-promise-01", "deck": "Термины собеса", "kind": "topic", "q": "Что такое промис? Дай определение.", "code": "const p = fetch('/api/user'); // Promise {<pending>}", "a": "Промис — это объект, который представляет результат асинхронной операции, например ответ сервера. Результата пока может не быть, но промис закончится успехом или ошибкой.", "hint": "Обязательные слова: «объект», «результат асинхронной операции».", "added": "2026-10-27"}, {"id": "term-promise-02", "deck": "Термины собеса", "kind": "topic", "q": "Какие состояния есть у промиса?", "a": "Три: pending — ожидание, fulfilled — выполнен успешно, rejected — отклонён с ошибкой. Состояние меняется один раз и навсегда. fulfilled или rejected вместе называют settled — завершён.", "hint": "Назови по-английски; меняется сколько раз?", "added": "2026-10-27"}, {"id": "term-promise-03", "deck": "Термины собеса", "kind": "topic", "q": "Как называется функция внутри `new Promise` и когда она выполняется?", "code": "new Promise((resolve, reject) => {\n  console.log('сразу');\n});", "a": "Это executor (функция-исполнитель). Выполняется сразу и синхронно, когда создаётся промис. Получает два аргумента — `resolve` и `reject`.", "hint": "Синхронно или потом?", "added": "2026-10-27"}, {"id": "term-promise-04", "deck": "Термины собеса", "kind": "topic", "q": "Что делают `resolve` и `reject`?", "code": "if (ok) resolve(data);\nelse reject(new Error('fail'));", "a": "`resolve(значение)` переводит промис в fulfilled и передаёт результат в `then`. `reject(ошибка)` переводит в rejected и передаёт ошибку в `catch`. Функцию они не останавливают — код после них выполнится.", "hint": "Какое состояние ставит каждый и куда уходит значение.", "added": "2026-10-27"}, {"id": "term-promise-05", "deck": "Термины собеса", "kind": "topic", "q": "Для чего `then`, `catch` и `finally`?", "code": "fetch(url)\n  .then((res) => res.json())\n  .catch((err) => console.error(err))\n  .finally(() => hideLoader());", "a": "`then` — обработчик успеха, `catch` — обработчик ошибки, `finally` — выполняется в любом случае, для уборки: скрыть лоадер, разблокировать кнопку. Каждый из них возвращает новый промис.", "hint": "Успех / ошибка / всегда.", "added": "2026-10-27"}, {"id": "term-promise-06", "deck": "Термины собеса", "kind": "topic", "q": "Что такое цепочка промисов (chaining)?", "code": "Promise.resolve(1)\n  .then((x) => x + 1)\n  .then((x) => console.log(x)); // 2", "a": "Каждый `then` возвращает новый промис, поэтому их можно ставить друг за другом. Что вернул один `then`, то получит следующий. Ошибка в любом месте перескакивает до ближайшего `catch`.", "hint": "Что возвращает `then`?", "added": "2026-10-27"}, {"id": "term-promise-07", "deck": "Термины собеса", "kind": "topic", "q": "Как называется очередь, куда попадает колбэк `then`? Что выведет код?", "code": "console.log(1);\nPromise.resolve().then(() => console.log(2));\nconsole.log(3);", "a": "Очередь микрозадач (microtask queue). Выведет `1 3 2`: колбэки `then`, `catch`, `finally` и код после `await` выполняются микрозадачами — после всего синхронного кода, но до `setTimeout`.", "hint": "Микро или макро?", "added": "2026-10-27"}, {"id": "term-promise-08", "deck": "Термины собеса", "kind": "topic", "q": "Что такое `async/await`?", "code": "async function getUser() {\n  try {\n    const res = await fetch('/api/user');\n    return await res.json();\n  } catch (err) {\n    console.error(err);\n  }\n}", "a": "Синтаксис над промисами. `async` — функция всегда возвращает промис. `await` приостанавливает функцию до результата промиса, остальной код снаружи идёт дальше. Ошибки ловим через `try/catch`.", "hint": "Что возвращает async-функция? Как ловить ошибки?", "added": "2026-10-27"}, {"id": "term-promise-09", "deck": "Термины собеса", "kind": "topic", "q": "Чем `Promise.all` отличается от `Promise.allSettled`?", "a": "`Promise.all` ждёт все промисы и падает сразу при первой ошибке. `Promise.allSettled` ждёт все и возвращает статус каждого, не падает. Ещё есть `race` — первый завершившийся, и `any` — первый успешный.", "hint": "Кто падает при первой ошибке?", "added": "2026-10-27"}, {"id": "term-promise-10", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про промис полностью, как на собеседовании (4 шага).", "a": "1. Что: промис — это объект, который представляет результат асинхронной операции, например ответ сервера.\n2. Как работает: у него три состояния — pending, fulfilled, rejected; меняется один раз. Внутри вызываем `resolve` или `reject`.\n3. Обработка: `then` — успех, `catch` — ошибка, `finally` — всегда. Колбэки идут микрозадачами, после синхронного кода.\n4. async/await: те же промисы, код читается сверху вниз; `await` приостанавливает функцию, ошибки ловим через `try/catch`.", "hint": "Что → состояния → обработка → async/await.", "added": "2026-10-27"}, {"id": "term-props-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое props?", "code": "function Greeting({ name }) {\n  return <p>Привет, {name}<\/p>;\n}\n<Greeting name=\"Саша\" />", "a": "Входные данные компонента от родителя. Только для чтения: компонент не должен их менять. Новые props от родителя вызывают ре-рендер.", "hint": "От родителя, только чтение.", "added": "2026-10-27"}, {"id": "term-props-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое state?", "code": "const [count, setCount] = useState(0);", "a": "Внутренние данные компонента, которые меняются со временем. Меняются только через сеттер — это сообщает React, что нужно перерисовать компонент.", "hint": "Свои данные + сеттер.", "added": "2026-10-27"}, {"id": "term-props-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое однонаправленный поток данных?", "code": "function Parent() {\n  const [text, setText] = useState('');\n  return <Input value={text} onChange={setText} />;\n}", "a": "Данные передаются сверху вниз через props. Ребёнок не меняет данные родителя напрямую, а вызывает колбэк, который родитель передал. Так понятно, кто владеет данными и откуда пришло изменение.", "hint": "Вниз — props, вверх — колбэки.", "added": "2026-10-27"}, {"id": "term-props-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое подъём состояния (lifting state up)?", "a": "Если двум компонентам нужны одни данные, состояние переносят в их ближайшего общего родителя и передают вниз через props.", "hint": "В общего родителя.", "added": "2026-10-27"}, {"id": "term-props-05", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «Props и state» полностью, как на собеседовании (4 шага).", "a": "1. Что: props — данные, которые компонент получает от родителя; state — данные, которыми компонент владеет сам.\n2. Как работает: props только для чтения; state меняется через сеттер, и это вызывает ре-рендер.\n3. Пример: `<Counter step={2} />` — `step` это проп; внутри `const [count, setCount] = useState(0)` — состояние.\n4. Однонаправленный поток: данные идут сверху вниз через props, а наверх — через колбэки, которые родитель передал вниз.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-proto-01", "deck": "Термины собеса", "kind": "topic", "q": "Что такое прототип?", "a": "Объект, на который ссылается скрытое свойство `[[Prototype]]` другого объекта. Если свойства нет в самом объекте, его ищут в прототипе.", "hint": "Скрытая ссылка на другой объект.", "added": "2026-10-27"}, {"id": "term-proto-02", "deck": "Термины собеса", "kind": "topic", "q": "Что такое цепочка прототипов? Что выведет код?", "code": "const arr = [1, 2];\nconsole.log(arr.hasOwnProperty('map'));    // ?\nconsole.log(typeof arr.map);              // ?", "a": "`false` и `'function'`. Своего `map` у массива нет: движок идёт по цепочке `arr → Array.prototype → Object.prototype → null` и находит `map` в `Array.prototype`.", "hint": "Где на самом деле лежит map?", "added": "2026-10-27"}, {"id": "term-proto-03", "deck": "Термины собеса", "kind": "topic", "q": "Чем `__proto__` отличается от `prototype`?", "code": "function User() {}\nconst u = new User();\nu.__proto__ === User.prototype; // true", "a": "`prototype` — свойство функции-конструктора: объект, который станет прототипом созданных через `new` объектов. `__proto__` — ссылка конкретного объекта на его прототип. Сейчас вместо `__proto__` используют `Object.getPrototypeOf`.", "hint": "Одно — у функции, другое — у объекта.", "added": "2026-10-27"}, {"id": "term-proto-04", "deck": "Термины собеса", "kind": "topic", "q": "Как создать объект с нужным прототипом?", "code": "const animal = { eat() { return 'ем'; } };\nconst cat = Object.create(animal);\ncat.eat(); // 'ем'", "a": "Через `Object.create(proto)` — создаёт пустой объект, у которого прототип — переданный объект.", "hint": "Метод Object.…", "added": "2026-10-27"}, {"id": "term-proto-05", "deck": "Термины собеса", "kind": "topic", "q": "Как `class` связан с прототипами?", "a": "`class` — синтаксический сахар над функциями-конструкторами и прототипами. Методы класса попадают в `ClassName.prototype`, а `extends` строит цепочку прототипов.", "hint": "Новый механизм или удобная запись?", "added": "2026-10-27"}, {"id": "term-proto-06", "deck": "Термины собеса", "kind": "topic", "q": "Расскажи про тему «Прототипы» полностью, как на собеседовании (4 шага).", "a": "1. Что: прототипное наследование — у каждого объекта есть скрытая ссылка `[[Prototype]]` на другой объект, его прототип.\n2. Как работает: если свойства нет в объекте, движок ищет его по цепочке прототипов до `Object.prototype`, дальше `null` — и возвращает `undefined`.\n3. Пример: у массива нет своего `map` — он берётся из `Array.prototype`.\n4. Зачем / подвох: методы хранятся один раз в прототипе, а не копируются в каждый объект; `class` — синтаксический сахар над прототипами.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-react19-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое Actions в React 19?", "code": "<form action={async (formData) => {\n  await save(formData.get('name'));\n}}>", "a": "Асинхронные функции, которые можно передать в `action` формы или запустить через `startTransition`. React сам отслеживает состояние ожидания, ошибки и сбрасывает форму.", "hint": "Асинхронная функция в action.", "added": "2026-10-27"}, {"id": "term-react19-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Что делает `useActionState`?", "code": "const [state, formAction, isPending] = useActionState(saveName, null);\n<form action={formAction}>", "a": "Связывает действие с состоянием его результата: возвращает последний результат, обёрнутое действие для формы и флаг `isPending`.", "hint": "Результат + action + pending.", "added": "2026-10-27"}, {"id": "term-react19-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Что делает `useOptimistic`?", "code": "const [optimistic, addOptimistic] = useOptimistic(todos, (s, t) => [...s, t]);", "a": "Показывает ожидаемый результат сразу, до ответа сервера. Когда действие завершится, React заменит оптимистичное значение настоящим, а при ошибке откатит.", "hint": "Показать результат заранее.", "added": "2026-10-27"}, {"id": "term-react19-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Что делает `use()`?", "code": "const user = use(userPromise);\nconst theme = use(ThemeContext);", "a": "Читает значение промиса (вместе с Suspense) или контекста. В отличие от других хуков, его можно вызывать в условиях и циклах.", "hint": "Промис или контекст; можно в if.", "added": "2026-10-27"}, {"id": "term-react19-05", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «Новое в React 19» полностью, как на собеседовании (4 шага).", "a": "1. Что: главное в React 19 — Actions (асинхронные функции для форм и мутаций) и новые хуки вокруг них.\n2. Хуки: `useActionState` — состояние результата и флаг pending для действия; `useOptimistic` — оптимистичное обновление UI до ответа сервера; `use()` — читает промис или контекст, можно в условиях.\n3. Пример: `<form action={saveAction}>` — React сам отправит форму и даст `isPending`.\n4. Ещё: `ref` как обычный проп (без `forwardRef`), `<Context>` вместо `<Context.Provider>`, метаданные (`<title>`) прямо в компонентах.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-rerender-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое ре-рендер?", "a": "Повторный вызов функции компонента: React получает новый JSX, сравнивает с прошлым и обновляет в DOM только изменившееся. Ре-рендер не значит, что DOM перерисован целиком.", "hint": "Вызов функции ≠ изменение DOM.", "added": "2026-10-27"}, {"id": "term-rerender-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Что вызывает ре-рендер компонента?", "a": "Изменение его state, изменение контекста, который он использует, и ре-рендер родителя. Когда родитель рендерится, по умолчанию рендерятся все его дети.", "hint": "Три причины.", "added": "2026-10-27"}, {"id": "term-rerender-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Перерисуется ли `Child`, если у него нет props?", "code": "function Parent() {\n  const [n, setN] = useState(0);\n  return <><button onClick={() => setN(n + 1)}>+<\/button><Child /><\/>;\n}", "a": "Да. При ре-рендере родителя React по умолчанию вызывает всех детей, даже без props. Чтобы пропустить — обернуть `Child` в `React.memo`.", "hint": "Без memo — да.", "added": "2026-10-27"}, {"id": "term-rerender-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Будет ли ре-рендер, если вызвать `setCount(count)` с тем же значением?", "a": "Нет. React сравнивает новое значение со старым через `Object.is` и при равенстве пропускает обновление. Поэтому с объектами нужна новая ссылка, а не мутация.", "hint": "Object.is.", "added": "2026-10-27"}, {"id": "term-rerender-05", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «Ре-рендер» полностью, как на собеседовании (4 шага).", "a": "1. Что: ре-рендер — повторный вызов функции компонента, чтобы получить новый JSX.\n2. Причины: изменился state, изменился контекст, который он читает, или перерендерился родитель — тогда по умолчанию перерисуются все дети.\n3. Что происходит: React вызывает компонент, сравнивает результат с прошлым и обновляет в DOM только отличия.\n4. Подвох: изменение props само по себе не причина — props меняются только потому, что перерендерился родитель; лишние ре-рендеры детей убирает `React.memo`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-rr_hooks-01", "deck": "Термины собеса · Router", "kind": "topic", "q": "Для чего `useNavigate`?", "code": "const navigate = useNavigate();\nasync function onSubmit() {\n  await save();\n  navigate('/profile', { replace: true });\n}", "a": "Для перехода из кода, а не по клику на ссылку: после отправки формы, логина. `navigate(-1)` — назад, `replace: true` — без новой записи в истории.", "hint": "Переход из кода.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_hooks-02", "deck": "Термины собеса · Router", "kind": "topic", "q": "Что возвращает `useParams`?", "code": "// маршрут: /users/:id\n// адрес:   /users/42\nconst { id } = useParams(); // '42'", "a": "Объект параметров пути, описанных через `:имя`. Значения всегда строки.", "hint": "Параметры :id, строкой.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_hooks-03", "deck": "Термины собеса · Router", "kind": "topic", "q": "Для чего `useSearchParams`?", "code": "const [params, setParams] = useSearchParams();\nconst page = params.get('page') ?? '1';\nsetParams({ page: '2' });", "a": "Читает и меняет query-параметры после `?`: фильтры, поиск, страницу. Состояние в URL сохраняется при обновлении и им можно поделиться ссылкой.", "hint": "?page=2.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_hooks-04", "deck": "Термины собеса · Router", "kind": "topic", "q": "Что даёт `useLocation`?", "a": "Текущий адрес: `pathname`, `search`, `hash` и `state`, переданный при навигации. Используют, например, чтобы после логина вернуть пользователя на страницу, с которой он пришёл.", "hint": "Объект адреса.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_hooks-05", "deck": "Термины собеса · Router", "kind": "topic", "q": "Расскажи про тему «Хуки роутера» полностью, как на собеседовании (4 шага).", "a": "1. useNavigate: переход из кода — после отправки формы или по таймеру: `navigate('/profile')`, `navigate(-1)` — назад.\n2. useParams: параметры пути из `:id` — `/users/42` → `{ id: '42' }`.\n3. useSearchParams: query-параметры после `?` — фильтры, поиск, пагинация; можно читать и менять.\n4. useLocation: текущий объект адреса (`pathname`, `search`, `state`) — например, чтобы вернуть пользователя туда, откуда он пришёл.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_lazy-01", "deck": "Термины собеса · Router", "kind": "topic", "q": "Как грузить страницу лениво?", "code": "const Admin = lazy(() => import('./pages/Admin'));\n<Route path=\"/admin\" element={\n  <Suspense fallback={<Spinner />}><Admin /><\/Suspense>\n} />", "a": "Через `React.lazy` и динамический `import()`, обёрнутый в `Suspense`. Сборщик вынесет страницу в отдельный файл, который загрузится при переходе.", "hint": "lazy + Suspense.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_lazy-02", "deck": "Термины собеса · Router", "kind": "topic", "q": "Как это сделать в data-режиме?", "code": "{ path: 'admin', lazy: () => import('./pages/Admin') }", "a": "Свойством маршрута `lazy`: оно возвращает модуль с `Component`, `loader` и `action`. Роутер загрузит его при переходе, параллельно с данными.", "hint": "Свойство lazy маршрута.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_lazy-03", "deck": "Термины собеса · Router", "kind": "topic", "q": "Расскажи про тему «Ленивая загрузка в роутере» полностью, как на собеседовании (4 шага).", "a": "1. Что: code splitting по маршрутам — код страницы грузится, только когда пользователь на неё переходит.\n2. Как работает: в декларативном режиме — `React.lazy` + `Suspense` вокруг элемента маршрута; в data-режиме — свойство маршрута `lazy`, которое возвращает компонент и `loader`.\n3. Пример: `const Admin = lazy(() => import('./pages/Admin'))` — админка не попадает в основной бандл.\n4. Зачем: меньше первый бандл — быстрее первый показ; маршрут — естественная граница для разделения.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_link-01", "deck": "Термины собеса · Router", "kind": "topic", "q": "Чем `Link` отличается от `<a>`?", "code": "<Link to=\"/about\">О нас<\/Link>", "a": "`Link` меняет URL через роутер без перезагрузки, состояние приложения сохраняется. Обычный `<a>` загружает страницу заново — для внутренних переходов в SPA это ошибка.", "hint": "Без перезагрузки.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_link-02", "deck": "Термины собеса · Router", "kind": "topic", "q": "Что умеет `NavLink`?", "code": "<NavLink to=\"/users\" className={({ isActive }) => (isActive ? 'active' : '')}>\n  Пользователи\n<\/NavLink>", "a": "То же, что `Link`, но знает, совпадает ли её путь с текущим, и даёт `isActive` для стилей активного пункта меню.", "hint": "isActive.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_link-03", "deck": "Термины собеса · Router", "kind": "topic", "q": "Расскажи про тему «Link, NavLink, a» полностью, как на собеседовании (4 шага).", "a": "1. Что: `Link` — ссылка без перезагрузки: меняет URL через роутер; `NavLink` — то же, но знает, активна ли она.\n2. Как работает: `Link` рендерит обычный `<a>`, но перехватывает клик и вызывает навигацию роутера.\n3. Пример: меню на `NavLink` — через `className={({ isActive }) => isActive ? 'active' : ''}` подсвечиваем текущий раздел.\n4. Подвох: обычный `<a href=\"/about\">` внутри SPA перезагрузит страницу и сбросит всё состояние; `<a>` нужен для внешних ссылок.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_loader-01", "deck": "Термины собеса · Router", "kind": "topic", "q": "Что такое `loader`?", "code": "{\n  path: 'users/:id',\n  loader: ({ params }) => fetch(`/api/users/${params.id}`),\n  element: <User />,\n}\n// в компоненте:\nconst user = useLoaderData();", "a": "Функция маршрута, которая загружает данные до рендера страницы. Компонент получает их через `useLoaderData`, без `useEffect` и состояния загрузки.", "hint": "Данные до рендера.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_loader-02", "deck": "Термины собеса · Router", "kind": "topic", "q": "Что такое `action` маршрута?", "code": "action: async ({ request }) => {\n  const form = await request.formData();\n  await createUser(form);\n  return redirect('/users');\n}", "a": "Обработчик отправки `<Form>` этого маршрута: получает данные формы, выполняет изменение, может сделать `redirect`. После него роутер перезапускает `loader`-ы.", "hint": "Обработчик формы.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_loader-03", "deck": "Термины собеса · Router", "kind": "topic", "q": "Расскажи про тему «loader и action» полностью, как на собеседовании (4 шага).", "a": "1. Что: в data-режиме у маршрута есть `loader` — функция загрузки данных до рендера страницы, и `action` — обработчик отправки формы.\n2. Как работает: при переходе роутер вызывает `loader`, ждёт данные и рендерит компонент; внутри данные берут через `useLoaderData`. `<Form method=\"post\">` вызывает `action`, после него `loader` перезапускается.\n3. Пример: страница пользователя грузит профиль в `loader({ params })` — нет «мигания» загрузки после рендера.\n4. Зачем: загрузка параллельно с загрузкой кода страницы, нет водопада запросов из `useEffect`, данные и мутации описаны рядом с маршрутом.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_new-01", "deck": "Термины собеса · Router", "kind": "topic", "q": "Что главное в React Router v7?", "a": "Слияние с Remix: один пакет `react-router` и три режима — декларативный, data и framework. Framework-режим даёт файловые маршруты, SSR и типизацию маршрутов.", "hint": "Слились с Remix.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_new-02", "deck": "Термины собеса · Router", "kind": "topic", "q": "Сложно ли перейти с v6 на v7?", "a": "Нет: декларативный режим почти не изменился, импорты переходят в пакет `react-router`. Возможности data- и framework-режима подключаются по желанию.", "hint": "Почти без изменений.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_new-03", "deck": "Термины собеса · Router", "kind": "topic", "q": "Расскажи про тему «Новое в React Router v7+» полностью, как на собеседовании (4 шага).", "a": "1. Что: React Router v7 объединился с Remix: один пакет `react-router` и три режима — декларативный, data и framework.\n2. Как работает: в framework-режиме маршруты описываются файлами, есть SSR, загрузка данных на сервере, типизация параметров и данных маршрутов.\n3. Пример: приложение на v6 переводится на v7 почти без изменений — декларативный режим остался прежним.\n4. Что говорить: «знаю декларативный и data-режим, понимаю, что framework-режим — это бывший Remix с SSR»; про самые свежие изменения версий — смотрю changelog.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_protected-01", "deck": "Термины собеса · Router", "kind": "topic", "q": "Как сделать защищённый маршрут?", "code": "function RequireAuth() {\n  const { user } = useAuth();\n  const location = useLocation();\n  if (!user) return <Navigate to=\"/login\" replace state={{ from: location }} />;\n  return <Outlet />;\n}", "a": "Обёртка проверяет авторизацию: если пользователя нет — перенаправляет на логин через `Navigate`, если есть — рендерит вложенные маршруты через `Outlet`.", "hint": "Navigate или Outlet.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_protected-02", "deck": "Термины собеса · Router", "kind": "topic", "q": "Что делает компонент `Navigate`?", "a": "При рендере сразу перенаправляет на указанный путь. `replace` заменяет запись в истории, чтобы кнопка «назад» не возвращала на закрытую страницу.", "hint": "Редирект при рендере.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_protected-03", "deck": "Термины собеса · Router", "kind": "topic", "q": "Достаточно ли защищённого маршрута для безопасности?", "a": "Нет. Он только скрывает интерфейс. Код на клиенте можно обойти, поэтому сервер обязан проверять токен и права на каждый запрос.", "hint": "Проверяет сервер.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_protected-04", "deck": "Термины собеса · Router", "kind": "topic", "q": "Расскажи про тему «Защищённый маршрут» полностью, как на собеседовании (4 шага).", "a": "1. Что: защищённый маршрут пускает на страницу только авторизованного пользователя.\n2. Как работает: компонент-обёртка проверяет авторизацию: есть доступ — рендерит `<Outlet />` (или `children`), нет — `<Navigate to=\"/login\" replace />`.\n3. Пример: в `state` навигации передают откуда пришли, чтобы после логина вернуть пользователя обратно.\n4. Подвох: это защита интерфейса, а не данных — настоящую проверку прав делает сервер.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_routes-01", "deck": "Термины собеса · Router", "kind": "topic", "q": "Как описать маршруты?", "code": "<Routes>\n  <Route path=\"/\" element={<Home />} />\n  <Route path=\"/about\" element={<About />} />\n<\/Routes>", "a": "`Routes` выбирает подходящий по URL `Route`, `Route` связывает путь с элементом, который нужно показать.", "hint": "Путь → элемент.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_routes-02", "deck": "Термины собеса · Router", "kind": "topic", "q": "Что такое `Outlet`?", "code": "function Layout() {\n  return <><Header /><Outlet /><Footer /><\/>;\n}", "a": "Место в родительском маршруте, куда рендерится совпавший дочерний маршрут. Так делают общий layout для группы страниц.", "hint": "Место для дочернего маршрута.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_routes-03", "deck": "Термины собеса · Router", "kind": "topic", "q": "Что такое index-маршрут?", "code": "<Route path=\"/\" element={<Layout />}>\n  <Route index element={<Home />} />\n<\/Route>", "a": "Дочерний маршрут без своего пути — показывается в `Outlet`, когда URL совпадает ровно с путём родителя.", "hint": "Дочерний по умолчанию.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_routes-04", "deck": "Термины собеса · Router", "kind": "topic", "q": "Как сделать страницу 404?", "code": "<Route path=\"*\" element={<NotFound />} />", "a": "Маршрут с `path=\"*\"` совпадает с любым путём, для которого не нашлось другого маршрута.", "hint": "path=\"*\".", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_routes-05", "deck": "Термины собеса · Router", "kind": "topic", "q": "Расскажи про тему «Routes, Outlet, 404» полностью, как на собеседовании (4 шага).", "a": "1. Что: `Routes` выбирает один подходящий `Route` по текущему URL; `Route` связывает путь и элемент.\n2. Вложенные маршруты: дочерние `Route` рендерятся внутри родителя на месте `<Outlet />` — так делают общий layout (шапка, меню).\n3. Пример: `<Route path=\"/\" element={<Layout />}><Route index element={<Home />} /><Route path=\"users/:id\" element={<User />} /><\/Route>`.\n4. 404: маршрут `path=\"*\"` ловит все несовпавшие пути — обычно последним.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_spa-01", "deck": "Термины собеса · Router", "kind": "topic", "q": "Как работает роутинг в SPA?", "a": "Сайт загружается один раз. При переходе роутер меняет URL через History API без запроса к серверу и показывает компонент, соответствующий новому пути.", "hint": "History API без перезагрузки.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_spa-02", "deck": "Термины собеса · Router", "kind": "topic", "q": "Почему при обновлении страницы `/profile` бывает 404?", "a": "Браузер запрашивает `/profile` у сервера, а там такого файла нет. Сервер нужно настроить так, чтобы на все пути отдавался `index.html`, а дальше разберётся роутер.", "hint": "Сервер должен отдавать index.html.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_spa-03", "deck": "Термины собеса · Router", "kind": "topic", "q": "Какие режимы есть в React Router v7?", "a": "Декларативный — `BrowserRouter` и `Routes` в JSX. Data — `createBrowserRouter` с загрузкой данных через `loader` и `action`. Framework — полноценный фреймворк с файловыми маршрутами и SSR (бывший Remix).", "hint": "Декларативный, data, framework.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rr_spa-04", "deck": "Термины собеса · Router", "kind": "topic", "q": "Расскажи про тему «Роутинг в SPA» полностью, как на собеседовании (4 шага).", "a": "1. Что: в SPA одна HTML-страница, а смена «страниц» — это смена компонентов без перезагрузки; роутер синхронизирует URL и интерфейс.\n2. Как работает: роутер использует History API (`pushState`) — меняет адрес без запроса к серверу и рендерит компонент под этот путь.\n3. Режимы React Router v7: декларативный (`<BrowserRouter>` + `<Routes>`), data (`createBrowserRouter` с `loader`/`action`), framework (бывший Remix: файловые маршруты, SSR).\n4. Подвох: при обновлении страницы на `/profile` запрос идёт на сервер — сервер должен отдавать `index.html` на все пути (fallback).", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-10"}, {"id": "term-rtk_flow-01", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что такое action?", "code": "{ type: 'cart/add', payload: { id: 1, title: 'Чай' } }", "a": "Обычный объект, который описывает, что произошло. Поле `type` обязательно, данные обычно кладут в `payload`.", "hint": "Объект «что случилось».", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_flow-02", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что делает `dispatch`?", "code": "const dispatch = useDispatch();\ndispatch(addToCart(item));", "a": "Отправляет action в store. Store передаёт его в редьюсер, сохраняет новое состояние и уведомляет подписчиков.", "hint": "Отправить действие.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_flow-03", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что такое reducer в Redux?", "code": "function counter(state = 0, action) {\n  if (action.type === 'inc') return state + 1;\n  return state;\n}", "a": "Чистая функция `(state, action) => newState`. Не мутирует старое состояние, не делает запросов и не вызывает случайностей.", "hint": "Чистая функция.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_flow-04", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что такое store?", "a": "Объект, который хранит всё состояние приложения, принимает действия через `dispatch`, отдаёт состояние через `getState` и уведомляет подписчиков об изменениях.", "hint": "Хранилище + dispatch + подписка.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_flow-05", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Расскажи про тему «Поток данных в Redux» полностью, как на собеседовании (4 шага).", "a": "1. Что: однонаправленный цикл: UI → dispatch(action) → reducer → новый state в store → UI.\n2. Как работает: компонент вызывает `dispatch` с action (`{ type, payload }`); reducer — чистая функция `(state, action) => newState`; store сохраняет результат и уведомляет подписчиков.\n3. Пример: `dispatch(addToCart(item))` → редьюсер корзины добавил товар → `useSelector` в шапке увидел новое количество.\n4. Правило: состояние меняется только через действия, редьюсеры чистые и без мутаций (в RTK это делает Immer).", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_mw-01", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что такое middleware в Redux?", "code": "const logger = (store) => (next) => (action) => {\n  console.log('до', store.getState());\n  const result = next(action);\n  console.log('после', store.getState());\n  return result;\n};", "a": "Функция-прослойка между `dispatch` и редьюсером. Видит каждое действие и может его залогировать, изменить, задержать или не пропустить дальше.", "hint": "Между dispatch и reducer.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_mw-02", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что делает thunk middleware?", "code": "const loadUser = (id) => async (dispatch) => {\n  dispatch(started());\n  const user = await api.get(id);\n  dispatch(loaded(user));\n};", "a": "Позволяет диспатчить функцию вместо объекта. Middleware вызывает её и передаёт `dispatch` и `getState` — так пишут асинхронную логику.", "hint": "dispatch функции.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_mw-03", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что будет, если middleware не вызовет `next(action)`?", "a": "Действие не дойдёт до редьюсера — состояние не изменится. Так можно фильтровать действия.", "hint": "Действие остановится.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_mw-04", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Расскажи про тему «Middleware» полностью, как на собеседовании (4 шага).", "a": "1. Что: middleware — прослойка между `dispatch` и редьюсером, которая может посмотреть, изменить, задержать или остановить action.\n2. Как работает: цепочка функций `store => next => action => { ... next(action) }`; вызов `next` передаёт действие дальше.\n3. Пример: thunk (позволяет диспатчить функции), логгер, отправка аналитики, RTK Query middleware.\n4. Зачем: вынести побочные эффекты и асинхронность из редьюсеров, которые должны оставаться чистыми.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_norm-01", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что такое нормализованное состояние?", "code": "{\n  ids: [1, 2],\n  entities: {\n    1: { id: 1, title: 'Купить чай' },\n    2: { id: 2, title: 'Учить RTK' },\n  },\n}", "a": "Сущности хранятся в словаре по id, а порядок — отдельным массивом id. Нет дублей, доступ и обновление по id — без обхода массива.", "hint": "Словарь по id + массив id.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_norm-02", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что даёт `createEntityAdapter`?", "code": "const adapter = createEntityAdapter();\nconst slice = createSlice({\n  name: 'todos',\n  initialState: adapter.getInitialState(),\n  reducers: { added: adapter.addOne, removed: adapter.removeOne },\n});", "a": "Готовую нормализованную структуру, редьюсеры для CRUD (`addOne`, `updateOne`, `removeOne`, `setAll`) и селекторы (`selectAll`, `selectById`).", "hint": "CRUD и селекторы из коробки.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_norm-03", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Расскажи про тему «Нормализация и createEntityAdapter» полностью, как на собеседовании (4 шага).", "a": "1. Что: нормализация — хранить сущности как словарь по id плюс массив id, а не вложенными массивами.\n2. Зачем: быстрый доступ по id, нет дублей, обновление одного элемента не требует обхода массива.\n3. createEntityAdapter: даёт готовую форму `{ ids: [], entities: {} }`, редьюсеры `addOne`, `updateOne`, `removeOne`, `setAll` и селекторы `selectAll`, `selectById`.\n4. Пример: список задач: `entities: { 1: {...}, 2: {...} }, ids: [1, 2]`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_query-01", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что такое RTK Query?", "code": "export const api = createApi({\n  baseQuery: fetchBaseQuery({ baseUrl: '/api' }),\n  endpoints: (b) => ({\n    getUsers: b.query({ query: () => 'users' }),\n  }),\n});\nexport const { useGetUsersQuery } = api;", "a": "Инструмент RTK для запросов: по описанию endpoints генерирует хуки с данными, статусом загрузки и ошибкой, а результаты кэширует.", "hint": "Хуки запросов + кэш.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_query-02", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Чем query отличается от mutation?", "a": "Query — получение данных (GET), вызывается автоматически при монтировании и кэшируется. Mutation — изменение данных (POST, PUT, DELETE), вызывается вручную функцией-триггером.", "hint": "Получить или изменить.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_query-03", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Как обновить список после добавления элемента?", "code": "getUsers: b.query({ query: () => 'users', providesTags: ['User'] }),\naddUser: b.mutation({ query: (u) => ({ url: 'users', method: 'POST', body: u }), invalidatesTags: ['User'] }),", "a": "Через теги: запрос помечает данные `providesTags`, мутация объявляет их устаревшими `invalidatesTags` — RTK Query сам перезапросит список.", "hint": "provides / invalidates.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_query-04", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Когда RTK Query, а когда `createAsyncThunk`?", "a": "RTK Query — для обычной работы с API: кэш, загрузка, повторные запросы из коробки. `createAsyncThunk` — когда нужна своя асинхронная логика: несколько шагов, работа с разными слайсами.", "hint": "API — Query, своя логика — thunk.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_query-05", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Расскажи про тему «RTK Query» полностью, как на собеседовании (4 шага).", "a": "1. Что: RTK Query — встроенный в RTK инструмент для запросов и кэширования серверных данных.\n2. Как работает: описываем `createApi` с endpoints, получаем готовые хуки `useGetUsersQuery`, `useAddUserMutation` с `data`, `isLoading`, `error`.\n3. Кэш: одинаковые запросы не дублируются; после мутации нужные данные перезапрашиваются через теги (`providesTags`, `invalidatesTags`).\n4. Что выбрать: для работы с API — RTK Query (меньше кода, кэш); `createAsyncThunk` — для нестандартной логики, где запрос — лишь часть процесса.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_select-01", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что такое селектор?", "code": "const selectItems = (state) => state.cart.items;\nconst items = useSelector(selectItems);", "a": "Функция, которая получает весь state и возвращает нужную часть. Позволяет не знать структуру стора в компонентах.", "hint": "(state) => часть.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_select-02", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Когда компонент с `useSelector` перерендерится?", "a": "Когда результат селектора изменился по ссылке (`===`). Если селектор возвращает новый массив на каждый вызов, компонент будет рендериться при любом действии.", "hint": "Сравнение по ссылке.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_select-03", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что делает `createSelector`?", "code": "const selectDone = createSelector(\n  [(s) => s.todos.items],\n  (items) => items.filter((t) => t.done),\n);", "a": "Создаёт мемоизированный селектор: пересчитывает результат только при изменении входных данных, иначе отдаёт ту же ссылку.", "hint": "Мемоизация селектора.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_select-04", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Расскажи про тему «Селекторы» полностью, как на собеседовании (4 шага).", "a": "1. Что: селектор — функция, которая достаёт данные из state: `(state) => state.cart.items`.\n2. useSelector: подписывает компонент на результат селектора; компонент рендерится, только когда результат изменился по ссылке.\n3. createSelector: мемоизированный селектор — пересчитывает производные данные, только когда изменились входные.\n4. Подвох: селектор, который каждый раз возвращает новый массив или объект (`filter`, `map`), вызывает ре-рендер на любое действие — его оборачивают в `createSelector`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_slice-01", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что делает `createSlice`?", "code": "const cartSlice = createSlice({\n  name: 'cart',\n  initialState: { items: [] },\n  reducers: {\n    add(state, action) { state.items.push(action.payload); },\n  },\n});\nexport const { add } = cartSlice.actions;", "a": "Создаёт кусок состояния: редьюсер и action creators. Тип действия генерируется из имени: `cart/add`.", "hint": "Редьюсер + экшены сразу.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_slice-02", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Почему в RTK можно писать `state.items.push`?", "a": "`createSlice` использует Immer: мы меняем черновик (draft), а Immer создаёт новую неизменяемую копию. Снаружи состояние остаётся иммутабельным.", "hint": "Immer и draft.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_slice-03", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что не так в этом редьюсере?", "code": "reset(state) {\n  state.items = [];\n  return { items: [] };\n}", "a": "Нельзя одновременно менять draft и возвращать новое значение — Immer выбросит ошибку. Либо мутируем draft, либо возвращаем новый объект.", "hint": "Одно из двух.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_slice-04", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Зачем `extraReducers`?", "code": "extraReducers: (builder) => {\n  builder.addCase(fetchUser.fulfilled, (state, action) => {\n    state.user = action.payload;\n  });\n}", "a": "Чтобы slice реагировал на действия, которые он сам не создавал: от thunk-ов (`pending`, `fulfilled`, `rejected`) или других слайсов.", "hint": "Чужие действия.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_slice-05", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Расскажи про тему «createSlice» полностью, как на собеседовании (4 шага).", "a": "1. Что: slice — кусок состояния вместе с его редьюсерами; `createSlice` создаёт их одной функцией.\n2. Как работает: описываем `name`, `initialState` и `reducers` — RTK сам генерирует action creators и `type` вида `'cart/add'`.\n3. Пример: `add(state, action) { state.items.push(action.payload) }` — пишем «мутирующий» код, а Immer делает неизменяемую копию.\n4. Подвох: в редьюсере либо мутируем draft, либо возвращаем новое значение — но не то и другое сразу; `extraReducers` — для чужих действий (thunk-и).", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_store-01", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что делает `configureStore`?", "code": "export const store = configureStore({\n  reducer: { cart: cartReducer, user: userReducer },\n});", "a": "Создаёт store: объединяет редьюсеры, подключает thunk, включает Redux DevTools и в dev-режиме проверяет мутации и несериализуемые данные.", "hint": "Store с настройками по умолчанию.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_store-02", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Как получить тип всего состояния?", "code": "export type RootState = ReturnType<typeof store.getState>;\nexport type AppDispatch = typeof store.dispatch;", "a": "Через `ReturnType<typeof store.getState>`. А тип dispatch — `typeof store.dispatch`, с ним правильно типизируются thunk-и.", "hint": "ReturnType + typeof.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_store-03", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Как подключить store к React?", "code": "<Provider store={store}>\n  <App />\n<\/Provider>", "a": "Обернуть приложение в `Provider` из `react-redux` и передать store. Внутри компоненты используют `useSelector` и `useDispatch`.", "hint": "Provider store={store}.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_store-04", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Расскажи про тему «configureStore» полностью, как на собеседовании (4 шага).", "a": "1. Что: `configureStore` — функция RTK для создания store с правильными настройками по умолчанию.\n2. Что делает за тебя: объединяет редьюсеры из объекта, подключает thunk middleware, включает Redux DevTools и в разработке — проверки на мутации и несериализуемые значения.\n3. Пример: `configureStore({ reducer: { cart: cartReducer, user: userReducer } })`.\n4. Типизация: `type RootState = ReturnType<typeof store.getState>`, `type AppDispatch = typeof store.dispatch` — для типизированных `useSelector` и `useDispatch`.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_thunk-01", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что такое `createAsyncThunk`?", "code": "export const fetchUsers = createAsyncThunk('users/fetch', async () => {\n  const res = await fetch('/api/users');\n  return res.json();\n});", "a": "Функция для асинхронных действий. Она сама отправляет `pending` в начале, `fulfilled` с результатом или `rejected` с ошибкой.", "hint": "Три состояния запроса.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_thunk-02", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Как обработать три состояния thunk-а?", "code": "builder\n  .addCase(fetchUsers.pending, (s) => { s.loading = true; })\n  .addCase(fetchUsers.fulfilled, (s, a) => { s.loading = false; s.list = a.payload; })\n  .addCase(fetchUsers.rejected, (s, a) => { s.loading = false; s.error = a.error.message; });", "a": "В `extraReducers`: `pending` — включаем загрузку, `fulfilled` — сохраняем `action.payload`, `rejected` — сохраняем ошибку и выключаем загрузку.", "hint": "loading / data / error.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_thunk-03", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Зачем `rejectWithValue`?", "code": "async (id, { rejectWithValue }) => {\n  const res = await fetch(`/api/users/${id}`);\n  if (!res.ok) return rejectWithValue(await res.json());\n  return res.json();\n}", "a": "Чтобы передать в `rejected` свои данные об ошибке (например, ответ сервера) в `action.payload`. Иначе там будет только сериализованный `action.error`.", "hint": "Своя ошибка в payload.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_thunk-04", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что делает `.unwrap()`?", "code": "try {\n  const user = await dispatch(fetchUser(1)).unwrap();\n} catch (e) { showToast(e); }", "a": "Превращает результат `dispatch(thunk())` в обычный промис: возвращает данные при успехе или бросает ошибку при `rejected`. Удобно в обработчиках формы.", "hint": "Данные или throw.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_thunk-05", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Расскажи про тему «createAsyncThunk» полностью, как на собеседовании (4 шага).", "a": "1. Что: `createAsyncThunk` — способ описать асинхронное действие (запрос), которое само отправляет три action: pending, fulfilled, rejected.\n2. Как работает: `dispatch(fetchUsers())` → сразу `pending` → после ответа `fulfilled` с данными в `payload` или `rejected` с ошибкой.\n3. Пример: в `extraReducers` на `pending` ставим `loading = true`, на `fulfilled` кладём данные, на `rejected` — текст ошибки.\n4. Подвох: свою ошибку сервера отдают через `rejectWithValue`; результат `dispatch(thunk())` — промис, `.unwrap()` даёт данные или бросает ошибку.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_why-01", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Что такое Redux?", "a": "Библиотека для глобального состояния: одно хранилище (store), изменения только через действия (actions) и чистые функции-редьюсеры. Поток данных предсказуемый и отлаживается через Redux DevTools.", "hint": "Store + actions + reducers.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_why-02", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Чем Redux лучше Context для большого состояния?", "a": "Компонент подписывается на конкретную часть стора через `useSelector` и рендерится только при её изменении. В Context при смене value рендерятся все потребители. Плюс DevTools, middleware, единые правила.", "hint": "Подписка на часть состояния.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_why-03", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Когда Redux не нужен?", "a": "В небольших приложениях, для локального состояния компонента и для редко меняющихся глобальных данных — там хватает `useState` и Context. Данные с сервера удобнее держать в RTK Query или TanStack Query.", "hint": "Маленькое или редкое — без Redux.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-rtk_why-04", "deck": "Термины собеса · Redux", "kind": "topic", "q": "Расскажи про тему «Зачем Redux» полностью, как на собеседовании (4 шага).", "a": "1. Что: Redux — глобальное хранилище состояния вне компонентов с предсказуемым потоком изменений.\n2. Чем лучше Context: компоненты подписываются на часть состояния через селекторы и рендерятся только при её изменении; есть DevTools с историей действий и middleware для асинхронной логики.\n3. Пример: корзина, пользователь и фильтры, которые меняются часто и нужны в разных частях приложения.\n4. Когда не нужен: маленькое приложение или редко меняющиеся данные (тема, язык) — хватит Context; серверные данные часто удобнее в RTK Query или TanStack Query.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27", "from": "2026-11-09"}, {"id": "term-ssr-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое CSR?", "a": "Client-Side Rendering: сервер отдаёт почти пустой HTML и JS-бандл, интерфейс собирается в браузере. Минус — дольше первый показ и хуже SEO.", "hint": "Рендер в браузере.", "added": "2026-10-27"}, {"id": "term-ssr-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое SSR и гидратация?", "a": "Server-Side Rendering: сервер отдаёт готовый HTML — контент виден сразу. Гидратация — браузер загружает JS и «оживляет» этот HTML: навешивает обработчики, подключает состояние.", "hint": "Готовый HTML + оживление.", "added": "2026-10-27"}, {"id": "term-ssr-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое Server Components?", "a": "Компоненты, которые выполняются только на сервере: могут напрямую читать базу или файлы, их код не попадает в бандл. Нет `useState`, `useEffect` и обработчиков — для этого клиентские компоненты с `'use client'`.", "hint": "Только сервер, без JS в браузере.", "added": "2026-10-27"}, {"id": "term-ssr-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «CSR, SSR, Server Components» полностью, как на собеседовании (4 шага).", "a": "1. Что: CSR — HTML собирается в браузере из JS; SSR — сервер отдаёт готовый HTML, потом браузер его гидрирует; Server Components — компоненты, которые выполняются только на сервере и не отправляют свой JS клиенту.\n2. Как работает: при CSR сначала пустая страница и загрузка бандла; при SSR контент виден сразу, интерактивность — после гидратации.\n3. Пример: Vite + React — CSR; Next.js — SSR и Server Components.\n4. Зачем: SSR — быстрый первый показ и SEO; Server Components — меньше JS в браузере, данные прямо с сервера; но в них нет state и эффектов — для интерактива нужны `'use client'` компоненты.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-suspense-01", "deck": "Термины собеса · React", "kind": "topic", "q": "Что делает `React.lazy`?", "code": "const Settings = lazy(() => import('./Settings'));", "a": "Загружает компонент только когда он впервые нужен. Сборщик выносит его в отдельный файл — первоначальный бандл меньше. Используется вместе с `Suspense`.", "hint": "Отдельный чанк по требованию.", "added": "2026-10-27"}, {"id": "term-suspense-02", "deck": "Термины собеса · React", "kind": "topic", "q": "Что делает `Suspense`?", "code": "<Suspense fallback={<Spinner />}>\n  <Settings />\n<\/Suspense>", "a": "Показывает `fallback`, пока компонент внутри ждёт: ленивую загрузку кода или данные через `use()`. Когда готово — показывает содержимое.", "hint": "fallback на время ожидания.", "added": "2026-10-27"}, {"id": "term-suspense-03", "deck": "Термины собеса · React", "kind": "topic", "q": "Что такое Error Boundary?", "code": "class ErrorBoundary extends Component {\n  state = { hasError: false };\n  static getDerivedStateFromError() { return { hasError: true }; }\n  render() { return this.state.hasError ? <p>Ошибка<\/p> : this.props.children; }\n}", "a": "Компонент, который ловит ошибки рендера в своём поддереве и показывает запасной интерфейс вместо белого экрана. Пишется классом или через библиотеку `react-error-boundary`.", "hint": "Ловит ошибки рендера.", "added": "2026-10-27"}, {"id": "term-suspense-04", "deck": "Термины собеса · React", "kind": "topic", "q": "Какие ошибки Error Boundary не ловит?", "a": "Ошибки в обработчиках событий, в асинхронном коде (`setTimeout`, промисы), в самом Error Boundary и при серверном рендере. Их ловят через `try/catch`.", "hint": "События и асинхронность.", "added": "2026-10-27"}, {"id": "term-suspense-05", "deck": "Термины собеса · React", "kind": "topic", "q": "Расскажи про тему «lazy, Suspense, Error Boundary» полностью, как на собеседовании (4 шага).", "a": "1. Что: `React.lazy` — ленивая загрузка компонента; Suspense — показывает fallback, пока что-то внутри грузится; Error Boundary — ловит ошибки рендера в поддереве и показывает запасной UI.\n2. Как работает: `lazy(() => import('./Page'))` делает отдельный чанк; Suspense ловит «ожидание» и показывает `fallback`.\n3. Пример: `<Suspense fallback={<Spinner />}><Settings /><\/Suspense>`.\n4. Подвох: Error Boundary — классовый компонент (`getDerivedStateFromError`, `componentDidCatch`) или библиотека `react-error-boundary`; ошибки в обработчиках событий и асинхронном коде он не ловит.", "hint": "Что → как работает → пример → зачем / подвох.", "added": "2026-10-27"}, {"id": "term-syntax-01", "deck": "Термины собеса", "kind": "topic", "q": "Что такое шаблонные строки?", "code": "const msg = `Привет, ${user.name}!`;", "a": "Строки в обратных кавычках. В них можно подставлять выражения через `${}` и писать в несколько строк.", "hint": "Обратные кавычки.", "added": "2026-10-27"}, {"id": "term-syntax-02", "deck": "Термины собеса", "kind": "topic", "q": "Что делает `?.`?", "code": "const city = user?.address?.city;\nuser.getName?.();", "a": "Если значение слева `null` или `undefined`, выражение возвращает `undefined` вместо ошибки «Cannot read properties of undefined».", "hint": "Вместо ошибки — undefined.", "added": "2026-10-27"}, {"id": "term-syntax-03", "deck": "Термины собеса", "kind": "topic", "q": "Что делает `??`?", "code": "const count = data.count ?? 10;", "a": "Возвращает правое значение, только если левое `null` или `undefined`. Иначе — левое.", "hint": "Только null и undefined.", "added": "2026-10-27"}, {"id": "term-syntax-04", "deck": "Термины собеса", "kind": "topic", "q": "Что выведет код?", "code": "const a = 0 || 10;\nconst b = 0 ?? 10;\nconsole.log(a, b);", "a": "`10 0`. `||` заменяет любое falsy-значение, включая `0` и `''`. `??` — только `null` и `undefined`, поэтому `0
